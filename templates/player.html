  // Navigating from inside the sheet (scene/thread/actor) closes it after the tap.
  const rail = document.getElementById("followRail");
  if (rail) rail.addEventListener("click", e => {
    if (e.target.closest(".scene-card, .scene-ref-chip, [data-actor-id], .idea-card, .scene-section-view")) {
      setTimeout(closeSheet, 60);
    }
  });
})();

audioEl.addEventListener("play", () => setPlaying(true));
audioEl.addEventListener("pause", () => setPlaying(false));
audioEl.addEventListener("ended", () => {
  if (currentEpIdx < SERIES.episodes.length - 1) loadEpisode(currentEpIdx + 1, true);
  else setPlaying(false);
});
audioEl.addEventListener("loadedmetadata", () => {
  timeTotal.textContent = formatTime(audioEl.duration);
  recomputeSceneScale();   // normalize follow offsets to the real audio length
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const rect = canvas.getBoundingClientRect();
    const barCount = Math.floor(rect.width / 4);
    waveformBars = generateBars(SERIES.episodes[currentEpIdx].episode_number, barCount);
    const progress = audioEl.duration ? audioEl.currentTime / audioEl.duration : 0;
    drawWaveform(progress);
  }, 100);
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target === document.body) { e.preventDefault(); btnPlay.click(); }
  if (e.code === "ArrowLeft") audioEl.currentTime = Math.max(0, audioEl.currentTime - 10);
  if (e.code === "ArrowRight") audioEl.currentTime = Math.min(audioEl.duration || 0, audioEl.currentTime + 10);
  if (e.key === "Escape") {
    if (document.body.classList.contains("mode-actor")) {
      exitActorMode();
    } else if (currentScene || currentActor) {
      currentScene = null; currentActor = null;
      renderRightPane();
    }
  }
});

// ── ACTOR PAGE ────────────────────────────────────────────────────────────
// Hash route: #/actor/<id>            → series mode (cold land)
//             #/actor/<id>?ep=<n>     → episode mode (from cast accordion)
// In actor mode, the left rail swaps to actor portrait + mode toggle, the
// right pane renders the actor spread. Other episode UI is hidden via
// body.mode-actor. The browser back button works because the route lives
// in the hash.

let actorRouteId = null;
let actorRouteMode = "series";    // "episode" | "series"
let actorRouteEpNum = null;       // integer episode_number or null
let actorReturnEpIdx = 0;         // episode index to restore on exit

const actorRail = document.getElementById("actorRail");
const actorRailPortrait = document.getElementById("actorRailPortrait");
const actorRailName = document.getElementById("actorRailName");
const actorRailAliases = document.getElementById("actorRailAliases");
const actorRailMeta = document.getElementById("actorRailMeta");
const actorRailContext = document.getElementById("actorRailContext");
const actorRailBack = document.getElementById("actorRailBack");

function parseActorHash(hash) {
  // Match #/actor/<id>           → {id, ep: null}
  //       #/actor/<id>?ep=<n>    → {id, ep: <n>}
  const m = /^#\/actor\/([^?]+)(?:\?ep=(\d+))?$/.exec(hash || "");
  if (!m) return null;
  return { id: decodeURIComponent(m[1]), ep: m[2] ? parseInt(m[2], 10) : null };
}

function applyHashRoute() {
  const parsed = parseActorHash(location.hash);
  if (parsed && ACTOR_BY_ID[parsed.id]) {
    enterActorMode(parsed.id, parsed.ep);
  } else if (document.body.classList.contains("mode-actor")) {
    exitActorMode();
  }
}

function enterActorMode(actorId, epNum) {
  if (!actorRail) return;
  if (!document.body.classList.contains("mode-actor")) {
    actorReturnEpIdx = currentEpIdx;
  }
  actorRouteId = actorId;
  actorRouteEpNum = (epNum !== null && epNum !== undefined) ? epNum : null;
  // Default to episode mode when arriving with an episode context; series
  // mode when cold-landed without one.
  actorRouteMode = (actorRouteEpNum !== null) ? "episode" : "series";
  document.body.classList.add("mode-actor");
  actorRail.hidden = false;
  // Keep the URL hash in sync — chip clicks call enterActorMode with a new
  // ep, so without this the address bar stays on the previous ep.
  const base = `#/actor/${actorRouteId}`;
  const next = (actorRouteMode === "episode" && actorRouteEpNum !== null)
    ? `${base}?ep=${actorRouteEpNum}` : base;
  if (location.hash !== next) history.replaceState(null, "", next);
  renderActorRail();
  renderActorRightPane();
}

function exitActorMode() {
  if (!actorRail) return;
  document.body.classList.remove("mode-actor");
  actorRail.hidden = true;
  actorRouteId = null;
  actorRouteMode = "series";
  actorRouteEpNum = null;
  if (location.hash) {
    // Clear the route without leaving a duplicate history entry.
    history.replaceState(null, "", location.pathname + location.search);
  }
  // Re-render the episode right pane and restore the chip highlight.
  renderRightPane();
  updatePlaylistActive();
}

function setActorMode(mode) {
  if (mode !== "episode" && mode !== "series") return;
  if (mode === "episode" && actorRouteEpNum === null) {
    // No episode context yet — fall back to the previously-open episode.
    const ep = SERIES.episodes[actorReturnEpIdx];
    if (ep) actorRouteEpNum = ep.episode_number;
  }
  actorRouteMode = mode;
  // Reflect the mode in the hash without a history entry.
  const base = `#/actor/${actorRouteId}`;
  const next = (mode === "episode" && actorRouteEpNum !== null)
    ? `${base}?ep=${actorRouteEpNum}` : base;
  if (location.hash !== next) history.replaceState(null, "", next);
  renderActorRail();
  renderActorRightPane();
}

// ── Actor rail (left panel) ──
function renderActorRail() {
  const actor = ACTOR_BY_ID[actorRouteId];
  if (!actor) return;
  if (actor.image) {
    actorRailPortrait.style.backgroundImage = `url('${actor.image}')`;
    actorRailPortrait.classList.remove("initials");
    actorRailPortrait.removeAttribute("data-initials");
  } else {
    actorRailPortrait.style.backgroundImage = "";
    actorRailPortrait.classList.add("initials");
    actorRailPortrait.setAttribute("data-initials", initialsOf(actor.name || ""));
  }
  actorRailName.textContent = actor.name || "";
  const aliases = (actor.aliases || []).filter(a => a && a !== actor.name);
  actorRailAliases.textContent = aliases.length ? `aka ${aliases.join(", ")}` : "";
  const metaBits = [];
  if (actor.tier) metaBits.push(String(actor.tier));
  if (actor.role_tag) metaBits.push(actor.role_tag);
  actorRailMeta.textContent = metaBits.join(" · ").toUpperCase();
  // Mode pills active state.
  actorRail.querySelectorAll(".actor-mode-pill").forEach(p => {
    p.classList.toggle("is-active", p.dataset.actorMode === actorRouteMode);
    p.setAttribute("aria-selected", p.dataset.actorMode === actorRouteMode ? "true" : "false");
  });
  // Context line — episode label when in episode mode.
  if (actorRouteMode === "episode" && actorRouteEpNum !== null) {
    const ep = SERIES.episodes.find(e => e.episode_number === actorRouteEpNum);
    actorRailContext.textContent = ep
      ? `EP ${String(ep.episode_number).padStart(2, "0")} · ${ep.title}` : "";
  } else if (actorRouteMode === "series") {
    const epsPresent = (actor.episodes_present || []).length;
    actorRailContext.textContent = epsPresent
      ? `Appears across ${epsPresent} of ${SERIES.episodes.length} episodes` : "";
  } else {
    actorRailContext.textContent = "";
  }
  // Back link: jumps to the actor's last-known episode if we have one.
  const backEpIdx = SERIES.episodes.findIndex(e => e.episode_number === actorRouteEpNum);
  actorRailBack.textContent = (backEpIdx >= 0)
    ? `← Back to Episode ${String(actorRouteEpNum).padStart(2, "0")}`
    : "← Back to episode";
  // Sync the top episode-chip highlight to the actor's current episode.
  updatePlaylistActive();
}

// ── Actor right-pane router ──
function renderActorRightPane() {
  const actor = ACTOR_BY_ID[actorRouteId];
  if (!actor) { exitActorMode(); return; }
  if (actorRouteMode === "episode") {
    detailPane.innerHTML = renderActorEpisodeHtml(actor);
  } else {
    detailPane.innerHTML = renderActorSeriesHtml(actor);
  }
  wireActorPane(actor);
  detailPane.parentElement.scrollTop = 0;
}

// ── Shared relationship-list row renderer ──
// Used by both episode mode (filtered edges) and series mode (all touching
// edges). Sort order: constructive (legitimizes/enables) → coercive
// (pressures) → antagonistic (delegitimizes/betrays), so the reader takes
// in the positive valence first. Within each group, outgoing before incoming.
const REL_GROUP_ORDER = { legitimizes: 0, enables: 1, pressures: 2, delegitimizes: 3, betrays: 4 };

function actorRelListHtml(rels, focalActorId) {
  if (!rels || !rels.length) return "";
  const sorted = rels.slice().sort((a, b) => {
    const ga = REL_GROUP_ORDER[a.type] ?? 9;
    const gb = REL_GROUP_ORDER[b.type] ?? 9;
    if (ga !== gb) return ga - gb;
    const aOut = a.source === focalActorId ? 0 : 1;
    const bOut = b.source === focalActorId ? 0 : 1;
    if (aOut !== bOut) return aOut - bOut;
    return (a.target_name || "").localeCompare(b.target_name || "");
  });
  const rows = sorted.map(r => {
    const isOut = r.source === focalActorId;
    const otherId   = isOut ? r.target : r.source;
    const otherName = isOut ? r.target_name : r.source_name;
    const verb = (r.type || "").replace(/_/g, " ");
    const dir = isOut ? "→" : "←";
    const conf = r.confidence || "";
    const confClass = "actor-rel-conf" + (conf ? ` ${conf}` : "");
    return `<div class="actor-rel-row">
      <span class="actor-rel-dir" aria-hidden="true">${dir}</span>
      <span class="actor-rel-verb">${escapeHtml(verb)}</span>
      <button class="actor-rel-target" type="button" data-open-actor="${escapeHtml(otherId)}">${escapeHtml(otherName)}</button>
      ${conf ? `<span class="${confClass}">${escapeHtml(conf)}</span>` : ""}
      ${r.description ? `<p class="actor-rel-desc">${escapeHtml(r.description)}</p>` : ""}
    </div>`;
  }).join("");
  return `<div class="actor-rel-list">${rows}</div>`;
}

// ── Episode mode (right pane) ──
function renderActorEpisodeHtml(actor) {
  const ep = SERIES.episodes.find(e => e.episode_number === actorRouteEpNum);
  if (!ep) {
    // No episode context resolvable — fall through to series-mode rendering.
    return renderActorSeriesHtml(actor);
  }
  const perEp = (actor.per_episode || {})[String(ep.episode_number)] || {};

  const eyebrow = `EPISODE ${String(ep.episode_number).padStart(2, "0")} · ${(ep.title || "").toUpperCase()}`;

  // Arc thread block — label + the four populated steps.
  const arcThreads = perEp.arc_threads || [];
  const arcBlock = arcThreads.length ? arcThreads.map(t => {
    const steps = [["Premise", t.premise], ["Pressure", t.pressure],
                   ["Movement", t.movement], ["Resolution", t.resolution]]
      .filter(([, v]) => v);
    const title = t.label
      ? `<div class="actor-arc-title">${escapeHtml(t.label)}</div>` : "";
    const rows = steps.map(([k, v]) =>
      `<div class="actor-arc-key">${k}</div><div class="actor-arc-val">${escapeHtml(v)}</div>`
    ).join("");
    return `<section class="actor-block">
      <div class="actor-block-label">Arc this episode</div>
      ${title}
      ${rows ? `<div class="actor-arc-steps">${rows}</div>` : ""}
    </section>`;
  }).join("") : "";

  // Scenes-they-appear-in.
  const scenes = perEp.scenes || [];
  const scenesBlock = scenes.length ? `
    <section class="actor-block">
      <div class="actor-block-label">Scenes in this episode</div>
      <div class="actor-scene-list">
        ${scenes.map(s => {
          const num = String((s.scene_index || 0) + 1).padStart(2, "0");
          const tagBits = [];
          if (s.presence) tagBits.push(s.presence);
          if (s.explanation_stage) tagBits.push(s.explanation_stage);
          const isPrimary = s.presence === "primary";
          return `<button class="actor-scene-row" type="button" data-scene-id="${escapeHtml(s.scene_id)}">
            <span class="actor-scene-num">${num}</span>
            <span class="actor-scene-title">${escapeHtml(s.title || "Scene")}</span>
            <span class="actor-scene-tag${isPrimary ? " primary" : ""}">${escapeHtml(tagBits.join(" · "))}</span>
          </button>`;
        }).join("")}
      </div>
    </section>` : "";

  // Excerpts.
  const excerptIds = perEp.excerpt_ids || [];
  let excerptsBlock = "";
  if (excerptIds.length) {
    const xs = excerptIds.map(id => EXCERPT_BY_ID[id]).filter(Boolean)
      .sort((a, b) => (b.quotability || 0) - (a.quotability || 0));
    if (xs.length) {
      excerptsBlock = `
        <section class="actor-block">
          <div class="actor-block-label">Excerpts in this episode (${xs.length})</div>
          <div class="excerpt-list" data-actor-excerpts="ep"></div>
        </section>`;
      // Body is filled by wireActorPane via renderExcerptRow so click
      // handlers attach cleanly.
      actorPaneExcerptsCache = xs;
    }
  } else {
    actorPaneExcerptsCache = [];
  }

  // Relationships activated this episode (uses the shared row renderer).
  const relIds = perEp.relationship_ids || [];
  const rels = relIds.map(id => SERIES.relationships.find(r => r.id === id)).filter(Boolean);
  const relsBlock = rels.length
    ? `<section class="actor-block">
         <div class="actor-block-label">Relationships activated</div>
         ${actorRelListHtml(rels, actor.actor_id)}
       </section>` : "";

  return `
    <div class="actor-spread">
      <div class="actor-spread-eyebrow">${escapeHtml(eyebrow)}</div>
      <h1 class="actor-spread-headline">${escapeHtml(actor.name || "")}</h1>
      ${actor.intro_gloss ? `<p class="actor-spread-gloss">${escapeHtml(actor.intro_gloss)}</p>` : ""}
      ${arcBlock}
      ${scenesBlock}
      ${excerptsBlock}
      ${relsBlock}
    </div>
  `;
}

let actorPaneExcerptsCache = [];

// ── Series mode (right pane) ──
function renderActorSeriesHtml(actor) {
  const eyebrow = `SERIES · ${(SERIES.series_title || "").toUpperCase()}`;
  const bio = actor.description
    ? `<p class="actor-spread-bio">${escapeHtml(actor.description)}</p>` : "";
  const gloss = actor.intro_gloss
    ? `<p class="actor-spread-gloss">${escapeHtml(actor.intro_gloss)}</p>` : "";

  // 4-axis spec.
  const specCol = (label, items) => {
    if (!items || !items.length) return "";
    return `<div class="actor-spec-col">
      <div class="actor-block-label">${label}</div>
      <ul class="actor-spec-list">${items.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
    </div>`;
  };
  const specBlock = `
    <section class="actor-block">
      <div class="actor-block-label">Character spec</div>
      <div class="actor-spec-grid">
        ${specCol("Driven by", actor.goals)}
        ${specCol("Up against", actor.constraints)}
        ${specCol("At stake", actor.stakes)}
        ${specCol("Transformations", actor.transformations)}
      </div>
    </section>`;

  // Relationship graph + reasons list — ego network at a glance, then the
  // typed edges spelled out with confidence + the reason text in plain prose.
  const relsTouching = (SERIES.relationships || []).filter(r =>
    r.source === actor.actor_id || r.target === actor.actor_id);
  const graphBlock = relsTouching.length ? `
    <section class="actor-block">
      <div class="actor-block-label">Relationships (${relsTouching.length})</div>
      <div class="actor-graph-wrap" data-actor-graph="1"></div>
      ${actorRelListHtml(relsTouching, actor.actor_id)}
    </section>` : "";

  // Episode appearance timeline.
  const tlBlock = `
    <section class="actor-block">
      <div class="actor-block-label">Across the series</div>
      <div class="actor-timeline">
        ${SERIES.episodes.map(ep => {
          const present = (actor.episodes_present || []).includes(ep.episode_number);
          const perEp = (actor.per_episode || {})[String(ep.episode_number)] || {};
          const arcLabel = ((perEp.arc_threads || [])[0] || {}).label || "";
          const cls = present ? "actor-tl-cell" : "actor-tl-cell absent";
          const tag = present ? "button" : "div";
          const attr = present ? `data-tl-ep="${ep.episode_number}"` : "";
          return `<${tag} class="${cls}" ${attr} ${present ? "type=\"button\"" : ""}>
            <span class="actor-tl-num">EP ${String(ep.episode_number).padStart(2, "0")}</span>
            <span class="actor-tl-label">${escapeHtml(arcLabel || (present ? "(appears)" : "—"))}</span>
          </${tag}>`;
        }).join("")}
      </div>
    </section>`;

  // All excerpts collated.
  const allXIds = [];
  Object.keys(actor.per_episode || {}).forEach(epNumStr => {
    (actor.per_episode[epNumStr].excerpt_ids || []).forEach(xid => {
      if (!allXIds.includes(xid)) allXIds.push(xid);
    });
  });
  const allXs = allXIds.map(id => EXCERPT_BY_ID[id]).filter(Boolean)
    .sort((a, b) => (b.quotability || 0) - (a.quotability || 0));
  const excerptsBlock = allXs.length ? `
    <section class="actor-block">
      <div class="actor-block-label">Excerpts across the series (${allXs.length})</div>
      <div class="excerpt-list" data-actor-excerpts="series"></div>
    </section>` : "";
  if (allXs.length) actorPaneExcerptsCache = allXs;

  // Source books.
  const bookIds = actor.book_ids || [];
  const sourcesBlock = bookIds.length ? `
    <section class="actor-block">
      <div class="actor-block-label">Source books (${bookIds.length})</div>
      <ul class="actor-source-list">
        ${(actor.chapter_refs || []).slice(0, 20).map(c => `
          <li>
            <span class="actor-source-title">${escapeHtml(c.chapter_title || c.chapter_id || c.book_id || "Source")}</span>
            <span class="actor-source-chapters">${escapeHtml(c.book_id || "")}</span>
          </li>`).join("")}
      </ul>
    </section>` : "";

  return `
    <div class="actor-spread">
      <div class="actor-spread-eyebrow">${escapeHtml(eyebrow)}</div>
      <h1 class="actor-spread-headline">${escapeHtml(actor.name || "")}</h1>
      ${gloss}
      ${bio}
      ${specBlock}
      ${graphBlock}
      ${tlBlock}
      ${excerptsBlock}
      ${sourcesBlock}
    </div>
  `;
}

// ── Wire interactivity inside the freshly rendered actor pane ──
function wireActorPane(actor) {
  // Fill excerpt lists — done in JS (rather than inline HTML) so the
  // renderExcerptRow click handlers attach.
  detailPane.querySelectorAll(".excerpt-list[data-actor-excerpts]").forEach(list => {
    actorPaneExcerptsCache.forEach(x => list.appendChild(renderExcerptRow(null, x)));
  });
  // Scene rows → openSceneDetail (within the actor's episode context).
  detailPane.querySelectorAll(".actor-scene-row[data-scene-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      const sid = btn.dataset.sceneId;
      if (!sid) return;
      // Switch back to the episode page on the way to the scene.
      const epIdx = SERIES.episodes.findIndex(e => e.episode_number === actorRouteEpNum);
      const aid = actorRouteId;
      exitActorMode();
      if (epIdx >= 0) loadEpisode(epIdx, false);
      openSceneDetail(sid);
      // Note: actor mode is exited; user can re-enter via cast accordion.
      void aid;
    });
  });
  // Relationship targets / actor-page links inside the actor pane.
  detailPane.querySelectorAll("[data-open-actor]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const aid = btn.dataset.openActor;
      if (!aid || !ACTOR_BY_ID[aid]) return;
      const ep = actorRouteEpNum !== null ? `?ep=${actorRouteEpNum}` : "";
      location.hash = `#/actor/${aid}${ep}`;
    });
  });
  // Timeline cells → switch this actor's view to that episode in episode mode.
  detailPane.querySelectorAll(".actor-tl-cell[data-tl-ep]").forEach(cell => {
    cell.addEventListener("click", () => {
      const n = parseInt(cell.dataset.tlEp, 10);
      if (!Number.isFinite(n)) return;
      actorRouteEpNum = n;
      setActorMode("episode");
    });
  });
  // Relationship graph — render SVG into its placeholder.
  const graphHost = detailPane.querySelector("[data-actor-graph]");
  if (graphHost) renderActorRelationshipGraph(graphHost, actor);
}

// ── Editorial ego-network SVG ────────────────────────────────────────────
// Focal actor at center with their portrait; peers arranged in semantic
// arcs by relationship-type group (constructive at top, coercive on the
// sides, antagonistic at the bottom). Edges are quadratic Beziers with a
// small accent arrowhead; verbs sit on each curve in lowercase with a
// bg-color stroke halo so the line doesn't slash through them. Hover a
// peer to dim non-related edges.
const SVG_NS = "http://www.w3.org/2000/svg";
const REL_GROUP = {
  legitimizes: "top",   enables: "top",
  pressures:   "side",
  delegitimizes: "bottom", betrays: "bottom",
};
// Arc ranges in clock-degrees (0° = 12 o'clock, going clockwise).
const ARC_SPANS = {
  top:    { center:   0, half: 30 },   // -30° .. 30°  → 11 to 1 o'clock
  right:  { center:  90, half: 30 },   // 60° .. 120°
  bottom: { center: 180, half: 30 },   //150° .. 210°
  left:   { center: 270, half: 30 },   //240° .. 300°
};

function svgEl(name, attrs, parent) {
  const el = document.createElementNS(SVG_NS, name);
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

function clockToXY(cx, cy, r, deg) {
  // 0° = 12 o'clock, going clockwise. Math: x = cx + r sin θ, y = cy − r cos θ.
  const rad = deg * Math.PI / 180;
  return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
}

function quadCurveMid(a, cp, b) {
  // Point at t=0.5 on a quadratic Bezier — used to place edge labels.
  return { x: 0.25 * a.x + 0.5 * cp.x + 0.25 * b.x,
           y: 0.25 * a.y + 0.5 * cp.y + 0.25 * b.y };
}

function renderActorRelationshipGraph(host, actor) {
  const edges = (SERIES.relationships || []).filter(r =>
    r.source === actor.actor_id || r.target === actor.actor_id);
  if (!edges.length) return;

  // Group edges by peer actor (a pair of actors may have multiple typed edges).
  // Each peer also gets a `group` derived from the first edge — for layout.
  const peerMap = new Map();
  edges.forEach(e => {
    const isOut = e.source === actor.actor_id;
    const otherId = isOut ? e.target : e.source;
    const otherName = isOut ? e.target_name : e.source_name;
    if (!peerMap.has(otherId)) {
      peerMap.set(otherId, {
        actorId: otherId, name: otherName,
        group: REL_GROUP[e.type] || "side",
        edges: [],
      });
    }
    peerMap.get(otherId).edges.push({ ...e, isOut });
  });

  // Partition peers into arc buckets. "side" splits half-and-half left/right
  // by alphabetical order so the result is deterministic across builds.
  const buckets = { top: [], right: [], bottom: [], left: [] };
  const peers = [...peerMap.values()];
  peers.filter(p => p.group === "top").forEach(p => buckets.top.push(p));
  peers.filter(p => p.group === "bottom").forEach(p => buckets.bottom.push(p));
  const sides = peers.filter(p => p.group === "side").sort((a, b) => a.name.localeCompare(b.name));
  const half = Math.ceil(sides.length / 2);
  sides.slice(0, half).forEach(p => buckets.right.push(p));
  sides.slice(half).forEach(p => buckets.left.push(p));

  // Within each arc, distribute peers evenly. For N peers, place at
  // arcCenter + (i + 0.5 - N/2) * (2*halfSpan / N), so they sit centered.
  const PEER_RADIUS = 26, CENTER_RADIUS = 38;
  const R = 175;
  // Adapt SVG height to which arc buckets actually have content. A sparse
  // graph (e.g. Jinnah's 1 peer in the top arc) would otherwise waste an
  // entire empty bottom half of the canvas.
  const TOP_ROOM    = (buckets.top.length > 0)
    ? R + PEER_RADIUS + 50 : CENTER_RADIUS + 30;
  const BOTTOM_ROOM = (buckets.bottom.length > 0)
    ? R + PEER_RADIUS + 60 : CENTER_RADIUS + 30;
  const W = 720;
  const cx = W / 2;
  const cy = TOP_ROOM;
  const H = TOP_ROOM + BOTTOM_ROOM;

  const positions = { [actor.actor_id]: { x: cx, y: cy } };
  const peerOrder = [];  // render-order list of peers
  ["top", "right", "bottom", "left"].forEach(bucket => {
    const list = buckets[bucket];
    if (!list.length) return;
    const { center, half } = ARC_SPANS[bucket];
    const N = list.length;
    list.forEach((p, i) => {
      // Evenly spaced angle within the arc; single-peer sits dead center.
      const t = N === 1 ? 0.5 : (i + 0.5) / N;
      const deg = center - half + t * (2 * half);
      positions[p.actorId] = clockToXY(cx, cy, R, deg);
      positions[p.actorId].deg = deg;
      peerOrder.push(p);
    });
  });

  const svg = svgEl("svg", {
    viewBox: `0 0 ${W} ${H}`,
    class: "actor-graph",
    role: "img",
    "aria-label": `Relationship network for ${actor.name}`,
  });

  // ── defs: arrowhead marker + initials gradient + per-portrait clipPaths ──
  const defs = svgEl("defs", null, svg);
  const arrow = svgEl("marker", {
    id: "actor-graph-arrow",
    viewBox: "0 0 10 10", refX: "9", refY: "5",
    markerWidth: "8", markerHeight: "8", orient: "auto",
    markerUnits: "userSpaceOnUse",
  }, defs);
  svgEl("path", { d: "M 0 0 L 10 5 L 0 10 Z", fill: "var(--accent)" }, arrow);
  // Initials portrait: warm, lifted gradient so it doesn't read as a "hole"
  // next to the real photographic peer portraits. Brighter inner core, deep
  // warm shadow at the edge.
  const grad = svgEl("radialGradient", {
    id: "actor-graph-initials-gradient", cx: "30%", cy: "26%", r: "82%",
  }, defs);
  svgEl("stop", { offset: "0%", "stop-color": "rgba(196,80,80,0.72)" }, grad);
  svgEl("stop", { offset: "55%", "stop-color": "rgba(120,52,52,0.55)" }, grad);
  svgEl("stop", { offset: "100%", "stop-color": "#1a1212" }, grad);

  // ── edges (rendered first so portraits paint over them) ──
  const edgeRecords = [];  // {edge, peerActorId, path element, label element}

  peerOrder.forEach(peer => {
    const peerPos = positions[peer.actorId];
    peer.edges.forEach((e, i) => {
      const isOut = e.isOut;
      const start = positions[e.source];
      const end   = positions[e.target];
      // Trim the line endpoints so they stop at the circle edge, not the center.
      const trim = (pt, towards, rad) => {
        const dx = towards.x - pt.x, dy = towards.y - pt.y;
        const d = Math.hypot(dx, dy) || 1;
        return { x: pt.x + (dx / d) * rad, y: pt.y + (dy / d) * rad };
      };
      const startRad = (e.source === actor.actor_id) ? CENTER_RADIUS : PEER_RADIUS;
      const endRad   = (e.target === actor.actor_id) ? CENTER_RADIUS : PEER_RADIUS;
      const s = trim(start, end, startRad);
      const t = trim(end, start, endRad);
      // Control point: midpoint pushed perpendicular to the s→t line so the
      // edge arcs. Curves bulge outward from center for visual composition.
      // Multiple edges between the same pair get nudged so they don't overlap.
      const dx = t.x - s.x, dy = t.y - s.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const offsetBase = len * 0.18;
      const offset = offsetBase * (i === 0 ? 1 : (i % 2 ? -1 : 1) * (1 + 0.4 * Math.floor(i / 2)));
      // Direction the arc bulges — outward from center looks cleanest.
      const midToCenter = { x: cx - (s.x + t.x) / 2, y: cy - (s.y + t.y) / 2 };
      const sideSign = (midToCenter.x * nx + midToCenter.y * ny) < 0 ? 1 : -1;
      const cp = { x: (s.x + t.x) / 2 + nx * offset * sideSign,
                   y: (s.y + t.y) / 2 + ny * offset * sideSign };
      const path = svgEl("path", {
        d: `M ${s.x.toFixed(1)} ${s.y.toFixed(1)} Q ${cp.x.toFixed(1)} ${cp.y.toFixed(1)} ${t.x.toFixed(1)} ${t.y.toFixed(1)}`,
        class: `edge confidence-${e.confidence || "high"} group-${peer.group}`,
        "marker-end": "url(#actor-graph-arrow)",
      }, svg);
      // Edge label at curve midpoint, rotated along the curve direction so
      // diverging edges' labels don't overlap each other in the bottom arc.
      // Flip 180° when chord points leftward so text reads upright.
      const mid = quadCurveMid(s, cp, t);
      const chordDeg = Math.atan2(t.y - s.y, t.x - s.x) * 180 / Math.PI;
      let labelAngle = chordDeg;
      if (chordDeg > 90) labelAngle = chordDeg - 180;
      else if (chordDeg < -90) labelAngle = chordDeg + 180;
      const label = svgEl("text", {
        x: mid.x.toFixed(1), y: mid.y.toFixed(1),
        class: "edge-label",
        transform: `rotate(${labelAngle.toFixed(1)} ${mid.x.toFixed(1)} ${mid.y.toFixed(1)})`,
        dy: "-4",
      }, svg);
      label.textContent = (e.type || "").replace(/_/g, " ");
      edgeRecords.push({ edge: e, peerActorId: peer.actorId, pathEl: path, labelEl: label });
    });
  });

  // ── portraits (peers, then center on top) ──
  const drawPortrait = (group, pos, name, rad, classes, onClick) => {
    const g = svgEl("g", {
      class: classes,
      transform: `translate(${pos.x.toFixed(1)} ${pos.y.toFixed(1)})`,
    }, svg);
    const actorRecord = ACTOR_BY_ID[group] || { name };
    const img = actorRecord && actorRecord.image;
    if (img) {
      const clipId = `actor-graph-clip-${group}`;
      const clip = svgEl("clipPath", { id: clipId }, defs);
      svgEl("circle", { cx: 0, cy: 0, r: rad }, clip);
      svgEl("image", {
        href: img, x: -rad, y: -rad, width: rad * 2, height: rad * 2,
        "clip-path": `url(#${clipId})`,
        preserveAspectRatio: "xMidYMid slice",
        class: "portrait-img",
      }, g);
    } else {
      // Initials fallback.
      svgEl("circle", { cx: 0, cy: 0, r: rad, class: "initials-bg" }, g);
      const initialsText = svgEl("text", {
        x: 0, y: 0,
        class: "initials-text",
        "font-size": (rad * 0.95).toFixed(1),
      }, g);
      initialsText.textContent = initialsOf(name);
    }
    svgEl("circle", { cx: 0, cy: 0, r: rad, class: "portrait-ring" }, g);
    if (onClick) {
      g.style.cursor = "pointer";
      g.addEventListener("click", onClick);
      g.tabIndex = 0;
      g.setAttribute("role", "button");
      g.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(); }
      });
    }
    return g;
  };

  // Peer portraits + label below.
  const peerEls = new Map();
  peerOrder.forEach(peer => {
    const pos = positions[peer.actorId];
    const onClick = () => {
      const ep = actorRouteEpNum !== null ? `?ep=${actorRouteEpNum}` : "";
      location.hash = `#/actor/${peer.actorId}${ep}`;
    };
    const node = drawPortrait(peer.actorId, pos, peer.name, PEER_RADIUS, "peer-portrait", onClick);
    // Name label, anchored below the portrait. Push slightly further on
    // top/bottom peers so the label doesn't crowd the edge label.
    const labelY = pos.y + PEER_RADIUS + 18;
    const lbl = svgEl("text", {
      x: pos.x.toFixed(1), y: labelY.toFixed(1),
      class: "node-label",
    }, svg);
    // Wrap long names (just split on a space if over ~16 chars).
    const name = peer.name || "";
    if (name.length > 16 && name.includes(" ")) {
      const parts = name.split(" ");
      const split = Math.ceil(parts.length / 2);
      const line1 = parts.slice(0, split).join(" ");
      const line2 = parts.slice(split).join(" ");
      lbl.textContent = "";
      const t1 = svgEl("tspan", { x: pos.x.toFixed(1), dy: "0" }, lbl);
      t1.textContent = line1;
      const t2 = svgEl("tspan", { x: pos.x.toFixed(1), dy: "1.2em" }, lbl);
      t2.textContent = line2;
    } else {
      lbl.textContent = name;
    }
    peerEls.set(peer.actorId, { node, lbl });
  });

  // Center portrait. No name label — the actor's identity is established by
  // the left rail (portrait + name + tier). A second label here just creates
  // overlap with peers placed near the center.
  drawPortrait(actor.actor_id, positions[actor.actor_id], actor.name, CENTER_RADIUS, "center-portrait", null);

  // ── hover: focus a peer to dim non-related edges/peers ──
  peerEls.forEach((els, peerId) => {
    const enter = () => {
      svg.classList.add("is-focused");
      els.node.classList.add("is-on");
      els.lbl.classList.add("is-on");
      edgeRecords.forEach(r => {
        const on = r.peerActorId === peerId;
        r.pathEl.classList.toggle("is-on", on);
        r.labelEl.classList.toggle("is-on", on);
      });
    };
    const leave = () => {
      svg.classList.remove("is-focused");
      svg.querySelectorAll(".is-on").forEach(el => el.classList.remove("is-on"));
    };
    els.node.addEventListener("mouseenter", enter);
    els.node.addEventListener("mouseleave", leave);
    els.node.addEventListener("focus", enter);
    els.node.addEventListener("blur", leave);
  });

  host.appendChild(svg);
}

// Mode pills + back button.
if (actorRail) {
  actorRail.querySelectorAll(".actor-mode-pill").forEach(p => {
    p.addEventListener("click", () => setActorMode(p.dataset.actorMode));
  });
  actorRailBack.addEventListener("click", () => {
    const ep = actorRouteEpNum;
    exitActorMode();
    if (ep !== null) {
      const idx = SERIES.episodes.findIndex(e => e.episode_number === ep);
      if (idx >= 0 && idx !== currentEpIdx) loadEpisode(idx, false);
    }
  });
}
window.addEventListener("hashchange", applyHashRoute);

// ── INIT ──
setFocus(localStorage.getItem("pa-focus") === "1");   // companion on by default
buildEpisodesRail();
// Left-rail tabs: Scenes / Threads.
document.querySelectorAll(".left-tab").forEach(t => {
  t.addEventListener("click", () => setLeftTab(t.dataset.tab));
});
// Follow chip: toggle the teleprompter lock (pause-follow / resume).
document.getElementById("followChip").addEventListener("click", () => {
  if (followLock) unlockFollow(); else rearmFollow();
});
// ← Series chip: swap to series scope and rebuild the strip.
document.getElementById("stripScopeChip").addEventListener("click", () => {
  stripScope = "series";
  buildTimeline();
});

// Keep --timeline-frozen-h in sync with the actual height of the sticky
// header (chips rail + timeline strip). The landing's cast sidebar uses
// this var as its top offset; the CSS fallback (285px) covers the case
// before this observer fires.
(function trackTimelineFrozenHeight() {
  const el = document.getElementById("timelineFrozen");
  if (!el) return;
  const apply = () => {
    document.documentElement.style.setProperty("--timeline-frozen-h", `${el.offsetHeight}px`);
  };
  apply();
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(apply).observe(el);
  } else {
    window.addEventListener("resize", apply);
  }
})();

loadEpisode(0, false);   // calls buildTimeline() internally
// Apply hash route on cold-load so #/actor/<id> bookmarks work.
applyHashRoute();
</script>
