  const numeral = String(globalIdx + 1).padStart(2, "0");
  const image = sc.entry_image || "";   // cinematic opening line; present on every scene
  const dur = durationLabel(sc.duration_s);

  // Editorial list row: numeral · (title + cinematic entry image) · duration.
  // The entry-image line is clamped to two lines in CSS.
  card.innerHTML = `
    <span class="scene-row-num">${numeral}</span>
    <div class="scene-row-body">
      <div class="scene-row-title">${escapeHtml(sc.title)}</div>
      ${image ? `<div class="scene-row-image">${escapeHtml(image)}</div>` : ""}
    </div>
    ${dur ? `<span class="scene-row-dur">${dur}</span>` : ""}
  `;
  const open = () => openSceneDetail(sc.scene_id);
  card.addEventListener("click", open);
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  return card;
}

// Aggregate an act's actors from its scenes: dedupe by id/name, order by
// presence (primary → secondary → background) so the header can show a compact
// "starring" line. Returns [] for analytical acts with no actors (hidden).
function sectionActors(scenes) {
  const rank = { primary: 0, secondary: 1, background: 2 };
  const pr = a => { const r = rank[a.presence]; return r === undefined ? 3 : r; };
  const seen = new Map();
  (scenes || []).forEach(sc => {
    (sc.actors || []).forEach(a => {
      const key = a.actor_id || a.name;
      if (!key) return;
      const prev = seen.get(key);
      if (!prev || pr(a) < pr(prev)) seen.set(key, a);
    });
  });
  return [...seen.values()].sort((x, y) => pr(x) - pr(y));
}

function buildScenesGallery(ep) {
  scenesGallery.innerHTML = "";
  if (tabCount.scenes) tabCount.scenes.textContent = ep.scenes.length;

  // global index per scene_id (timeline-tick parity)
  const idxOf = {};
  ep.scenes.forEach((sc, i) => { idxOf[sc.scene_id] = i; });

  // bucket scenes by section_id, preserving scene order within a section
  const bySection = {};
  ep.scenes.forEach(sc => {
    const key = sc.section_id || "__other__";
    (bySection[key] = bySection[key] || []).push(sc);
  });

  const sections = ep.sections || [];
  const order = sections.map(s => s.section_id);
  // any sections that have no scenes are skipped; any scenes whose section_id
  // isn't a known section fall into a trailing "Other" group.
  const renderGroup = (titleParts, scenes, openByDefault) => {
    const group = document.createElement("div");
    group.className = "scene-section-group" + (openByDefault ? "" : " collapsed");
    if (titleParts && titleParts.sectionId) group.dataset.sectionId = titleParts.sectionId;

    const inner = document.createElement("div");
    inner.className = "scene-section-body-inner";

    if (titleParts) {
      const head = document.createElement("div");
      head.className = "scene-section-head";
      head.tabIndex = 0;
      head.setAttribute("role", "button");
      if (titleParts.sectionId) head.dataset.sectionId = titleParts.sectionId;
      const viewAct = titleParts.sectionId
        ? `<button class="scene-section-view" type="button" title="Open this act">View act &rsaquo;</button>` : "";

      // Eyebrow (secondary): (function tag, only when distinctive) · ~N min · N scenes.
      // Act numbers are intentionally omitted — they collided with the global
      // scene numerals; the short headline now identifies the act.
      const showTag = titleParts.purposeRaw && !GENERIC_PURPOSES.has(titleParts.purposeRaw);
      const sceneCount = `${scenes.length} ${scenes.length === 1 ? "scene" : "scenes"}`;
      const eyebrow = [
        showTag ? `<span class="scene-section-purpose">${escapeHtml(titleParts.purpose)}</span>` : "",
        titleParts.runtime ? `<span class="scene-section-runtime">${escapeHtml(titleParts.runtime)}</span>` : "",
        `<span class="scene-section-count">${sceneCount}</span>`,
      ].filter(Boolean).join(`<span class="scene-section-dot">·</span>`);
      // Headline: the short summarized title (falls back to anchor / label).
      const headline = titleParts.headline || titleParts.anchor || titleParts.purpose || "";

      head.innerHTML = `
        <span class="scene-section-chevron">&rsaquo;</span>
        <div class="scene-section-headwrap">
          ${headline ? `<div class="scene-section-headline">${escapeHtml(headline)}</div>` : ""}
          <div class="scene-section-eyebrow">${eyebrow}</div>
        </div>
        ${viewAct}
      `;
      const toggle = () => group.classList.toggle("collapsed");
      head.addEventListener("click", e => {
        if (e.target.closest(".scene-section-view")) { openSectionDetail(titleParts.sectionId); return; }
        toggle();
      });
      head.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      group.appendChild(head);
    }
    // Cast pane — the act's actors, revealed inside the dropdown above the
    // scenes. Deduped + primary-first via sectionActors(); hidden when none.
    const acts = (titleParts && titleParts.actors) || [];
    if (acts.length) {
      // Compact cluster: overlapping clickable avatars + a last-name summary.
      const shownAv = acts.slice(0, 5);
      const avHtml = shownAv.map(a =>
        `<button class="scene-act-cast-av" type="button" data-actor-id="${escapeHtml(a.actor_id || "")}"`
        + ` title="${escapeHtml(a.name || "")}">${avatarHtml(a, 1.5, "")}</button>`
      ).join("");
      const avMore = acts.length > shownAv.length
        ? `<span class="scene-act-cast-more">+${acts.length - shownAv.length}</span>` : "";
      const lastName = n => { const p = String(n || "").trim().split(/\s+/); return p[p.length - 1] || ""; };
      const names = acts.slice(0, 3).map(a => lastName(a.name)).filter(Boolean).join(", ");
      const nameMore = acts.length > 3 ? ` +${acts.length - 3}` : "";

      const pane = document.createElement("div");
      pane.className = "scene-act-cast";
      pane.innerHTML = `<span class="scene-act-cast-label">Cast</span>`
        + `<div class="scene-act-cast-avatars">${avHtml}${avMore}</div>`
        + `<span class="scene-act-cast-names">${escapeHtml(names + nameMore)}</span>`;
      pane.addEventListener("click", e => {
        const av = e.target.closest(".scene-act-cast-av");
        if (av && av.dataset.actorId) openActorDetail(av.dataset.actorId);
      });
      inner.appendChild(pane);
    }
    const cards = document.createElement("div");
    cards.className = "scene-section-cards";
    scenes.forEach(sc => cards.appendChild(sceneCardEl(sc, idxOf[sc.scene_id])));
    inner.appendChild(cards);

    const body = document.createElement("div");
    body.className = "scene-section-body";
    body.appendChild(inner);
    group.appendChild(body);
    scenesGallery.appendChild(group);
  };

  if (sections.length) {
    let first = true;
    sections.forEach((s, i) => {
      const scenes = bySection[s.section_id];
      if (!scenes || !scenes.length) return;
      renderGroup({
        sectionId: s.section_id,
        purpose: s.purpose_label || "Section",
        purposeRaw: s.purpose || "",
        runtime: s.runtime_min ? `~${Math.round(s.runtime_min)} min` : "",
        anchor: s.anchor || "",
        headline: s.headline || s.anchor || "",
        actors: sectionActors(scenes),
      }, scenes, first);   // first populated section open by default
      first = false;
    });
    const orphans = ep.scenes.filter(sc => !sc.section_id || !order.includes(sc.section_id));
    if (orphans.length) renderGroup({ purpose: "Other", runtime: "", anchor: "", actors: sectionActors(orphans) }, orphans, false);
  } else {
    renderGroup(null, ep.scenes, true);   // no architecture → flat, open
  }
}

// Expand the accordion section that contains a given scene (on open / playback).
function expandSectionForScene(sceneId) {
  const ep = SERIES.episodes[currentEpIdx];
  const sc = (ep.scenes || []).find(s => s.scene_id === sceneId);
  if (!sc || !sc.section_id) return;
  const grp = scenesGallery.querySelector('.scene-section-group[data-section-id="' + sc.section_id + '"]');
  if (grp) grp.classList.remove("collapsed");
}
function shortLocation(loc) {
  if (!loc) return "";
  // Take the first comma-segment up to ~28 chars
  const first = loc.split(/[,;]/)[0].trim();
  return first.length > 28 ? first.slice(0, 27) + "…" : first;
}

// ── DETAIL — editorial / archival-magazine composition ──
// State is derived from currentScene / currentActor (mutually exclusive).
// Neither set → episode-level empty state with arc_summary.
// Scene set    → eyebrow + headline + meta strip + scene plate + body + cast.
// Actor set    → portrait masthead + body description.
// The episodes rail is always rendered above, regardless of state.

function openSceneDetail(sceneId) {
  const ep = SERIES.episodes[currentEpIdx];
  if (!ep.scenes.find(s => s.scene_id === sceneId)) return;
  unlockFollow();
  currentScene = sceneId; currentActor = null; currentSection = null; currentDebate = null;
  expandSectionForScene(sceneId);
  renderRightPane();
}

function openActorDetail(actorId) {
  // Resolve against the series-wide actors map so cross-links from a quote whose
  // speaker isn't in this episode's cast still open the character page.
  if (!actorId || !ACTOR_BY_ID[actorId]) return;
  unlockFollow();
  currentActor = actorId; currentScene = null; currentSection = null; currentDebate = null;
  renderRightPane();
}

function openSectionDetail(sectionId) {
  const ep = SERIES.episodes[currentEpIdx];
  if (!(ep.sections || []).find(s => s.section_id === sectionId)) return;
  unlockFollow();
  currentSection = sectionId; currentScene = null; currentActor = null; currentDebate = null;
  renderRightPane();
}

// Look a contested primitive up across the timeline layers (events + acts).
function debatePrimitiveById(pid) {
  return (SERIES.events || []).find(e => e.id === pid)
      || (SERIES.acts || []).find(a => a.id === pid)
      || null;
}

function openDebateDetail(primId) {
  if (!debatePrimitiveById(primId)) return;
  unlockFollow();
  currentDebate = primId; currentScene = null; currentActor = null; currentSection = null;
  renderRightPane();
}

// Single render path. Decides which template to draw based on currentScene /
// currentActor / currentSection, then re-highlights the left rails and wires
// any cross-links (cast chips, scene-ref chips) in the freshly drawn pane.
function renderRightPane() {
  const ep = SERIES.episodes[currentEpIdx];
  if (currentScene) {
    detailPane.innerHTML = renderSceneSpread(ep);
  } else if (currentActor) {
    detailPane.innerHTML = renderActorSpread(ep);
  } else if (currentSection) {
    detailPane.innerHTML = renderSectionSpread(ep);
  } else if (currentDebate) {
    detailPane.innerHTML = renderDebateSpread(ep);
  } else {
    detailPane.innerHTML = renderEpisodeEmpty(ep);
  }
  wireDetailPane();
  detailPane.parentElement.scrollTop = 0;
  updatePlaylistActive();
  updateTimelineActive();
  highlightActive();
}

// ── Landing pane (rest state) ─────────────────────────────────────────────
// 3-column grid: narrative center · spacer · sticky cast rail pinned right.
// The hero is just the title (cream serif, anchor) plus the listener problem
// and any unresolved questions as italic paragraphs — no labels, no stepper.
// Below it: an expandable key-terms block. Cast rows carry avatar + role
// tag + premise and tap through to the full actor pane.

function landingHeroHtml(ep) {
  const spine = ep.episode_spine || {};
  const epNum = String(ep.episode_number).padStart(2, "0");
  // Lead question (listener_problem) reads as a single prominent sans paragraph;
  // unresolved questions render as a dim bulleted list below it. Empty values
  // drop. Both empty → no question block rendered.
  const lead = (spine.listener_problem || "").trim();
  const leadHtml = lead
    ? `<p class="landing-hero-lead-question">${escapeHtml(lead)}</p>` : "";
  const subs = (ep.unresolved_questions || [])
    .map(q => (q || "").trim()).filter(Boolean);
  const subsHtml = subs.length
    ? `<ul class="landing-hero-subquestions">${subs.map(q => `<li>${escapeHtml(q)}</li>`).join("")}</ul>` : "";
  return `
    <header class="landing-hero">
      <div class="landing-hero-numtitle">
        <span class="landing-hero-num">${epNum}</span>
        <h1 class="landing-hero-title">${escapeHtml(ep.title || "")}</h1>
      </div>
      ${leadHtml}
      ${subsHtml}
    </header>`;
}

function landingTermsHtml(ep) {
  const terms = SERIES.terms || [];
  if (!terms.length) return "";
  // Items introduced in this episode float to the top; the server-side
  // sort (foundational > episode_core > alphabetical) is otherwise preserved.
  const sorted = terms.slice().sort((a, b) => {
    const aHere = (a.introduction_episode_number === ep.episode_number) ? 0 : 1;
    const bHere = (b.introduction_episode_number === ep.episode_number) ? 0 : 1;
    return aHere - bHere;
  });
  const rows = sorted.map(t => {
    const gloss = t.preferred_plain_gloss || "";
    return `
      <details class="landing-term">
        <summary>
          <span class="term-label">${escapeHtml(t.label || "")}</span>
          <span class="term-chev" aria-hidden="true">⌃</span>
        </summary>
        ${gloss ? `<p class="term-gloss">${escapeHtml(gloss)}</p>` : ""}
      </details>`;
  }).join("");
  return `
    <section class="landing-block">
      <div class="landing-block-label">Key terms</div>
      <div class="landing-terms">${rows}</div>
    </section>`;
}

function landingCastRailHtml(ep) {
  const rows = (ep.cast || []).map(c => {
    // Resolve the rich actor record for the portrait — the slim cast entry
    // only carries name/image/tier/role_tag. avatarHtml falls back to a
    // colored-initials chip when there's no portrait.
    const rich = (c.actor_id && ACTOR_BY_ID[c.actor_id]) ? ACTOR_BY_ID[c.actor_id] : c;
    const avatar = avatarHtml(rich, 2.4, "landing-cast-avatar");
    const role = c.role_tag
      ? `<div class="landing-cast-role">${escapeHtml(c.role_tag)}</div>` : "";
    const premise = ((c.arc_threads || [])[0] || {}).premise || "";
    const aid = c.actor_id || "";
    return `
      <div class="landing-cast-row" data-cast-actor-id="${escapeHtml(aid)}" tabindex="0" role="button" aria-expanded="false">
        ${avatar}
        <div class="landing-cast-text">
          <div class="landing-cast-name">${escapeHtml(c.name || "")}</div>
          ${role}
          ${premise ? `<div class="landing-cast-premise">${escapeHtml(premise)}</div>` : ""}
        </div>
        <div class="landing-cast-body" data-cast-body-for="${escapeHtml(aid)}"></div>
      </div>`;
  }).join("");
  if (!rows) return "";
  return `
    <div class="landing-cast-label">Cast</div>
    ${rows}`;
}

// Lazily fill the accordion body the first time a row opens — keeps the
// initial render cheap when an episode has many cast members.
function fillCastBody(ep, body, actorId) {
  if (body.dataset.filled === "1") return;
  body.dataset.filled = "1";
  const series = ACTOR_BY_ID[actorId];
  const perEp = series && series.per_episode && series.per_episode[String(ep.episode_number)];
  const arcLabel = ((perEp && perEp.arc_threads && perEp.arc_threads[0]) || {}).label || "";
  const arcLine = arcLabel
    ? `<div class="landing-cast-arclabel">${escapeHtml(arcLabel)}</div>` : "";

  // Surface up to 3 excerpts attributed to this actor in this episode (as
  // subject OR speaker), sorted by quotability desc.
  const excerptIds = (perEp && perEp.excerpt_ids) || [];
  const excerpts = excerptIds
    .map(id => EXCERPT_BY_ID[id]).filter(Boolean)
    .sort((a, b) => (b.quotability || 0) - (a.quotability || 0))
    .slice(0, 3);

  let excerptsHtml = "";
  if (excerpts.length) {
    const list = document.createElement("div");
    list.className = "excerpt-list";
    excerpts.forEach(x => list.appendChild(renderExcerptRow(ep, x)));
    excerptsHtml = list.outerHTML;
  } else {
    excerptsHtml = `<div class="landing-cast-empty">No excerpts attributed in this episode.</div>`;
  }

  const link = `<button type="button" class="landing-cast-actorlink" data-open-actor="${escapeHtml(actorId)}">Open actor page <span class="arr">&rarr;</span></button>`;
  body.innerHTML = arcLine + excerptsHtml + link;

  // Re-wire scene links inside the freshly inserted excerpts (the .outerHTML
  // roundtrip drops the original click listeners). Re-attach by scene_id.
  body.querySelectorAll(".excerpt-row").forEach((row, i) => {
    const x = excerpts[i];
    const staging = x && ep.scenes.find(s => (s.excerpt_ids || []).includes(x.id));
    if (!staging) return;
    const link = row.querySelector(".excerpt-scene");
    if (!link) return;
    const open = (e) => { e.stopPropagation(); openSceneDetail(staging.scene_id); };
    link.addEventListener("click", open);
    link.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(e); }
    });
  });
  // Actor-page link routes to #/actor/<id>?ep=<n> — handled by hashchange.
  const linkBtn = body.querySelector("[data-open-actor]");
  if (linkBtn) {
    linkBtn.addEventListener("click", e => {
      e.stopPropagation();
      const aid = linkBtn.dataset.openActor;
      if (aid) location.hash = `#/actor/${aid}?ep=${ep.episode_number}`;
    });
  }
}

// Rest state — 3-column grid: narrative center · flex spacer · sticky cast
// rail pinned to the right edge. Sidebar folds beneath the narrative at
// < 1080px viewports via the media query in the landing CSS block.
function renderEpisodeEmpty(ep) {
  return `
    <div class="episode-landing">
      <section class="landing-narrative">
        ${landingHeroHtml(ep)}
        ${landingTermsHtml(ep)}
      </section>
      <aside class="landing-cast-rail">
        ${landingCastRailHtml(ep)}
      </aside>
    </div>
  `;
}

// Pull-quote figure for a resolved excerpt — shared by scene/section/character.
// When the speaker resolves to an actor, the caption shows their portrait and
// links to the character page.
function quoteFigure(x) {
  if (!x || !x.verbatim) return "";
  const actor = x.speaker_actor_id ? ACTOR_BY_ID[x.speaker_actor_id] : null;
  const avatar = actor ? avatarHtml(actor, 1.8, "") : "";
  let cap = "";
  if (x.speaker) cap += `<span class="speaker">${escapeHtml(x.speaker)}</span>`;
  if (x.audience) cap += `${x.speaker ? ", " : ""}to ${escapeHtml(x.audience)}`;
  if (x.timeframe) cap += `${cap ? " · " : ""}${escapeHtml(x.timeframe)}`;
  const figcap = (avatar || cap)
    ? `<figcaption${actor ? ` class="has-actor" data-actor-id="${escapeHtml(x.speaker_actor_id)}"` : ""}>${avatar}<span>${cap}</span></figcaption>`
    : "";
  return `<figure class="detail-quote"><blockquote>${escapeHtml(x.verbatim)}</blockquote>${figcap}</figure>`;
}

function castBlockHtml(actors, label) {
  const chips = (actors || []).map(a => {
    const rich = (a.actor_id && ACTOR_BY_ID[a.actor_id]) ? ACTOR_BY_ID[a.actor_id] : a;
    const avatar = avatarHtml(rich, 2.2, "");
    const role = a.role_label ? `<span class="chip-role">${escapeHtml(a.role_label)}</span>` : "";
    return `
      <div class="detail-cast-chip" data-actor-id="${escapeHtml(a.actor_id || "")}">
        ${avatar}
        <div class="detail-cast-chip-text">
          <span class="chip-name">${escapeHtml(a.name || (rich && rich.name) || "")}</span>
          ${role}
        </div>
      </div>`;
  }).join("");
  return chips ? `
    <div class="detail-cast">
      <div class="detail-cast-label">${escapeHtml(label)}</div>
      <div class="detail-cast-row">${chips}</div>
    </div>` : "";
}

// Editorial scene spread: eyebrow → headline → sensory line → the staged quote
// → the turn → cast. Listener-facing: no must-land facts, host moves, or claims.
function renderSceneSpread(ep) {
  const idx = ep.scenes.findIndex(s => s.scene_id === currentScene);
  const sc = ep.scenes[idx];
  const sceneNum = String(idx + 1).padStart(2, "0");
  const year = yearFrom(sc.timeframe);
  const city = cityTag(sc.location);

  const tagParts = [`Episode ${ep.episode_number}`];
  if (year) tagParts.push(year);
  if (city) tagParts.push(city);
  const tag = tagParts.join(" · ");

  const metaBits = [`<span>Scene ${sceneNum}</span>`];
  const dur = durationLabel(sc.duration_s);
  if (dur) metaBits.push(`<span class="dot">·</span><span>${dur}</span>`);

  const anchor = sc.entry_image || "";
  const plate = anchor
    ? `<div class="detail-plate"><div class="detail-plate-anchor">${escapeHtml(anchor)}</div></div>`
    : "";

  const obs = sc.observable_detail || "";
  const aud = sc.audible_detail || "";
  const sensory = (obs || aud)
    ? `<div class="detail-sensory">${escapeHtml(obs)}${aud ? `<span class="heard">You hear — ${escapeHtml(aud)}</span>` : ""}</div>`
    : "";

  const voiceId = (sc.excerpt_ids || []).find(id => EXCERPT_BY_ID[id]);
  const voiceHtml = voiceId ? quoteFigure(EXCERPT_BY_ID[voiceId]) : "";

  const turn = sc.beat_change
    ? `<div class="detail-turn"><span class="turn-label">The turn</span>${escapeHtml(sc.beat_change)}</div>`
    : "";

  // Cross-links: up to the act, and the idea behind the scene.
  const section = (ep.sections || []).find(s => s.section_id === sc.section_id);
  const actChip = section
    ? `<div class="detail-inline-ref"><span class="detail-label">In this act</span><span class="scene-ref-chip" data-section-id="${escapeHtml(section.section_id)}">${escapeHtml(section.purpose_label || actTitleFromId(section.section_id))}</span></div>`
    : "";
  const ideaId = (sc.primitive_ids || []).find(id => IDEA_BY_ID[id]);
  const idea = ideaId ? IDEA_BY_ID[ideaId] : null;
  const ideaHtml = idea
    ? `<div class="detail-inline-ref"><span class="detail-label">The idea behind it</span>
         <div class="idea-inline"><span class="idea-kind">${escapeHtml(IDEA_KIND_LABEL[idea.kind] || idea.kind)}</span><div class="idea-title">${escapeHtml(idea.title)}</div></div></div>`
    : "";

  return `
    <div class="detail-spread">
      <div class="detail-eyebrow">${escapeHtml(tag)}</div>
      <h1 class="detail-headline">${escapeHtml(sc.title || "")}</h1>
      <div class="detail-meta">${metaBits.join("")}</div>
      ${plate}
      ${sensory}
      ${voiceHtml}
      ${turn}
      ${actChip}
      ${ideaHtml}
      ${castBlockHtml(sc.actors, "Cast in this scene")}
    </div>
  `;
}

// Editorial section "act" detail: derived act title + anchor standfirst + what
// the act does (movement_goal) + a sonic flavor line + the act's key quote +
// jump-to-scene chips.
function actTitleFromId(sectionId) {
  return String(sectionId || "")
    .replace(/^s?\d+[_-]?/, "")        // strip leading s1_ / 1_ / s1-
    .replace(/[_-]+/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase())
    .trim();
}

function renderSectionSpread(ep) {
  const sIdx = (ep.sections || []).findIndex(s => s.section_id === currentSection);
  const sec = ep.sections[sIdx];
  if (!sec) return renderEpisodeEmpty(ep);

  const eyebrowParts = [`Episode ${ep.episode_number}`];
  if (sec.purpose_label && !GENERIC_PURPOSES.has(sec.purpose)) eyebrowParts.push(sec.purpose_label.toUpperCase());
  if (sec.runtime_min) eyebrowParts.push(`~${Math.round(sec.runtime_min)} MIN`);

  const sound = sec.sonic_anchor
    ? `<div class="detail-section-block"><div class="detail-label">The sound of it</div><div class="detail-sound">${escapeHtml(sec.sonic_anchor)}</div></div>` : "";
  const quote = sec.key_excerpt_id && EXCERPT_BY_ID[sec.key_excerpt_id]
    ? quoteFigure(EXCERPT_BY_ID[sec.key_excerpt_id]) : "";

  const sceneChips = ep.scenes
    .filter(s => s.section_id === sec.section_id)
    .map(s => `<span class="scene-ref-chip" data-scene-id="${escapeHtml(s.scene_id)}">${escapeHtml(s.title || "Scene")}</span>`)
    .join("");
  const scenesBlock = sceneChips
    ? `<div class="detail-section-block"><div class="detail-label">Scenes in this act</div><div class="scene-ref-row">${sceneChips}</div></div>` : "";

  return `
    <div class="detail-spread">
      <div class="detail-eyebrow">${escapeHtml(eyebrowParts.join(" · "))}</div>
      <h1 class="detail-headline">${escapeHtml(sec.anchor || actTitleFromId(sec.section_id) || sec.purpose_label || "Act")}</h1>
      ${quote}
      ${sound}
      ${scenesBlock}
    </div>
  `;
}

// Contested-history spread: a disputed event/act's competing readings, each
// with the evidence for it and (when present) against it. Opened by clicking a
// ⚖-marked timeline landmark instead of jumping straight to a scene.
function renderDebateSpread(ep) {
  const p = debatePrimitiveById(currentDebate);
  if (!p) return renderEpisodeEmpty(ep);
  const readings = (p.contest && p.contest.candidate_readings) || [];

  const eyebrowParts = [`Episode ${ep.episode_number}`, "CONTESTED"];
  const year = yearFrom(p.timeframe);
  if (year) eyebrowParts.push(year);
  const place = cityTag(p.geography);
  if (place) eyebrowParts.push(place);

  const readingCards = readings.map((r, i) => {
    const forHtml = r.support
      ? `<div class="debate-evidence is-for"><span class="debate-evidence-label">For</span>${escapeHtml(r.support)}</div>` : "";
    const butHtml = r.weakness
      ? `<div class="debate-evidence is-against"><span class="debate-evidence-label">But</span>${escapeHtml(r.weakness)}</div>` : "";
    return `
      <div class="debate-reading">
        <div class="debate-reading-num">${i + 1}</div>
        <div class="debate-reading-body">
          <div class="debate-reading-claim">${escapeHtml(r.reading)}</div>
          ${forHtml}${butHtml}
        </div>
      </div>`;
  }).join("");

  // Offer a jump to the scene that treats this — only when one is staged.
  const pick = pickSceneForPrimitive(p);
  const sceneLink = (pick && pick.sid)
    ? `<div class="detail-section-block"><span class="scene-ref-chip" data-primitive-id="${escapeHtml(p.id)}">Where the series treats this &rarr;</span></div>` : "";

  return `
    <div class="detail-spread">
      <div class="detail-eyebrow">${escapeHtml(eyebrowParts.join(" · "))}</div>
      <h1 class="detail-headline">${escapeHtml(p.title || "")}</h1>
      <div class="debate-lede">The same moment, read two ways.</div>
      <div class="debate-readings">${readingCards}</div>
      ${sceneLink}
    </div>
  `;
}

// Navigate from a contested primitive to the scene that stages it (loading the
// owning episode first if needed). Mirrors the timeline-landmark click path.
function goToPrimitiveScene(pid) {
  const p = debatePrimitiveById(pid);
  if (!p) return;
  const pick = pickSceneForPrimitive(p);
  if (!pick) return;
  if (pick.epIdx !== currentEpIdx) loadEpisode(pick.epIdx, false);
  if (pick.sid) openSceneDetail(pick.sid);
}

// One arc thread → a connected stepper (≥3 populated steps) or a key/val list.
function arcThreadHtml(t) {
  const steps = [["Premise", t.premise], ["Pressure", t.pressure], ["Movement", t.movement], ["Resolution", t.resolution]]
    .filter(([, v]) => v);
  if (!steps.length) return "";
  const title = t.label ? `<div class="actor-arc-title">${escapeHtml(t.label)}</div>` : "";
  const rows = steps.map(([k, v], i) =>
    `<div class="arc-step${i === steps.length - 1 ? " arc-last" : ""}">
       <span class="arc-step-key">${k}</span><span class="arc-step-val">${escapeHtml(v)}</span>
     </div>`).join("");
  const cls = steps.length >= 3 ? "arc-steps arc-stepper" : "arc-steps";
  return `<div class="actor-arc-thread">${title}<div class="${cls}">${rows}</div></div>`;
}

// Character page: masthead + a clear split between series-wide relevance and
// this-episode work. Series data comes from ACTOR_BY_ID (SERIES.actors); the
// episode arc from the slim per-episode cast entry.
function renderActorSpread(ep) {
  const series = ACTOR_BY_ID[currentActor];
  if (!series) return renderEpisodeEmpty(ep);
  const epEntry = ep.cast.find(c => c.actor_id === currentActor);
  const name = series.name || "";
  const portrait = series.image
    ? `<div class="detail-portrait" style="background-image:url('${series.image}')"></div>`
    : `<div class="detail-portrait initials"><span class="monogram">${initialsOf(name)}</span></div>`;

  const stats = [];
  if (series.tier) stats.push(escapeHtml(String(series.tier)));
  if (series.series_scope) stats.push(escapeHtml(String(series.series_scope).replace(/_/g, " ")));
  const statLine = stats.length ? `<div class="actor-statline">${stats.join(" · ")}</div>` : "";
  const funcs = (series.narrative_functions || [])
    .map(f => `<span class="actor-function-chip">${escapeHtml(String(f).replace(/_/g, " "))}</span>`).join("");

  const listBlock = (label, items) => {
    const lis = (items || []).map(x => `<li>${escapeHtml(x)}</li>`).join("");
    return lis ? `<div class="actor-sub"><div class="detail-label">${label}</div><ul class="actor-listing">${lis}</ul></div>` : "";
  };
  const gloss = series.intro_gloss ? `<div class="actor-gloss">${escapeHtml(series.intro_gloss)}</div>` : "";
  const bio = series.description ? `<div class="detail-body"><p>${escapeHtml(series.description)}</p></div>` : "";
  const epChips = (series.episodes_present || [])
    .map(n => `<span class="ep-ref-chip" data-ep-num="${n}">EP ${String(n).padStart(2, "0")}</span>`).join("");
  const epChipsBlock = epChips
    ? `<div class="actor-sub"><div class="detail-label">Appears in</div><div class="scene-ref-row">${epChips}</div></div>` : "";

  const seriesZone = `
    <div class="actor-series">
      ${gloss}${bio}
      ${listBlock("Transformations", series.transformations)}
      ${listBlock("Driven by", series.goals)}
      ${listBlock("Up against", series.constraints)}
      ${listBlock("At stake", series.stakes)}
      ${epChipsBlock}
    </div>`;

  let episodeZone = "";
  if (epEntry) {
    const arc = (epEntry.arc_threads || []).map(arcThreadHtml).filter(Boolean).join("");
    const ownWords = (ep.voice_ids || [])
      .map(id => EXCERPT_BY_ID[id]).filter(x => x && x.speaker_actor_id === currentActor)
      .slice(0, 2).map(quoteFigure).join("");
    const ownBlock = ownWords ? `<div class="actor-sub"><div class="detail-label">In their own words</div>${ownWords}</div>` : "";
    const sceneChips = ep.scenes
      .filter(s => (s.actors || []).some(a => a.actor_id === currentActor))
      .map(s => `<span class="scene-ref-chip" data-scene-id="${escapeHtml(s.scene_id)}">${escapeHtml(s.title || "Scene")}</span>`).join("");
    const sceneBlock = sceneChips ? `<div class="actor-sub"><div class="detail-label">Appears in</div><div class="scene-ref-row">${sceneChips}</div></div>` : "";
    if (arc || ownBlock || sceneBlock) {
      episodeZone = `
        <div class="actor-episode">
          <div class="detail-label accent">This episode · ${escapeHtml(ep.title || "")}</div>
          ${arc}${ownBlock}${sceneBlock}
        </div>`;
    }
  }

  return `
    <div class="detail-spread">
      <div class="detail-eyebrow">Cast</div>
      <div class="detail-masthead">
        ${portrait}
        <div class="detail-masthead-text">
          <h1 class="detail-headline">${escapeHtml(name)}</h1>
          ${statLine}
          ${funcs ? `<div class="actor-functions">${funcs}</div>` : ""}
        </div>
      </div>
      ${seriesZone}
      ${episodeZone}
    </div>
  `;
}

// Wire all cross-links in the freshly rendered detail pane: cast chips →
// actor detail, scene-ref chips → scene detail. Cast rows on the landing
// expand inline (accordion) instead — they're excluded from the data-actor-id
// mass selector and handled separately below.
function wireDetailPane() {
  detailPane.querySelectorAll("[data-actor-id]").forEach(el => {
    const aid = el.dataset.actorId;
    if (aid) el.addEventListener("click", () => openActorDetail(aid));
  });
  // Landing cast accordion — click to expand inline, Esc closes the open row.
  const ep = SERIES.episodes[currentEpIdx];
  detailPane.querySelectorAll(".landing-cast-row[data-cast-actor-id]").forEach(row => {
    const aid = row.dataset.castActorId;
    const body = row.querySelector(".landing-cast-body");
    const toggle = () => {
      const wasOpen = row.classList.contains("is-open");
      // Single-open invariant — close any other open row first.
      detailPane.querySelectorAll(".landing-cast-row.is-open").forEach(other => {
        if (other !== row) {
          other.classList.remove("is-open");
          other.setAttribute("aria-expanded", "false");
        }
      });
      if (wasOpen) {
        row.classList.remove("is-open");
        row.setAttribute("aria-expanded", "false");
      } else {
        if (aid && body) fillCastBody(ep, body, aid);
        row.classList.add("is-open");
        row.setAttribute("aria-expanded", "true");
      }
    };
    row.addEventListener("click", e => {
      // Clicks inside the body (excerpt scene links, actor-page button) stop
      // propagation themselves; this still fires for the avatar/name area.
      if (e.target.closest(".landing-cast-body")) return;
      toggle();
    });
    row.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      if (e.key === "Escape" && row.classList.contains("is-open")) {
        row.classList.remove("is-open");
        row.setAttribute("aria-expanded", "false");
      }
    });
  });
  detailPane.querySelectorAll(".scene-ref-chip[data-scene-id]").forEach(chip => {
    chip.addEventListener("click", () => openSceneDetail(chip.dataset.sceneId));
  });
  detailPane.querySelectorAll(".scene-ref-chip[data-primitive-id]").forEach(chip => {
    chip.addEventListener("click", () => goToPrimitiveScene(chip.dataset.primitiveId));
  });
  detailPane.querySelectorAll("[data-section-id]").forEach(chip => {
    chip.addEventListener("click", () => openSectionDetail(chip.dataset.sectionId));
  });
  detailPane.querySelectorAll(".ep-ref-chip[data-ep-num]").forEach(chip => {
    const idx = SERIES.episodes.findIndex(e => String(e.episode_number) === chip.dataset.epNum);
    if (idx < 0) return;
    chip.addEventListener("click", () => {
      const keep = currentActor;          // loadEpisode clears it; re-open after
      loadEpisode(idx, false);
      if (keep) openActorDetail(keep);
    });
  });
}

function durationLabel(sec) {
  if (!sec || !isFinite(sec) || sec <= 0) return "";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function highlightActive() {
  document.querySelectorAll(".scene-card").forEach(c => {
    c.classList.toggle("active", c.dataset.sceneId === currentScene);
  });
  document.querySelectorAll(".scene-section-head").forEach(h => {
    h.classList.toggle("active", h.dataset.sectionId === currentSection);
  });
}

// ── Excerpt rows ──
// Reusable per-quote primitive: TYPE · YEAR · audience meta + the verbatim
// quote + a light scene link. Used inside the cast accordion (landing) and
// the actor page. The standalone "Voices" tab was retired — the cast accordion
// plays that role, scoped to one actor at a time.
function renderExcerptRow(ep, x) {
  const row = document.createElement("div");
  row.className = "excerpt-row";

  const bits = [];
  if (x.excerpt_type && x.excerpt_type !== "other")
    bits.push(`<span class="vtype">${escapeHtml(x.excerpt_type.replace(/_/g, " "))}</span>`);
  const year = yearFrom(x.timeframe);
  if (year) bits.push(escapeHtml(year));
  if (x.audience) bits.push("to " + escapeHtml(x.audience));
  if (x.speaker) bits.push(escapeHtml(x.speaker));

  const staging = ep ? ep.scenes.find(s => (s.excerpt_ids || []).includes(x.id)) : null;
  const foot = staging
    ? `<div class="excerpt-foot"><span class="excerpt-scene" role="link" tabindex="0">Scene ${String(ep.scenes.indexOf(staging) + 1).padStart(2, "0")} <span class="arr">&rarr;</span></span></div>`
    : "";

  row.innerHTML = `
    ${bits.length ? `<div class="excerpt-meta">${bits.join(" · ")}</div>` : ""}
    <div class="excerpt-quote">${escapeHtml(x.verbatim)}</div>
    ${foot}
  `;
  if (staging) {
    const link = row.querySelector(".excerpt-scene");
    if (link) {
      const open = () => openSceneDetail(staging.scene_id);
      link.addEventListener("click", open);
      link.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    }
  }
  return row;
}

// ── THREADS & IDEAS PANEL — numbered dossier (readings + mechanisms) ──
const IDEA_KIND_LABEL = { reading: "The Road Not Taken", mechanism: "How It Worked" };
function buildThreadsPanel(ep) {
  threadsPanel.innerHTML = "";
  const ids = (ep.idea_ids || []).filter(id => IDEA_BY_ID[id]);
  if (tabCount.threads) tabCount.threads.textContent = ids.length;
  if (!ids.length) {
    threadsPanel.innerHTML = `<div class="panel-empty">No threads surfaced this episode.</div>`;
    return;
  }
  ids.forEach((iid, i) => {
    const idea = IDEA_BY_ID[iid];
    const card = document.createElement("div");
    card.className = "idea-card";
    // Scenes that touch this idea (by primitive cite) → clickable refs.
    const refScenes = ep.scenes
      .map((s, gi) => ({ s, gi }))
      .filter(({ s }) => (s.primitive_ids || []).includes(iid));
    const refs = refScenes.map(({ s, gi }) =>
      `<span class="scene-ref-chip" data-scene-id="${escapeHtml(s.scene_id)}">Scene ${String(gi + 1).padStart(2, "0")}</span>`).join("");
    card.innerHTML = `
      <div class="idea-num">${String(i + 1).padStart(2, "0")}</div>
      <div class="idea-kind">${escapeHtml(IDEA_KIND_LABEL[idea.kind] || idea.kind)}</div>
      <div class="idea-title">${escapeHtml(idea.title)}</div>
      ${idea.summary ? `<div class="idea-summary">${escapeHtml(idea.summary)}</div>` : ""}
      ${refs ? `<div class="idea-refs"><span class="arrow">&rarr;</span>${refs}</div>` : ""}
    `;
    card.querySelectorAll(".scene-ref-chip[data-scene-id]").forEach(chip =>
      chip.addEventListener("click", () => openSceneDetail(chip.dataset.sceneId)));
    threadsPanel.appendChild(card);
  });
}

// ── LEFT-RAIL TABS ──
function setLeftTab(name) {
  leftTab = name;
  document.querySelectorAll(".left-tab").forEach(t => {
    const on = t.dataset.tab === name;
    t.classList.toggle("is-active", on);
    t.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll(".left-tab-panel").forEach(p => {
    p.classList.toggle("is-active", p.dataset.panel === name);
  });
}

// ── EPISODES RAIL ──
// Build once at boot; clicking a chip just loads that episode. The active
// chip is whichever index matches currentEpIdx. updatePlaylistActive keeps
// its old name so callers don't change, but it now toggles chip classes.
function buildEpisodesRail() {
  episodesRail.innerHTML = "";
  SERIES.episodes.forEach((ep, i) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "ep-chip" + (i === currentEpIdx ? " is-active" : "");
    chip.dataset.index = i;
    chip.setAttribute("role", "tab");
    chip.setAttribute("aria-selected", i === currentEpIdx ? "true" : "false");
    const sceneCount = (ep.scenes || []).length;
    const castCount = (ep.cast || []).length;
    const metaParts = [];
    if (sceneCount) metaParts.push(`${sceneCount} ${sceneCount === 1 ? "scene" : "scenes"}`);
    if (castCount) metaParts.push(`${castCount} ${castCount === 1 ? "actor" : "actors"}`);
    chip.innerHTML = `
      <span class="ep-num">${String(ep.episode_number).padStart(2, "0")}</span>
      <span class="ep-text">
        <span class="ep-title">${escapeHtml(ep.title)}</span>
        <span class="ep-meta">${escapeHtml(metaParts.join(" · "))}</span>
      </span>
    `;
    chip.addEventListener("click", () => {
      // In actor mode, episode chips stay actor-bound: the user is browsing
      // "this actor across the series", so the chip switches the actor's
      // episode context rather than dropping them on the episode page.
      if (document.body.classList.contains("mode-actor") && actorRouteId) {
        const ep = SERIES.episodes[i];
        const actor = ACTOR_BY_ID[actorRouteId];
        const present = actor && (actor.episodes_present || []).includes(ep.episode_number);
        loadEpisode(i, false);                                  // clears actor state
        enterActorMode(actorRouteId, present ? ep.episode_number : null);  // re-enters with new ep
      } else {
        loadEpisode(i, false);
      }
    });
    episodesRail.appendChild(chip);
  });
}
function updatePlaylistActive() {
  // In actor mode, the active chip follows the actor's current episode
  // context, not the underlying currentEpIdx (which the user can't see).
  const inActor = document.body.classList.contains("mode-actor");
  const targetEpNum = inActor ? actorRouteEpNum : null;
  episodesRail.querySelectorAll(".ep-chip").forEach((c, i) => {
    let on;
    if (inActor && targetEpNum !== null) {
      on = SERIES.episodes[i] && SERIES.episodes[i].episode_number === targetEpNum;
    } else if (inActor) {
      on = false;  // series mode without ep context: no chip active
    } else {
      on = i === currentEpIdx;
    }
    c.classList.toggle("is-active", on);
    c.setAttribute("aria-selected", on ? "true" : "false");
  });
}

// ── TIMELINE STRIP — four-element design ──
//   1. Named landmarks (top salience / aliased events) with labels
//   2. Scene ticks (active episode only)
//   3. Linear year axis with adaptive label density
//   4. Episode bands (chronological extent)
//   + real-time playback cursor anchored to audioEl.currentTime
const TIMELINE_NS = "http://www.w3.org/2000/svg";
const timelineStrip = document.getElementById("timelineStrip");
const timelineSvg = document.getElementById("timelineSvg");
let timelineGeom = null;  // {xFor, minY, maxY, ...layout y constants}

// V1 (lanes): three horizontal lanes share the year axis.
// Top: EVENTS (red labels, 3 rows above axis with stems).
// Middle: BEATS (gray labels, 3 rows below axis).
// Bottom: ACTS (amber-dim labels, 3 rows below beats; stems UP to axis).
const TL_H = 205;
const TL_LANDMARK_ROW_Y = [10, 22, 34, 46, 58];   // five EVENT rows (dense clusters)
const TL_STEM_TOP = 68;
const TL_TICK_TOP = 60;                   // scene-tick top
const TL_AXIS_Y = 80;
const TL_YEAR_AXIS_Y = 95;                // year axis labels
const TL_SCENE_TITLE_ROW_Y = [110, 124, 138];  // BEAT rows
const TL_ACT_LANE_ROW_Y = [156, 170, 184];  // ACT lane rows
const TL_BACKDROP_Y = 73;                 // backdrop straddles the axis line
const TL_BACKDROP_H = 24;
const TL_BACKDROP_LABEL_Y = 198;          // anchored at strip bottom

// Primitive (event / act) belongs to the active episode iff the assembler
// recorded that episode's index in primitive.episode_idxs. (Scene-id formats
// vary across runs and even between episodes within a run — "ep1_s01",
// "scene_s1_a", "s01", "s1-1" — so the JS can't infer episode membership
// from a scene_id; the assembler does the resolution at build time.)
function primitiveInActiveEp(p, epIdx) {
  return (p.episode_idxs || []).includes(epIdx);
}

// Resolve a click on a timeline primitive (event/act) to (episode, scene).
// `episode_idxs` is the authoritative list of episodes that cite this
// primitive — trust it over scene_ids, which is just the union across all
// those episodes. Within the chosen episode, match by scene.primitive_ids
// rather than scene_id, because scene IDs are not unique across episodes
// (multiple episodes can each have an "s7_1").
function pickSceneForPrimitive(p) {
  const epIdxs = p.episode_idxs || [];
  if (epIdxs.length) {
    const targetEpIdx = epIdxs.includes(currentEpIdx) ? currentEpIdx : epIdxs[0];
    const ep = SERIES.episodes[targetEpIdx];
    if (ep) {
      const sc = (ep.scenes || []).find(s => (s.primitive_ids || []).includes(p.id));
      return { epIdx: targetEpIdx, sid: sc ? sc.scene_id : null };
    }
  }
  const sid = (p.scene_ids || [])[0];
  if (!sid) return null;
  const epIdx = SERIES.episodes.findIndex(ep => ep.scenes.some(s => s.scene_id === sid));
  return epIdx >= 0 ? { epIdx, sid } : null;
}

function buildTimeline() {
  const events = (SERIES.events || []);
  const acts = (SERIES.acts || []);
  const episodes = SERIES.episodes || [];
  // Need at least events OR an episode range to render anything.
  const hasEvents = events.length > 0;
  const hasEpRanges = episodes.some(ep => ep.time_range_start_y != null);
  if (!hasEvents && !hasEpRanges) {
    timelineStrip.classList.add("is-empty");
    return;
  }
  timelineStrip.classList.remove("is-empty");

  const rect = timelineStrip.getBoundingClientRect();
  // If the strip isn't laid out yet (first call before CSS applies), defer.
  if (rect.width < 100) {
    requestAnimationFrame(buildTimeline);
    return;
  }
  const W = Math.max(400, rect.width - 48);
  const padLeft = 8, padRight = 8;

  // Pull the items that drive cluster detection. In episode scope, include
  // events + acts + dated scenes from the active episode — clusters need to
  // see EVERY dated item or a single isolated beat (like Ep 13's 1937-1938
  // scenes) gets stranded outside the cluster layout. In series scope, fall
  // back to curated landmarks.
  const activeEp = episodes[currentEpIdx];
  let clusterItems;
  if (stripScope === "episode" && activeEp) {
    clusterItems = [
      ...events.filter(e => primitiveInActiveEp(e, currentEpIdx)),
      ...acts.filter(a => primitiveInActiveEp(a, currentEpIdx)),
      ...(activeEp.scenes || []).filter(s => s.timeframe_start_y != null).map(s => ({
        start_y: s.timeframe_start_y,
        end_y: s.timeframe_end_y || s.timeframe_start_y,
      })),
    ];
  } else {
    const landmarks = events.filter(e => e.is_landmark);
    clusterItems = landmarks.length ? landmarks : events;
  }
  if (!clusterItems.length) {
    timelineStrip.classList.add("is-empty");
    return;
  }

  const innerW = W - padLeft - padRight;
  const layout = buildClusterLayout(clusterItems, innerW, padLeft);

  timelineSvg.innerHTML = "";
  timelineSvg.setAttribute("viewBox", `0 0 ${W} ${TL_H}`);
  timelineSvg.setAttribute("preserveAspectRatio", "none");
  _cursorEls = null;  // discard refs from prior build (innerHTML wiped them).

  // Merged geom: cluster layout + xFor + canonical W / padLeft / innerW so
  // existing renderers (which read timelineGeom for padding) still work.
  timelineGeom = {
    ...layout,
    W, padLeft, innerW,
  };

  // Scope-chip visibility: only relevant while zoomed into an episode.
  const chip = document.getElementById("stripScopeChip");
  if (chip) chip.hidden = stripScope !== "episode";

  // Z-order: backdrop at back, then year axis + breaks, scene ticks,
  // landmarks, acts, scene titles, cursor on top.
  renderActiveEpisodeBackdrop(activeEp, layout);
  renderYearAxis(layout);
  renderClusterBreaks(layout);
  renderSceneTicks(layout.xFor);
  // V1: events render in the top lane only; acts get their own lane below
  // beats. Diamonds still drawn at axis for visual continuity.
  renderLandmarks(events, [], layout.xFor, W);
  renderActs(acts, layout.xFor, W);
  if (stripScope === "episode" && activeEp) {
    renderActLane(acts, layout.xFor, W);
  }
  // Scene-title layer is episode-scope only — it describes what THIS episode
  // covers. Showing it in series scope would be misleading (you'd see EP 1's
  // scenes while looking at the full arc).
  if (stripScope === "episode" && activeEp) {
    renderSceneTitles(layout.xFor, W);
  }
  updatePlaybackCursor();
}

// Cluster-based broken axis. Detect contiguous bursts of activity separated
// by multi-year dead zones, allocate proportional width per cluster + fixed
// width per break, and use linear time mapping inside each cluster. Replaces
// the previous Gaussian density warp which assumed continuous density and
// fought the bursty real data (see Eps 3, 7, 12, 13 of partition).
function buildClusterLayout(items, innerW, padLeft) {
  const THRESHOLD = 1.5;        // years; start_y gap > this splits a cluster
  const BREAK_PX = 44;          // visual break-zone width
  const MIN_CLUSTER_PX = 90;    // floor per cluster (so 1-item clusters stay readable)
  const MIN_CLUSTER_SPAN_Y = 0.5;  // cluster gets at least this much "duration" for xFor

  if (!items.length) {
    const c = { start_y: 0, end_y: 1, items: [], x1: padLeft, x2: padLeft + innerW };
    return { clusters: [c], breaks: [], minY: 0, maxY: 1,
      xFor: () => padLeft + innerW / 2 };
  }

  // Sort & group into clusters. Cluster boundaries are detected on start_y
  // ONLY — using end_y here breaks clusters wide open whenever an item has a
  // multi-decade span (e.g. "Ninety Years of Quiet" spans 1858→1948 and would
  // glue the entire episode into one cluster).
  const sorted = items.slice().sort((a, b) => a.start_y - b.start_y);
  const clusters = [];
  let cur = null;
  for (const it of sorted) {
    const sy = it.start_y;
    if (!cur || (sy - cur.last_sy) > THRESHOLD) {
      cur = { start_y: sy, end_y: sy, last_sy: sy, items: [it] };
      clusters.push(cur);
    } else {
      cur.end_y = Math.max(cur.end_y, sy);
      cur.last_sy = sy;
      cur.items.push(it);
    }
  }
  // Remember the data-derived year extents BEFORE padding — used by the year
  // axis so a 1-item cluster at 1847 doesn't label 1846/1847/1848 (the
  // pad-out lies). Pad zero-width clusters afterwards so xFor doesn't divide
  // by zero.
  for (const c of clusters) {
    c.data_start_y = c.start_y;
    c.data_end_y = c.end_y;
    if (c.end_y - c.start_y < MIN_CLUSTER_SPAN_Y) {
      const mid = (c.start_y + c.end_y) / 2;
      c.start_y = mid - MIN_CLUSTER_SPAN_Y / 2;
      c.end_y = mid + MIN_CLUSTER_SPAN_Y / 2;
    }
  }

  // Allocate widths. Per-cluster weight = item count (floor 1). Reserve
  // BREAK_PX per gap. Apply MIN_CLUSTER_PX floor and redistribute the deficit.
  const nBreaks = clusters.length - 1;
  const availForClusters = Math.max(MIN_CLUSTER_PX * clusters.length,
                                    innerW - nBreaks * BREAK_PX);
  const weights = clusters.map(c => Math.max(1, c.items.length));
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  const widths = weights.map(w => availForClusters * w / totalWeight);
  // Floor small clusters; pull deficit from the big ones proportionally.
  let deficit = 0;
  for (let i = 0; i < widths.length; i++) {
    if (widths[i] < MIN_CLUSTER_PX) {
      deficit += MIN_CLUSTER_PX - widths[i];
      widths[i] = MIN_CLUSTER_PX;
    }
  }
  if (deficit > 0) {
    const above = widths.map((w, i) => w > MIN_CLUSTER_PX ? w - MIN_CLUSTER_PX : 0);
    const aboveTotal = above.reduce((a, b) => a + b, 0);
    if (aboveTotal > deficit) {
      for (let i = 0; i < widths.length; i++) {
        if (above[i] > 0) widths[i] -= deficit * above[i] / aboveTotal;
      }
    }
  }

  // Lay out positions.
  let x = padLeft;
  const breaks = [];
  for (let i = 0; i < clusters.length; i++) {
    clusters[i].x1 = x;
    clusters[i].x2 = x + widths[i];
    x = clusters[i].x2;
    if (i < clusters.length - 1) {
      breaks.push({
        x1: x, x2: x + BREAK_PX,
        prev_end_y: clusters[i].end_y,
        next_start_y: clusters[i + 1].start_y,
        gap_years: clusters[i + 1].start_y - clusters[i].end_y,
      });
      x += BREAK_PX;
    }
  }

  // Stretch the last cluster's x2 to fully fill the strip (avoids a thin
  // unused sliver from float rounding or the deficit-redistribution).
  const targetRight = padLeft + innerW;
  const overshoot = clusters[clusters.length - 1].x2 - targetRight;
  if (Math.abs(overshoot) > 0.5) {
    clusters[clusters.length - 1].x2 = targetRight;
  }

  function xFor(y) {
    for (let i = 0; i < clusters.length; i++) {
      const c = clusters[i];
      if (y < c.start_y) {
        if (i === 0) return c.x1;
        const prev = clusters[i - 1];
        const span = c.start_y - prev.end_y;
        const t = span > 0 ? (y - prev.end_y) / span : 0.5;
        return prev.x2 + t * (c.x1 - prev.x2);
      }
      if (y <= c.end_y) {
        const span = c.end_y - c.start_y;
        const t = span > 0 ? (y - c.start_y) / span : 0.5;
        return c.x1 + t * (c.x2 - c.x1);
      }
    }
    return clusters[clusters.length - 1].x2;
  }

  return {
    clusters, breaks,
    minY: clusters[0].start_y,
    maxY: clusters[clusters.length - 1].end_y,
    xFor,
  };
}

// Format a gap duration as a compact label.
function formatGapYears(gy) {
  if (gy < 0.92) {
    const mo = Math.round(gy * 12);
    return mo <= 1 ? "~1 mo" : `~${mo} mos`;
  }
  if (gy < 1.5) return "~1 yr";
  return `~${Math.round(gy)} yrs`;
}

function renderYearAxis(layout) {
  const { clusters } = layout;
  const MIN_LABEL_GAP = 32;
  const TICK_DEPTH_FULL = 5;

  for (const c of clusters) {
    // Axis line for THIS cluster only — gaps appear naturally between them.
    appendSvg("line", {
      x1: c.x1, x2: c.x2, y1: TL_AXIS_Y, y2: TL_AXIS_Y,
      class: "timeline-axis",
    });

    // Label range from data extents (pre-padding) so 1-item clusters don't
    // label phantom years around their padded bounds.
    const ds = c.data_start_y != null ? c.data_start_y : c.start_y;
    const de = c.data_end_y != null ? c.data_end_y : c.end_y;
    const y0 = Math.floor(ds);
    const y1 = Math.ceil(de);
    const span = Math.max(1, y1 - y0);

    // Adaptive label step — narrow clusters label every year, wide clusters
    // step by 2/5/10/25 so the axis doesn't turn into a barcode of digits.
    const step = span <= 4 ? 1
               : span <= 12 ? 2
               : span <= 40 ? 5
               : span <= 120 ? 10
               : 25;

    // Walk on the step grid, snapped to multiples for clean labels. Special
    // case: if data is contained inside a single calendar year (ds==de or
    // within 1y), label only that year — avoids triple-labelling around a
    // 1-item cluster.
    const labelYears = [];
    if (Math.ceil(de) - Math.floor(ds) <= 1 && c.items.length <= 2) {
      labelYears.push(Math.floor(ds));
    } else {
      const first = Math.ceil(y0 / step) * step;
      for (let y = first; y <= y1; y += step) labelYears.push(y);
    }

    let lastLabelX = -Infinity;
    for (const y of labelYears) {
      const x = Math.max(c.x1, Math.min(c.x2, layout.xFor(y)));
      if ((x - lastLabelX) < MIN_LABEL_GAP) continue;
      appendSvg("line", {
        x1: x, x2: x, y1: TL_AXIS_Y,
        y2: TL_AXIS_Y + TICK_DEPTH_FULL,
        class: "timeline-tick",
      });
      appendSvg("text", {
        x: x, y: TL_YEAR_AXIS_Y, "text-anchor": "middle",
        class: "timeline-year",
      }, String(y));
      lastLabelX = x;
    }
  }
}

// Render visual break markers between clusters: a short broken-axis glyph
// straddling the axis line, plus a small gap-duration label above.
function renderClusterBreaks(layout) {
  // Two parallel slashes straddling the axis, plus a "~N yrs" label below
  // the year tick row so it doesn't collide with year text.
  const breakGlyphYTop = TL_AXIS_Y - 6;
  const breakGlyphYBot = TL_AXIS_Y + 6;
  const labelY = TL_YEAR_AXIS_Y + 12;
  for (const b of layout.breaks) {
    const cx = (b.x1 + b.x2) / 2;
    appendSvg("line", {
      x1: cx - 5, x2: cx + 1, y1: breakGlyphYBot, y2: breakGlyphYTop,
      class: "timeline-axis-break",
    });
    appendSvg("line", {
      x1: cx + 1, x2: cx + 7, y1: breakGlyphYBot, y2: breakGlyphYTop,
      class: "timeline-axis-break",
    });
    appendSvg("text", {
      x: cx + 1, y: labelY, "text-anchor": "middle",
      class: "timeline-break-label",
    }, formatGapYears(b.gap_years));
  }
}

// — Active-episode backdrop — single subtle wash spanning the active
// episode's chronological range, with an inline "EPISODE N · 1953—1977"
// label. Replaces the v2 stacked-stripe episode-band loop (which became
// barcode clutter for series with many episodes like partition's 13).
function renderActiveEpisodeBackdrop(ep, layout) {
  if (!ep || ep.time_range_start_y == null || ep.time_range_end_y == null) return;

  // Backdrop per cluster — the break zones in between stay un-washed so the
  // visual structure of "burst | gap | burst" is unambiguous.
  for (const c of layout.clusters) {
    appendSvg("rect", {
      x: c.x1, y: TL_BACKDROP_Y, width: c.x2 - c.x1, height: TL_BACKDROP_H,
      class: "timeline-ep-backdrop",
    });
  }

  // Year-range footer label spans first-cluster.x1 to last-cluster.x2.
  const firstC = layout.clusters[0];
  const lastC = layout.clusters[layout.clusters.length - 1];
  const x1 = firstC.x1;
  const x2 = lastC.x2;
  const rightEdge = timelineGeom.padLeft + timelineGeom.innerW;

  const y1 = Math.floor(ep.time_range_start_y);
  const y2 = Math.ceil(ep.time_range_end_y);
  const range = (y1 === y2) ? `${y1}` : `${y1}—${y2}`;
  const labelText = `EPISODE ${ep.episode_number} · ${range}`;

  const labelWidth = labelText.length * 5.5;
  const labelX = (x2 - x1) > labelWidth + 8 ? x1 + 6 : x1;
  const anchor = (x2 - x1) > labelWidth + 8 ? "start" : (x1 + labelWidth + 4 > rightEdge ? "end" : "start");
  appendSvg("text", {
    x: anchor === "end" ? x2 - 4 : labelX,
    y: TL_BACKDROP_LABEL_Y, "text-anchor": anchor,
    class: "timeline-ep-backdrop-label",
  }, labelText);
}

// — Scene ticks for the active episode — small vertical marks above axis.
function renderSceneTicks(xFor) {
  const ep = SERIES.episodes[currentEpIdx];
  if (!ep) return;
  for (const sc of ep.scenes) {
    if (sc.timeframe_start_y == null) continue;
    const x = xFor(sc.timeframe_start_y);
    const tick = appendSvg("line", {
      x1: x, x2: x, y1: TL_TICK_TOP, y2: TL_AXIS_Y - 1,
      class: "timeline-tick-scene",
      "data-scene-id": sc.scene_id,
    });
    appendSvg("title", {}, `${sc.title} · ${sc.timeframe || "—"}`, tick);
    tick.addEventListener("click", () => openSceneDetail(sc.scene_id));
  }
}

// — Named landmarks — top-salience or alias-bearing events get labeled tags.
// Two-row layout: the highest-salience landmark in any cluster takes row 0;
// the next takes row 1. Only when both rows collide does a landmark demote
// to an anonymous accent tick (these still tooltip on hover).
function renderLandmarks(events, acts, xFor, W) {
  const { minY, maxY } = timelineGeom;
  // Acts join the same label pool as events so the listener can see WHO did
  // WHAT alongside WHAT HAPPENED. The diamond glyph still gets drawn by
  // renderActs; this function only handles the label + stem above the axis.
  // Acts carry a fixed mid-tier salience (set in assemble_acts) so high-
  // salience events still win row 0 in dense clusters.
  const primitives = [...events, ...acts];

  // Scope branches:
  // - "series": only `is_landmark === true` events (curated narrative anchors),
  //   filtered to axis bounds. Non-active-ep ones dim via CSS for context.
  //   Acts only show when their episode is active — they're sparser and
  //   become noise at series scope.
  // - "episode": ALL events + acts cited by the active episode.
  let landmarks;
  if (stripScope === "episode") {
    landmarks = primitives.filter(p => primitiveInActiveEp(p, currentEpIdx)
      && p.label && p.end_y >= minY && p.start_y <= maxY + 1);
  } else {
    landmarks = primitives.filter(p =>
      (p.kind === "event" ? p.is_landmark : primitiveInActiveEp(p, currentEpIdx))
      && p.end_y >= minY && p.start_y <= maxY + 1);
  }
  landmarks.sort((a, b) => (b.salience || 0) - (a.salience || 0));
  // Per-row collision tracking. Each row stores rightmost label edge seen.
  const rowOccupied = TL_LANDMARK_ROW_Y.map(() => []);

  for (const p of landmarks) {
    const x = xFor(p.start_y);
    const inActiveEp = primitiveInActiveEp(p, currentEpIdx);
    const isAct = p.kind === "act";
    const contestClass = p.contest ? " is-contested" : "";
    const text = (p.contest ? "⚖ " : "") + (p.label || "").toUpperCase();
    // Empirical 7.4 px/char for the uppercase 9px font with letter-spacing
    // 0.14em. Actual rendered widths range 6.4-7.0 per char depending on
    // glyph density; 7.4 adds ~10% safety margin so glyph-heavy labels
    // (e.g. JALLIANWALA BAGH) don't squeeze into the same row as neighbors.
    const fullWidth = text.length * 7.4;
    const halfWidth = fullWidth / 2;

    // Resolve anchor BEFORE collision check — labels near the edges get
    // clamped to start/end, which shifts their rendered rect away from
    // [x-halfWidth, x+halfWidth]. Collision detection must use the rect
    // after clamping, otherwise edge-anchored labels overlap their neighbors.
    let anchor = "middle", lx = x, left, right;
    if (x - halfWidth < 2) { anchor = "start"; lx = 2; left = lx; right = lx + fullWidth; }
    else if (x + halfWidth > W - 2) { anchor = "end"; lx = W - 2; left = lx - fullWidth; right = lx; }
    else { left = x - halfWidth; right = x + halfWidth; }

    // Find lowest row where this label fits without colliding.
    let row = -1;
    for (let r = 0; r < TL_LANDMARK_ROW_Y.length; r++) {
      const fits = rowOccupied[r].every(seg => seg.right + 4 < left || seg.left - 4 > right);
      if (fits) { row = r; break; }
    }
    if (row < 0) {
      // Acts already have a diamond glyph from renderActs serving as the
      // axis marker, so no demotion tick is needed for them.
      if (isAct) continue;
      // Events with no room — demote to an accent tick under the axis.
      const tick = appendSvg("line", {
        x1: x, x2: x, y1: TL_AXIS_Y, y2: TL_AXIS_Y + 7,
        class: "timeline-tick",
        "data-event-id": p.id,
      });
      tick.setAttribute("style", "stroke: var(--accent); opacity: 0.55;");
      appendSvg("title", {}, `${p.title} · ${p.timeframe}`, tick);
      continue;
    }
    rowOccupied[row].push({ left, right });

    const activeClass = inActiveEp ? " is-in-active-ep" : "";
    const actClass = isAct ? " is-act" : "";
    const idAttr = isAct ? "data-act-id" : "data-event-id";
    appendSvg("line", {
      x1: x, x2: x, y1: TL_STEM_TOP, y2: TL_AXIS_Y - 1,
      class: "timeline-stem" + activeClass + actClass,
      [idAttr]: p.id,
    });
    const labelY = TL_LANDMARK_ROW_Y[row];
    const subjPrefix = isAct && p.acting_subject ? `${p.acting_subject} · ` : "";
    const labelNode = appendSvg("text", {
      x: lx, y: labelY, "text-anchor": anchor,
      class: "timeline-landmark" + activeClass + actClass + contestClass,
      [idAttr]: p.id,
    }, text);
    appendSvg("title", {}, `${subjPrefix}${p.title} · ${p.timeframe}`, labelNode);

    if (p.contest || (p.scene_ids && p.scene_ids.length)) {
      labelNode.style.cursor = "pointer";
      labelNode.addEventListener("click", () => {
        if (p.contest) { openDebateDetail(p.id); return; }
        const pick = pickSceneForPrimitive(p);
        if (!pick) return;
        if (pick.epIdx !== currentEpIdx) loadEpisode(pick.epIdx, false);
        if (pick.sid) openSceneDetail(pick.sid);
      });
    }
  }
}

// — Acts — diamond markers above the axis for agentive decisions
// ("Shah orders martial law without nosebleeds"). Always tagged to the
// active episode if relevant — at series scope we still show only active-
// episode acts to avoid clutter (acts are sparser than events anyway).
function renderActs(acts, xFor, W) {
  const { minY, maxY } = timelineGeom;
  const visible = acts.filter(a =>
    a.end_y >= minY && a.start_y <= maxY + 1
    && primitiveInActiveEp(a, currentEpIdx)
  );
  for (const a of visible) {
    const x = xFor(a.start_y);
    const d = 4.5;  // half-diagonal of the diamond
    const cy = TL_AXIS_Y - 7;
    const diamond = appendSvg("polygon", {
      points: `${x},${cy - d} ${x + d},${cy} ${x},${cy + d} ${x - d},${cy}`,
      class: "timeline-act is-in-active-ep",
      "data-act-id": a.id,
    });
    const subj = a.acting_subject ? `${a.acting_subject} · ` : "";
    appendSvg("title", {}, `${subj}${a.title} · ${a.timeframe || "—"}`, diamond);

    if (a.contest || (a.scene_ids && a.scene_ids.length)) {
      diamond.style.cursor = "pointer";
      diamond.classList.toggle("is-contested", !!a.contest);
      diamond.addEventListener("click", () => {
        if (a.contest) { openDebateDetail(a.id); return; }
        const pick = pickSceneForPrimitive(a);
        if (!pick) return;
        if (pick.epIdx !== currentEpIdx) loadEpisode(pick.epIdx, false);
        if (pick.sid) openSceneDetail(pick.sid);
      });
    }
  }
}

// — Scene titles inline below the year axis (episode scope only) —
// Renders short scene labels at the chronological position of each scene.
// Three-row collision packing identical to renderLandmarks, but anchored
// from below (rows grow downward from TL_SCENE_TITLE_ROW_Y[0]).
function _cleanSceneTitle(t) {
  if (!t) return "";
  const s = t.replace(/\s*\(.*?\)/g, "").trim();
  return s.split(/\s+[—–·:]\s+/)[0];
}

function renderSceneTitles(xFor, W) {
  const ep = SERIES.episodes[currentEpIdx];
  if (!ep) return;
  const { minY, maxY } = timelineGeom;
  // Per-row right-edge tracking for greedy collision packing.
  const rowOccupied = TL_SCENE_TITLE_ROW_Y.map(() => []);

  for (const sc of ep.scenes) {
    if (sc.timeframe_start_y == null) continue;
    if (sc.timeframe_start_y > maxY + 1 || (sc.timeframe_end_y || sc.timeframe_start_y) < minY) continue;
    const x = xFor(sc.timeframe_start_y);
    const text = _cleanSceneTitle(sc.title);
    if (!text) continue;
    // 8px font, slightly tighter letter-spacing than landmarks → ~5.6 px/char.
    const fullWidth = text.length * 5.6;
    const halfWidth = fullWidth / 2;

    let anchor = "middle", lx = x, left, right;
    if (x - halfWidth < 2) { anchor = "start"; lx = 2; left = lx; right = lx + fullWidth; }
    else if (x + halfWidth > W - 2) { anchor = "end"; lx = W - 2; left = lx - fullWidth; right = lx; }
    else { left = x - halfWidth; right = x + halfWidth; }

    let row = -1;
    for (let r = 0; r < TL_SCENE_TITLE_ROW_Y.length; r++) {
      const fits = rowOccupied[r].every(seg => seg.right + 3 < left || seg.left - 3 > right);
      if (fits) { row = r; break; }
    }
    if (row < 0) continue;  // no room; just skip (tick at axis already represents the scene)
    rowOccupied[row].push({ left, right });

    const t = appendSvg("text", {
      x: lx, y: TL_SCENE_TITLE_ROW_Y[row], "text-anchor": anchor,
      class: "timeline-scene-title",
      "data-scene-id": sc.scene_id,
    }, text);
    appendSvg("title", {}, `${sc.title} · ${sc.timeframe || "—"}`, t);
    t.addEventListener("click", () => openSceneDetail(sc.scene_id));
  }
}

// — V1 ONLY — Act lane: amber labels below the beats row, with a short
// stem rising up to the diamond glyph at the axis. Uses the same greedy
// row-packing as renderLandmarks but in its own row pool.
function renderActLane(acts, xFor, W) {
  const { minY, maxY } = timelineGeom;
  const visible = acts.filter(a =>
    a.end_y >= minY && a.start_y <= maxY + 1
    && primitiveInActiveEp(a, currentEpIdx)
    && a.label
  );
  // Acts sorted by start year for predictable left-to-right packing.
  visible.sort((a, b) => a.start_y - b.start_y);
  const rowOccupied = TL_ACT_LANE_ROW_Y.map(() => []);

  for (const a of visible) {
    const x = xFor(a.start_y);
    const contestClass = a.contest ? " is-contested" : "";
    const text = (a.contest ? "⚖ " : "") + (a.label || "").toUpperCase();
    const fullWidth = text.length * 6.2;   // smaller font than landmarks
    const halfWidth = fullWidth / 2;

    let anchor = "middle", lx = x, left, right;
    if (x - halfWidth < 2) { anchor = "start"; lx = 2; left = lx; right = lx + fullWidth; }
    else if (x + halfWidth > W - 2) { anchor = "end"; lx = W - 2; left = lx - fullWidth; right = lx; }
    else { left = x - halfWidth; right = x + halfWidth; }

    let row = -1;
    for (let r = 0; r < TL_ACT_LANE_ROW_Y.length; r++) {
      const fits = rowOccupied[r].every(seg => seg.right + 3 < left || seg.left - 3 > right);
      if (fits) { row = r; break; }
    }
    if (row < 0) continue;  // diamond at axis is enough; no demotion tick
    rowOccupied[row].push({ left, right });

    // Stem from just below the axis (under the diamond) down to the label row.
    appendSvg("line", {
      x1: x, x2: x, y1: TL_AXIS_Y + 2, y2: TL_ACT_LANE_ROW_Y[row] - 8,
      class: "timeline-act-lane-stem",
      "data-act-id": a.id,
    });
    const subjPrefix = a.acting_subject ? `${a.acting_subject} · ` : "";
    const labelNode = appendSvg("text", {
      x: lx, y: TL_ACT_LANE_ROW_Y[row], "text-anchor": anchor,
      class: "timeline-act-lane-label" + contestClass,
      "data-act-id": a.id,
    }, text);
    appendSvg("title", {}, `${subjPrefix}${a.title} · ${a.timeframe || "—"}`, labelNode);

    if (a.contest || (a.scene_ids && a.scene_ids.length)) {
      labelNode.style.cursor = "pointer";
      labelNode.addEventListener("click", () => {
        if (a.contest) { openDebateDetail(a.id); return; }
        const pick = pickSceneForPrimitive(a);
        if (!pick) return;
        if (pick.epIdx !== currentEpIdx) loadEpisode(pick.epIdx, false);
        if (pick.sid) openSceneDetail(pick.sid);
      });
    }
  }
}

function yearOfEvent(e) {
  // Pull the year(s) from the raw timeframe string; fall back to floor(start_y).
  const m = String(e.timeframe || "").match(/\d{4}/g);
  if (m && m.length) return m[m.length - 1];  // last year mentioned (range end)
  return String(Math.floor(e.start_y));
}

// — Playback cursor — driven by audioEl.currentTime, refreshed on timeupdate.
// Maps audio time → chronological position via cumulative scene durations:
// each scene contributes its duration_s; the cursor sits at the scene's
// timeframe, interpolated toward the next scene by progress through the audio.
let _cursorEls = null;  // {line, label} so updates don't trash & rebuild

function updatePlaybackCursor() {
  if (!timelineGeom) return;
  const ep = SERIES.episodes[currentEpIdx];
  if (!ep) return;

  // Pick which year to anchor the cursor at.
  let year = null, sceneTitle = null;

  if (audioEl.duration && audioEl.duration > 0 && audioEl.currentTime > 0) {
    // Audio is loaded and (likely) playing — map currentTime → scene → year.
    const t = audioEl.currentTime;
    let acc = 0;
    for (let i = 0; i < ep.scenes.length; i++) {
      const sc = ep.scenes[i];
      const d = sc.duration_s || 30;
      if (acc + d > t) {
        if (sc.timeframe_start_y != null) {
          const next = ep.scenes[i + 1];
          const u = (t - acc) / d;
          const startY = sc.timeframe_start_y;
          const endY = (next && next.timeframe_start_y != null)
                       ? next.timeframe_start_y
                       : (sc.timeframe_end_y != null ? sc.timeframe_end_y : startY);
          year = startY + u * (endY - startY);
          sceneTitle = sc.title;
        }
        break;
      }
      acc += d;
    }
  }

  // Fallback to manually-selected scene's timeframe if audio idle.
  if (year == null && currentScene) {
    const sc = ep.scenes.find(s => s.scene_id === currentScene);
    if (sc && sc.timeframe_start_y != null) {
      year = sc.timeframe_start_y;
      sceneTitle = sc.title;
    }
  }

  renderCursor(year, sceneTitle);
}

function renderCursor(year, sceneTitle) {
  // Lazy-create the cursor elements once; subsequent calls just move them.
  // Line + downward triangle only — no inline label (the editorial detail
  // pane below already names the scene; a label here would collide with
  // the row-2 landmark labels in dense clusters).
  if (_cursorEls && _cursorEls.svg !== timelineSvg) _cursorEls = null;
  if (year == null) {
    if (_cursorEls) {
      _cursorEls.line.style.display = "none";
      _cursorEls.head.style.display = "none";
    }
    return;
  }
  if (!_cursorEls) {
    _cursorEls = {
      svg: timelineSvg,
      line: appendSvg("line", {
        x1: 0, x2: 0, y1: TL_STEM_TOP - 2, y2: TL_AXIS_Y + 2,
        class: "timeline-cursor-playback",
      }),
      head: appendSvg("polygon", {
        points: "0,0",
        class: "timeline-cursor-head",
      }),
      title: appendSvg("title", {}, "", null),
    };
    _cursorEls.line.appendChild(_cursorEls.title);  // tooltip on cursor hover
  }
  const x = timelineGeom.xFor(year);
  _cursorEls.line.style.display = "";
  _cursorEls.line.setAttribute("x1", x);
  _cursorEls.line.setAttribute("x2", x);
  _cursorEls.head.style.display = "";
  _cursorEls.head.setAttribute(
    "points",
    `${x - 4},${TL_STEM_TOP - 6} ${x + 4},${TL_STEM_TOP - 6} ${x},${TL_STEM_TOP - 1}`,
  );
  _cursorEls.title.textContent = sceneTitle || "";
}

// Active-scene tick + landmark highlight, refreshed on every renderRightPane.
function updateTimelineActive() {
  if (!timelineGeom) return;
  timelineSvg.querySelectorAll(".timeline-tick-scene.is-active, .timeline-stem.is-active, .timeline-landmark.is-active")
    .forEach(n => n.classList.remove("is-active"));
  if (currentScene) {
    const tick = timelineSvg.querySelector(`.timeline-tick-scene[data-scene-id="${currentScene}"]`);
    if (tick) tick.classList.add("is-active");
    const ep = SERIES.episodes[currentEpIdx];
    const sc = ep && ep.scenes.find(s => s.scene_id === currentScene);
    if (sc) {
      (sc.primitive_ids || []).forEach(pid => {
        const stem = timelineSvg.querySelector(`.timeline-stem[data-event-id="${pid}"]`);
        if (stem) stem.classList.add("is-active");
        const label = timelineSvg.querySelector(`.timeline-landmark[data-event-id="${pid}"]`);
        if (label) label.classList.add("is-active");
      });
    }
  }
  updatePlaybackCursor();
}

function appendSvg(tag, attrs, text, parent) {
  const node = document.createElementNS(TIMELINE_NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (text != null) node.textContent = text;
  (parent || timelineSvg).appendChild(node);
  return node;
}

// Drive the playback cursor on every audio timeupdate (~4 Hz).
audioEl.addEventListener("timeupdate", updatePlaybackCursor);
audioEl.addEventListener("seeked", updatePlaybackCursor);

// Rebuild on viewport resize.
let _timelineResizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(_timelineResizeTimer);
  _timelineResizeTimer = setTimeout(() => {
    _cursorEls = null;  // discard refs; they belong to the old svg innerHTML
    buildTimeline();
    updateTimelineActive();
  }, 120);
});

// ── UTILITIES ──
function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ── EVENT LISTENERS ──
btnPlay.addEventListener("click", () => {
  if (btnPlay.disabled) return;
  if (isPlaying) { audioEl.pause(); setPlaying(false); }
  else {
    if (!audioEl.currentSrc && !audioEl.src) loadEpisode(currentEpIdx, true);
    else audioEl.play().then(() => setPlaying(true)).catch(() => {});
  }
});
btnBack30.addEventListener("click", () => {
  audioEl.currentTime = Math.max(0, audioEl.currentTime - 30);
});
btnFwd30.addEventListener("click", () => {
  audioEl.currentTime = Math.min(audioEl.duration || 0, audioEl.currentTime + 30);
});
btnSpeed.addEventListener("click", () => {
  speedIndex = (speedIndex + 1) % speedOptions.length;
  audioEl.playbackRate = speedOptions[speedIndex];
  btnSpeed.textContent = speedOptions[speedIndex] + "×";
});
waveformWrap.addEventListener("click", e => {
  if (waveformWrap.classList.contains("disabled")) return;
  const rect = canvas.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if (audioEl.duration) {
    audioEl.currentTime = ratio * audioEl.duration;
    if (!isPlaying) {
      const p = audioEl.currentTime / audioEl.duration;
      drawWaveform(p);
      timeCurrent.textContent = formatTime(audioEl.currentTime);
    }
  }
});
// ── Mobile mini-player scrubber — seekable progress in the fixed bottom bar ──
const miniScrub = document.getElementById("miniScrub");
const miniScrubFill = document.getElementById("miniScrubFill");
function updateScrub() {
  if (!miniScrubFill) return;
  const d = audioEl.duration, t = audioEl.currentTime;
  miniScrubFill.style.width = (d > 0 && isFinite(d) ? (t / d) * 100 : 0) + "%";
}
audioEl.addEventListener("timeupdate", updateScrub);
audioEl.addEventListener("seeked", updateScrub);
audioEl.addEventListener("loadedmetadata", updateScrub);
if (miniScrub) {
  const scrubSeek = clientX => {
    const r = miniScrub.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    if (audioEl.duration && isFinite(audioEl.duration)) {
      audioEl.currentTime = ratio * audioEl.duration;
      updateScrub();
    }
  };
  miniScrub.addEventListener("pointerdown", e => {
    e.preventDefault();
    scrubSeek(e.clientX);
    const move = ev => scrubSeek(ev.clientX);
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
}

// ── Browse sheet — mobile slide-up scene/thread navigator ──
function openSheet() {
  document.body.classList.add("sheet-open");
  const f = document.getElementById("browseFab");
  if (f) f.setAttribute("aria-expanded", "true");
}
function closeSheet() {
  document.body.classList.remove("sheet-open");
  const f = document.getElementById("browseFab");
  if (f) f.setAttribute("aria-expanded", "false");
}
(() => {
  const fab = document.getElementById("browseFab");
  const backdrop = document.getElementById("sheetBackdrop");
  const close = document.getElementById("sheetClose");
  if (fab) fab.addEventListener("click", openSheet);
  if (backdrop) backdrop.addEventListener("click", closeSheet);
