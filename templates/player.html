s revolutionary martyr—his 1979 funeral drew one million Iranians"], "tier": "major", "image": "images/actors/mossadeq_mohammad.jpg", "role_tag": "PRIME MINISTER · 1951–53"}, {"actor_id": "shah_mohammad_reza", "name": "Mohammad Reza Shah Pahlavi", "aliases": ["the Shah", "Mohammad Reza Pahlavi", "the King of Kings", "Shahanshah"], "description": "The second and last Pahlavi Shah of Iran (r. 1941–1979), who pursued aggressive modernization through oil revenues, the White Revolution, and US military partnership while maintaining autocratic rule through SAVAK. His neo-patrimonial command structure deliberately cultivating inter-general rivalries, his personal paralysis after Black Friday, and his inability either to repress decisively or to share power genuinely led to the monarchy's collapse.", "narrative_functions": ["decision_maker", "constraint", "symbol"], "goals": ["Preserve Pahlavi dynasty and royal authority against all challengers", "Modernize Iran's economy and military under royal direction as legitimation strategy", "Maintain the strategic US alliance as the ultimate regime guarantee", "Suppress organized political opposition through SAVAK while projecting progressive image abroad"], "transformations": ["From insecure young monarch rescued by CIA in 1953 to autocratic megalomaniac of the Persepolis era", "From confident White Revolutionary to paralyzed, indecisive ruler after Black Friday 1978", "From sovereign Shah to exile patient dying in Egypt (1980)"], "tier": "major", "image": "images/actors/shah_mohammad_reza.jpg", "role_tag": "SHAH OF IRAN · 1941–79"}, {"actor_id": "khomeini_ruhollah", "name": "Ayatollah Ruhollah Khomeini", "aliases": ["Imam Khomeini", "Ruhollah Musavi Khomeini", "the Imam", "valiy-e amr"], "description": "Shi'i Grand Ayatollah and supreme leader of the Iranian Revolution who reformulated traditional jurisprudence into the doctrine of velayat-e faqih (guardianship of the jurist), claiming political sovereignty for qualified clerics. Exiled by the Shah in 1964 to Turkey, then Najaf (1965–1978), then Paris (1978), from where he directed the revolutionary movement and returned in February 1979 to consolidate Islamic rule, serving as Supreme Leader until his death in 1989.", "narrative_functions": ["decision_maker", "ideologue", "symbol", "catalyst"], "goals": ["Establish an Islamic government under direct clerical rule (velayat-e faqih)", "Expel foreign imperial influence and delegitimize monarchy as un-Islamic", "Consolidate the Islamic Republic against liberal, nationalist, and leftist alternatives", "Preserve ideological ambiguity during the revolutionary coalition phase to maximize breadth"], "transformations": ["From traditional Qom seminarian to political activist after Reza Shah's secularization assault", "From exile oppositional figure orchestrating the mass movement to returning revolutionary leader", "From revolution's symbol to functioning Supreme Leader of the Islamic Republic"], "tier": "major", "image": "images/actors/khomeini_ruhollah.jpg", "role_tag": "GRAND AYATOLLAH"}, {"actor_id": "roosevelt_kermit", "name": "Kermit Roosevelt Jr.", "aliases": ["Kim Roosevelt", "Kermit Roosevelt"], "description": "CIA Middle East division chief and grandson of Theodore Roosevelt who managed Operation Ajax (TPAJAX) on the ground in Tehran in August 1953, orchestrating the coup that overthrew Prime Minister Mossadeq and restored the Shah. His mission became the operational embodiment of US imperialism in Iran's political memory, the single event most cited across all subsequent Iranian political discourse to explain why the US cannot be trusted.", "narrative_functions": ["other", "catalyst"], "goals": ["Execute the Anglo-American plan to remove Mossadeq and prevent Iran from drifting toward the Soviet sphere", "Restore the Shah as a reliable US Cold War ally with secure oil access for Western companies"], "transformations": [], "tier": "minor", "image": "images/actors/roosevelt_kermit.jpg", "role_tag": "CIA OFFICER · AJAX"}]}, {"episode_number": 2, "title": "The Forty-Day Year", "arc_summary": "Open on the morning of 8 January 1978: Qom seminarians, reading yesterday's Ettela'at slur on Khomeini, pour into the streets and security forces shoot to kill. Establish the engine of the year — a Shi'i forty-day mourning custom now wired into political escalation, so each killing schedules its own commemoration forty days later. Tabriz erupts on day forty; Yazd, Isfahan, Mashhad on the next; soon the regime is dispatching tanks and helicopter gunships into provincial capitals. In August an Abadan cinema burns behind locked doors on the twenty-fifth anniversary of the 1953 coup, killing roughly four hundred working-class families and ending whatever was left of the Amuzegar government's authority. On 8 September martial-law troops fire on a stationary crowd in Jaleh Square, and the gulf becomes unbridgeable; the next morning seven hundred Tehran refinery workers walk out, and within weeks Iran's oil output collapses from six million barrels a day to one and a half. Khomeini, expelled from Najaf, settles outside Paris and discovers daily access to the world press; Sanjabi and Bazargan make the pilgrimage; the December Ashura march fills Shahyad Square with millions chanting for an Islamic Republic. The Shah, ordering martial law without 'nosebleeds,' watches his army hollow itself out through desertions; on 16 January 1979 Ettela'at runs a one-word headline — He has gone! — and on 1 February Khomeini's chartered jet lands at Mehrabad. The episode closes on 11 February as the generals declare neutrality on Tehran Radio and Doshan Tappeh's armories are emptied into the crowd.", "thematic_focus": "1978 escalation from Qom through Black Friday, the oil strike, Paris and the army's neutrality declaration", "framing": {"opening_image": "A folded copy of Ettela'at on a desk in a Qom seminary, the morning of 8 January 1978.", "threat_or_unresolved_action": "A regime-planted slur whose targets are about to walk into the streets — and into rifle fire.", "opening_question": "How does a regime with a 400,000-man army and a US presidential endorsement lose its country in a year of urban protests?", "handoff_scene_card_id": "scene_s1_a", "recap": "Last episode left a monarchy restored by foreign coup in 1953, by 1977 picking fights with the only constituencies still organized to answer it — the bazaar and the seminary — while in Najaf, Khomeini's lectures on jurists' rule kept circulating on smuggled cassettes. On the seminary desks the morning we open: the Ettela'at editorial the Shah personally signed off on.", "preview": null}, "scenes": [{"scene_id": "scene_s1_a", "title": "Ettela'at on the Seminary Desk", "scene_role": "context_setup", "scene_job": "opening", "entry_image": "A folded copy of Ettela'at on a desk in a Qom seminary.", "observable_detail": "Pencil underlines under 'black and red reactionaries.'", "beat_change": "The Shah's signed slur is now on Qom's reading desks.", "timeframe": "7-8 January 1978", "location": "Qom", "actors": [{"actor_id": "khomeini_ruhollah", "name": "Ayatollah Ruhollah Khomeini", "role_label": "exiled grand ayatollah whose name the slur was meant to bury", "presence": "background"}, {"actor_id": "shah_mohammad_reza", "name": "Mohammad Reza Shah Pahlavi", "role_label": "the king who personally signed off on the planted editorial", "presence": "background"}], "must_land_required": ["The 7 January 1978 Ettela'at editorial was planted by the Ministry of the Court under a pseudonym", "It denounces Khomeini and the clergy as 'black and red reactionaries' and accuses Khomeini of British ties and erotic verse", "By that evening seminarians are going house to house, pressing the marjas to sanction protest"], "duration_s": 150}, {"scene_id": "scene_s1_b", "title": "Bullets in the Streets of Qom", "scene_role": "shock", "scene_job": "opening", "entry_image": "Seminarians spilling out of the houses into the cold streets of Qom on 9 January.", "observable_detail": "A student from Tabriz lying on the cobblestones.", "beat_change": "The first martyrs of 1978 have set a date forty days out.", "timeframe": "9-10 January 1978", "location": "Qom", "actors": [{"actor_id": null, "name": "Ayatollah Shariatmadari", "role_label": "", "presence": "secondary"}, {"actor_id": null, "name": "An Imperial Guard conscript", "role_label": "", "presence": "secondary"}], "must_land_required": ["On 8-9 January seminarians strike, the bazaar closes, security forces shoot to kill", "Several of the dead are Azeri students from Tabriz — followers of Shariatmadari", "Shariatmadari and the Qom marjas call for the traditional chehlom commemoration in forty days"], "duration_s": 150}, {"scene_id": "scene_s2_a", "title": "A Clock the Country Never Set", "scene_role": "context_setup", "scene_job": "build", "entry_image": "A wall calendar with day forty inked over in a back room behind the bazaar.", "observable_detail": "A pencil tracing forward to mid-February.", "beat_change": "A mourning custom is now a national protest calendar.", "timeframe": "winter and spring 1978", "location": "Iran's major cities", "actors": [], "must_land_required": ["Chehlom is the Shi'i custom of gathering forty days after a death", "Each massacre now schedules the next mass mobilization forty days later, on the dot", "The cycle starts at Qom and runs city to city through 1978"], "duration_s": 170}, {"scene_id": "scene_s2_b", "title": "Mosque, Bazaar, Marja", "scene_role": "context_setup", "scene_job": "build", "entry_image": "A bazaar elder slipping an envelope of religious dues across a low table to a sayyid.", "observable_detail": "A ledger of guild contributions to the chehlom procession.", "beat_change": "The cycle has wiring already in place, paid for by the bazaar.", "timeframe": "spring 1978", "location": "Tehran bazaar", "actors": [], "must_land_required": ["Bazaar merchants pay religious dues that finance the mosques and t ntry_image": "The padlocked side exits of the Rex Cinema, photographed the morning after.", "observable_detail": "A poster for an Iranian film about the urban underclass still in the foyer glass.", "beat_change": "Four hundred working-class Iranians are dead behind sealed exits on the 1953 anniversary.", "timeframe": "19-20 August 1978", "location": "Abadan", "actors": [], "must_land_required": ["On 19 August 1978 — the twenty-fifth anniversary of the 1953 coup — the Rex Cinema in Abadan burns", "The emergency doors are padlocked from outside; the fire department arrives late", "Roughly four hundred working-class men, women and children die inside"], "duration_s": 150}, {"scene_id": "scene_s3_b", "title": "Burn the Shah", "scene_role": "reaction", "scene_job": "build", "entry_image": "Ten thousand mourners marching from the cemetery into Abadan, photographs of the dead held overhead.", "observable_detail": "A boy carrying his father's photograph at the front of the cortege.", "beat_change": "The country has rendered a political verdict the trial will not change.", "timeframe": "20 August 1978", "location": "Abadan", "actors": [], "must_land_required": ["Ten thousand mourners march from a mass burial into Abadan", "The Washington Post and Financial Times report the crowd blames SAVAK irrespective of later trial findings", "Whatever the truth about authorship, the Amuzegar government's authority collapses inside a week"], "duration_s": 170}, {"scene_id": "scene_s4_a", "title": "Brother Soldiers", "scene_role": "contestation", "scene_job": "build", "entry_image": "Shahyad Square filling at dawn on Eid al-Fitr, banners with Khomeini's portrait unfurled.", "observable_detail": "A carnation slipped down the muzzle of a rifle.", "beat_change": "The crowd has named the soldier as kin, not as instrument.", "timeframe": "4 September 1978", "location": "Shahyad Square, Tehran", "actors": [], "must_land_required": ["On 4 September Eid al-Fitr crowds in Shahyad Square chant 'bro ", "entry_image": "A foreign reporter's notebook held up against the wind at an Abadan picket line.", "observable_detail": "The worker speaking with hands still oiled from yesterday's shift.", "beat_change": "Paris and the oilfield are speaking the same sentence.", "timeframe": "late October-November 1978", "location": "Abadan", "actors": [{"actor_id": null, "name": "An Abadan refinery worker", "role_label": "", "presence": "primary"}], "must_land_required": ["An Abadan refinery worker tells reporters Iran will export oil only after exporting the Shah and his generals", "By the end of October Iran's oil output has collapsed to roughly twenty-eight percent of normal", "By early November most of the country is on strike — railways, banks, ports, refineries"], "duration_s": 160}, {"scene_id": "scene_s7_a", "title": "He Has Gone!", "scene_role": "shock", "scene_job": "turn", "entry_image": "A newsboy on a Tehran bus stop holding up the Ettela'at front page.", "observable_detail": "Passers-by cutting the Shah's face out of banknotes at the curb.", "beat_change": "The throne is empty.", "timeframe": "31 December 1977 - 16 January 1979", "location": "Tehran", "actors": [{"actor_id": "shah_mohammad_reza", "name": "Mohammad Reza Shah Pahlavi", "role_label": "", "presence": "primary"}, {"actor_id": "bakhtiar_shapur", "name": "Shapur Bakhtiar", "role_label": "National Front veteran sworn in as the Shah's last prime minister, with thirty-seven days on the desk", "presence": "secondary"}], "must_land_required": ["On 16 January 1979 the Shah leaves Tehran on a chartered Boeing 707 with a jar of Iranian soil", "Ettela'at's afternoon edition prints the one-word headline 'He has gone!'", "Thirteen months earlier, on 31 December 1977, Carter had toasted Iran as 'an island of stability'"], "duration_s": 180}, {"scene_id": "scene_s7_b", "title": "Imam Amad", "scene_role": "action", "scene_job": "build", "entry_image": "An Air France jet on the Mehrabad runway, 1 February 1979.", "observable_detail": "Bazargan stepping out of the cabin a half-step behind Khomeini.", "beat_change": "An exile is on Iranian soil, with foreign journalists as insurance and a rival PM in his pocket.", "timeframe": "1-5 February 1979", "location": "Mehrabad airport, Tehran", "actors": [{"actor_id": "khomeini_ruhollah", "name": "Ayatollah Ruhollah Khomeini", "role_label": "", "presence": "primary"}, {"actor_id": "bazargan_mehdi", "name": "Mehdi Bazargan", "role_label": "", "presence": "secondary"}], "must_land_required": ["On 1 February 1979 Khomeini's chartered Air France jet lands at Mehrabad, packed with Western journalists as a shield", "The car carrying him into Tehran goes 'dark as night' under the bodies of celebrants; a helicopter has to airlift him out", "On 5 February he names Bazargan provisional prime minister against the constitutional Bakhtiar already in office"], "duration_s": 180}, {"scene_id": "scene_s8_a", "title": "The Voice of True Iran", "scene_role": "action", "scene_job": "answer", "entry_image": "An armory door at Doshan Tappeh pulled open, rifles passed out into the street, 9 February 1979.", "observable_detail": "A young cadet handing a rifle to a man in a suit at the curb.", "beat_change": "The state has changed hands on its own radio.", "timeframe": "9-11 February 1979", "location": "Doshan Tappeh and Radio Tehran", "actors": [{"actor_id": null, "name": "An air-force cadet at Doshan Tappeh", "role_label": "", "presence": "primary"}], "must_land_required": ["On 9 February air-force cadets and technicians at Doshan Tappeh mutiny against the Imperial Guards", "Fedayin and Mojahedin raid the city weapons factory and distribute arms — Le Monde compares the area around Jaleh Square to the Paris Commune", "At 2 p.m. on 11 February 1979 Tehran Radio reads out the generals' neutrality declaration"], "duration_s": 240}, {"scene_id": "scene_s9_a", "title": "Two Prime Ministers", "scene_role": "context_setup", "scene_job": "build", "entry_image": "Two desk  recognize a Shah-appointed PM and the Shah had already made a constitutional moderate unviable through years of repression.", "narrative_functions": ["administrator", "opposition"], "goals": ["Prevent clerical takeover by demonstrating constitutional liberalization as a credible last-resort alternative", "Maintain functioning state institutions through a managed political transition", "Preserve a framework that could accommodate both religious and secular politics within constitutional order"], "transformations": ["From National Front opposition politician to the Shah's last and most consequential PM", "From PM to Paris exile and eventual assassination target of the regime he tried to prevent"], "tier": "supporting", "image": "images/actors/bakhtiar_shapur.jpg", "role_tag": "PRIME MINISTER · 1979"}, {"actor_id": "bazargan_mehdi", "name": "Mehdi Bazargan", "aliases": ["Bazargan", "Mehdi Bazargan"], "description": "French-educated engineer and devout Muslim who founded the Freedom Movement of Iran and served as the Islamic Republic's first Prime Minister (February–November 1979). He represented the liberal-nationalist strand of the revolution committed to constitutional government with Islamic values, whose Provisional Government was systematically undermined by Khomeini's Revolutionary Council and ultimately destroyed by the US Embassy hostage crisis.", "narrative_functions": ["administrator", "opposition", "victim"], "goals": ["Establish a constitutional Islamic government respectful of rule of law and international norms", "Maintain diplomatic relations and avoid rupture with the United States", "Preserve revolutionary gains without allowing theocratic monopoly to foreclose political pluralism"], "transformations": ["From opposition intellectual and Freedom Movement founder to Provisional Prime Minister", "From PM to resigned outsider within nine months of taking office", "From marginalized moderate to posthumous symbol of the revolution's lost liberal potential"], "tier": "supporting", "image": "images/actors/bazargan_mehdi.jpg", "role_tag": "PROVISIONAL PM · 1979"}, {"actor_id": "shah_mohammad_reza", "name": "Mohammad Reza Shah Pahlavi", "aliases": ["the Shah", "Mohammad Reza Pahlavi", "the King of Kings", "Shahanshah"], "description": "The second and last Pahlavi Shah of Iran (r. 1941–1979), who pursued aggressive modernization through oil revenues, the White Revolution, and US military partnership while maintaining autocratic rule through SAVAK. His neo-patrimonial command structure deliberately cultivating inter-general rivalries, his personal paralysis after Black Friday, and his inability either to repress decisively or to share power genuinely led to the monarchy's collapse.", "narrative_functions": ["decision_maker", "constraint", "symbol"], "goals": ["Preserve Pahlavi dynasty and royal authority against all challengers", "Modernize Iran's economy and military under royal direction as legitimation strategy", "Maintain the strategic US alliance as the ultimate regime guarantee", "Suppress organized political opposition through SAVAK while projecting progressive image abroad"], "transformations": ["From insecure young monarch rescued by CIA in 1953 to autocratic megalomaniac of the Persepolis era", "From confident White Revolutionary to paralyzed, indecisive ruler after Black Friday 1978", "From sovereign Shah to exile patient dying in Egypt (1980)"], "tier": "major", "image": "images/actors/shah_mohammad_reza.jpg", "role_tag": "SHAH OF IRAN · 1941–79"}, {"actor_id": "khomeini_ruhollah", "name": "Ayatollah Ruhollah Khomeini", "aliases": ["Imam Khomeini", "Ruhollah Musavi Khomeini", "the Imam", "valiy-e amr"], "description": "Shi'i Grand Ayatollah and supreme leader of the Iranian Revolution who reformulated traditional jurisprudence into the doctrine of velayat-e faqih (guardianship of the jurist), claiming political sovereignty for qualified clerics. Exiled by the Shah in 1964 to Turkey, then Najaf (1965–1978), then Paris (1978), from where he directed the revolutionary movement and returned in February 1979 to consolidate Islamic rule, serving as Supreme Leader until his death in 1989.", "narrative_functions": ["decision_maker", "ideologue", "symbol", "catalyst"], "goals": ["Establish an Islamic government under direct clerical rule (velayat-e faqih)", "Expel foreign imperial influence and delegitimize monarchy as un-Islamic", "Consolidate the Islamic Republic against liberal, nationalist, and leftist alternatives", "Preserve ideological ambiguity during the revolutionary coalition phase to maximize breadth"], "transformations": ["From traditional Qom seminarian to political activist after Reza Shah's secularization assault", "From exile oppositional figure orchestrating the mass movement to returning revolutionary leader", "From revolution's symbol to functioning Supreme Leader of the Islamic Republic"], "tier": "major", "image": "images/actors/khomeini_ruhollah.jpg", "role_tag": "GRAND AYATOLLAH"}]}, {"episode_number": 3, "title": "A Knife With Only a Handle", "arc_summary": "Open on the morning of 5 February 1979 as Khomeini installs Mehdi Bazargan as 'Ruler' under his guardianship from the holy lawgiver — and on the parallel state that already exists alongside him: a Revolutionary Council with a built-in clerical majority that Khomeini had set up secretly in Najaf in 1977, neighborhood komitehs Mahdavi-Kani is now centralizing into a parallel security force, and revolutionary courts handing down 'war against God' verdicts. In March Bazargan asks Khomeini to add the word 'Democratic' to the referendum; Khomeini refuses — Islam needs no adjectives — and 99 percent vote yes on a name with no qualifier. By July Bazargan has absorbed Mahdavi-Kani, Rafsanjani, Khamenei and Bahonar into his own cabinet because he no longer has a choice, and tells a visitor they have put a knife in his hands, but a knife with only a handle. In October he and seven ministers petition Khomeini to dissolve the Assembly of Experts, calling its draft 'a revolution against the revolution'; the petition is rebuffed and they are branded plotters. On 4 November some four hundred students of the Imam's Line scale the embassy walls, convinced they are pre-empting a second 1953; Khomeini blesses them; within forty-eight hours Bazargan has resigned and the Revolutionary Council takes direct power without a written constitution in place. Under cover of the hostage crisis the Assembly enshrines velayat-e faqih in articles 107–110, above the elected president and Majles; the constitution is ratified by plebiscite in December. In January 1980 Banisadr wins seventy-five percent of the vote with Khomeini's tacit blessing and tries to be a real president; sixteen months later Khomeini tells his supporters to go back to Europe, the Majles deposes him in June 1981, and he flees Tehran in disguise. Close the episode in Qom in April 1982, where seventeen seminary professors are prevailed upon to issue a declaration without precedent in Shi'i history — demoting Grand Ayatollah Shari'atmadari from marja'iyat — and in 1983 with the dismantling of the Tudeh Party that had supported the regime throughout. Every partner of the coalition has been discarded, and the doctrine drafted in a 1970 seminary booklet is now law.", "thematic_focus": "1979–1983 clerical absorption of the revolutionary coalition through the embassy crisis, the velayat-e faqih constitution, and the deposing of Bazargan, Banisadr and Shari'atmadari", "framing": {"opening_image": "Khomeini at a microphone on 5 February 1979, Bazargan beside him in a borrowed suit, a press conference assembled four days after the Imam's return from Paris.", "threat_or_unresolved_action": "A Revolutionary Council that Khomeini set up secretly in Najaf two years earlier is already operating in Tehran beside the cabinet Bazargan is being handed, with its own courts and its own armed men in the streets.", "opening_question": "What does it mean to be installed as prime minister by divine pronouncement, in a city where a second government is already running?", "handoff_scene_card_id": "e3_s01a_pronounce", "recap": "Last episode ended with two prime ministers in the same country — Bakhtiar by the constitution, Bazargan by Khomeini — emptied armories at Doshan Tappeh, and a coalition that had just won the country and had not yet decided who would govern it.", "preview": null}, "scenes": [{"scene_id": "e3_s01a_pronounce", "title": "Pronounce Him the Ruler", "scene_role": "action", "scene_job": "opening", "entry_image": "Khomeini at a microphone, Bazargan deferring beside him, Rafsanjani reading the program aloud.", "observable_detail": "the press conference is four days old; Bakhtiar's chair is already empty.", "beat_change": "Bazargan is installed as Ruler by divine mandate, dissent reframed as blasphemy.", "timeframe": "5 February 1979", "location": "Tehran", "actors": [{"actor_id": "khomeini_ruhollah", "name": "Ruhollah Khomeini", "role_label": "the Imam pronouncing the Ruler", "presence": "primary"}, {"actor_id": "bazargan_mehdi", "name": "Mehdi Bazargan", "role_label": "the French-educated engineer just made Ruler", "presence": "primary"}], "must_land_required": ["On 5 February 1979 Khomeini installs Bazargan as 'the Ruler' through the guardianship he holds from the holy lawgiver", "opposition to this government is reframed in advance as revolt against the shari'a, and revolt against God"], "duration_s": 180}, {"scene_id": "e3_s01b_chains", "title": "Two Chains of Command", "scene_role": "context_setup", "scene_job": "opening", "entry_image": "two offices in the same city — one with letterhead, one with a list of names slated for execution.", "observable_detail": "Mahdavi-Kani at a komiteh desk in one room, a ministerial seal lying unused in another.", "beat_change": "A clerical parallel state from 1977 is already standing beside the new cabinet on day one.", "timeframe": "February 1979", "location": " 953 — the trauma Episode 1 left open is now the operational rationale.", "timeframe": "4 to 5 November 1979", "location": "Tehran", "actors": [], "must_land_required": ["the students explicitly justify the seizure as preventing a repeat performance of the 1953 coup that returned the Shah", "the embassy compound is treated as a CIA station planning a counter-revolution"], "duration_s": 130}, {"scene_id": "e3_s05c_blessing", "title": "The Blessing", "scene_role": "action", "scene_job": "turn", "entry_image": "Khomeini at a microphone in Qom, calling the embassy a spy den.", "observable_detail": "the pasdars stand down because the Imam tells them to.", "beat_change": "Khomeini chooses not to order the diplomats freed, converting a student stunt into regime cover.", "timeframe": "early November 1979", "location": "Qom and Tehran", "actors": [{"actor_id": "khomeini_ruhollah", "name": "Ruhollah Khomeini", "role_label": "", "presence": "primary"}], "must_land_required": ["Khomeini blesses the takeover within hours and refuses to order the pasdars to free the diplomats", "the moment he refuses is the live choice that turns a sit-in into a 444-day instrument of clerical consolidation"], "duration_s": 140}, {"scene_id": "e3_s05d_resign", "title": "Bazargan Tenders His Resignation", "scene_role": "fallout", "scene_job": "turn", "entry_image": "Bazargan handing in his resignation on the morning of 6 November.", "observable_detail": "no prime minister, no provisional government, no Majles, only the Council.", "beat_change": "Executive power devolves to the clerical Revolutionary Council with no PM, no Majles, no written constitution.", "timeframe": "6 November 1979", "location": "Tehran", "actors": [{"actor_id": "bazargan_mehdi", "name": "Mehdi Bazargan", "role_label": "", "presence": "primary"}], "must_land_required": ["On the morning of 6 November 1979 Bazargan tenders his resignation, refusing to be part of a government endorsing the seizure", "executive authority devolves by // ── COLORS for avatars ──
const ACTOR_PALETTE = [
  "#8c4040", "#7a5a2b", "#4a6b5b", "#5c5a7a", "#7a4a6b",
  "#8c6940", "#5a7a4a", "#4a7080", "#704a40", "#6b507a",
  "#7a8c40", "#406b7a", "#8c5a40", "#5a4a7a", "#7a4a4a",
  "#4a7a6b", "#7a7a4a", "#8c4a5a", "#5a8c70", "#4a5a8c"
];
function colorForActor(actorId) {
  if (!actorId) return "#555";
  let h = 0;
  for (let i = 0; i < actorId.length; i++) h = (h * 31 + actorId.charCodeAt(i)) >>> 0;
  return ACTOR_PALETTE[h % ACTOR_PALETTE.length];
}
function initialsOf(name) {
  if (!name) return "?";
  const parts = name.replace(/\(.*?\)/g, "").trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 1).toUpperCase();
  // last word + first letter
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// Render an avatar (circular). Uses image if present, else colored initials.
function avatarHtml(actor, sizeRem, extraClass) {
  const ec = extraClass || "";
  const name = (actor && actor.name) || "?";
  const aid = actor && actor.actor_id;
  // Look up richer actor record (with image) if pip only has name+id
  const rich = (aid && ACTOR_BY_ID[aid]) ? ACTOR_BY_ID[aid] : actor;
  const img = rich && rich.image;
  const sizeCss = sizeRem ? `width:${sizeRem}rem;height:${sizeRem}rem;` : "";
  if (img) {
    return `<span class="avatar img ${ec}" title="${escapeHtml(name)}" style="${sizeCss}background-image:url('${img}')"></span>`;
  }
  const color = colorForActor(aid || name);
  return `<span class="avatar initials ${ec}" title="${escapeHtml(name)}" style="${sizeCss}background:${color}">${initialsOf(name)}</span>`;
}

// ── FOCUS (minimize) ──
// One progressive player: the companion is always present. "Focus" minimizes to
// an audio-only view (hides the detail pane + content rail; keeps the timeline).
// Internally still toggles mode-follow / mode-listen so existing CSS keeps working.
function setFocus(on) {
  document.body.classList.toggle("mode-listen", on);
  document.body.classList.toggle("mode-follow", !on);
  const btn = document.getElementById("focusToggle");
  if (btn) { btn.classList.toggle("active", on); btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  localStorage.setItem("pa-focus", on ? "1" : "0");
  // Layout changed — the timeline SVG re-measures, and (entering Focus) the
  // waveform canvas was 0-width while hidden, so repaint it now that it's shown.
  requestAnimationFrame(() => {
    buildTimeline();
    if (on) {
      const p = (audioEl.duration && isFinite(audioEl.duration)) ? audioEl.currentTime / audioEl.duration : 0;
      drawWaveform(p);
    }
  });
}
document.getElementById("focusToggle").addEventListener("click", () => {
  setFocus(!document.body.classList.contains("mode-listen"));
});

// ── WAVEFORM ──
function seededRandom(seed) {
  let s = seed;
  return function () {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function generateBars(epNum, count) {
  const rng = seededRandom(epNum * 7919 + 137);
  const bars = [];
  for (let i = 0; i < count; i++) {
    const pos = i / count;
    const wave = 0.35 + 0.25 * Math.sin(pos * Math.PI * 2.5) + 0.15 * Math.sin(pos * Math.PI * 7.3);
    const noise = rng() * 0.4;
    bars.push(Math.min(1, Math.max(0.08, wave + noise - 0.15)));
  }
  return bars;
}
function drawWaveform(progress) {
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = "";                 // release any prior 0-width pin so CSS (width:100%) governs
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  if (!w) return;                          // hidden (e.g. default reading mode) — nothing to paint
  const h = rect.height || 120;
  canvas.width = w * dpr;                  // (re)sizing the backing store also resets the 2D transform
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const barWidth = 3, gap = 1, step = barWidth + gap;
  const barCount = Math.floor(w / step);
  if (waveformBars.length !== barCount) {
    waveformBars = generateBars(SERIES.episodes[currentEpIdx].episode_number, barCount);
  }
  const playedBars = Math.floor(progress * barCount);
  const midY = h / 2;
  for (let i = 0; i < barCount; i++) {
    const barH = waveformBars[i] * (h * 0.85);
    const x = i * step;
    const y = midY - barH / 2;
    ctx.fillStyle = i < playedBars ? "rgba(160,64,64,0.8)" : "rgba(160,64,64,0.25)";
    ctx.fillRect(x, y, barWidth, barH);
  }
  if (progress > 0) {
    const px = progress * w;
    ctx.strokeStyle = "#a04040";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, 8); ctx.lineTo(px, h - 8); ctx.stroke();
    ctx.beginPath(); ctx.arc(px, 8, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#a04040"; ctx.fill();
  }
}
function formatTime(sec) {
  if (isNaN(sec) || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

// ── EPISODE LOAD ──
function loadEpisode(idx, autoplay) {
  currentEpIdx = idx;
  // Loading an episode shifts the listener's context to that episode —
  // auto-rezoom the strip to the episode's chronological range so its
  // primitives get the full canvas. User can still click "← Series" to
  // return to series scope.
  stripScope = "episode";
  const ep = SERIES.episodes[idx];
  imageEpNum.textContent = ep.episode_number;
  episodeImage.src = IMAGE_BY_EP[ep.episode_number] || "images/iran-2.jpg";
  timeCurrent.textContent = "0:00:00";
  timeTotal.textContent = "—";

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const barCount = Math.floor(rect.width / 4);
  waveformBars = generateBars(ep.episode_number, barCount);
  drawWaveform(0);

  // Audio
  const audioUrl = AUDIO_BY_EP[ep.episode_number];
  audioEl.innerHTML = "";
  audioEl.removeAttribute("src");
  if (audioUrl) {
    const src = document.createElement("source");
    src.src = audioUrl; src.type = "audio/mpeg";
    audioEl.appendChild(src);
  }
  audioEl.load();
  audioEl.playbackRate = speedOptions[speedIndex];
  const hasAudio = Boolean(audioUrl);
  btnPlay.disabled = !hasAudio;
  btnBack30.disabled = !hasAudio;
  btnFwd30.disabled = !hasAudio;
  btnSpeed.disabled = !hasAudio;
  waveformWrap.classList.toggle("disabled", !hasAudio);

  buildScenesGallery(ep);
  buildThreadsPanel(ep);
  setLeftTab("scenes");
  // Clear any open detail when switching episode, then re-render the
  // episode-level empty state. The episodes rail itself stays mounted.
  currentScene = null; currentActor = null; currentSection = null; currentDebate = null;
  followSceneId = null; followLock = true; sceneScale = 1;
  recomputeSceneScale();
  buildTimeline();   // scene ticks + active-band highlight follow currentEpIdx
  renderRightPane();

  if (autoplay && hasAudio) {
    audioEl.play().then(() => setPlaying(true)).catch(() => {});
  } else {
    setPlaying(false);
  }
}

function setPlaying(p) {
  isPlaying = p;
  iconPlay.style.display = p ? "none" : "block";
  iconPause.style.display = p ? "block" : "none";
  if (p) startAnimation(); else stopAnimation();
  updateFollowChip();
}
function startAnimation() {
  if (animFrameId) return;
  (function tick() {
    const progress = audioEl.duration ? audioEl.currentTime / audioEl.duration : 0;
    drawWaveform(progress);
    timeCurrent.textContent = formatTime(audioEl.currentTime);
    updateSceneFollow(audioEl.currentTime);
    animFrameId = requestAnimationFrame(tick);
  })();
}

// Normalize estimated scene offsets to the measured audio length so the live
// scene stays accurate (estimates can sum short/long). Bounded, proportional.
function recomputeSceneScale() {
  const ep = SERIES.episodes[currentEpIdx];
  const offsets = ep.scene_offsets || [];
  const est = offsets.length ? offsets[offsets.length - 1].end_s : 0;
  sceneScale = (est > 0 && isFinite(audioEl.duration) && audioEl.duration > 0)
    ? audioEl.duration / est : 1;
}

// The follow-lock: while locked, the detail pane teleprompts the live scene.
// Any manual navigation unlocks it (the pane stays where you put it); the
// "Resume following" chip re-arms it. Play/pause/seek never change the lock.
function unlockFollow() {
  if (!followLock) return;
  followLock = false;
  updateFollowChip();
}
function rearmFollow() {
  followLock = true;
  updateFollowChip();
  if (followSceneId) { expandSectionForScene(followSceneId); renderFollowScene(followSceneId); }
}
function updateFollowChip() {
  const chip = document.getElementById("followChip");
  if (!chip) return;
  chip.hidden = !isPlaying;
  if (!isPlaying) return;
  chip.classList.toggle("paused", !followLock);
  chip.innerHTML = followLock
    ? `<span class="follow-dot"></span>Following audio`
    : `&#9654;&nbsp; Resume following`;
}
// Teleprompter render: advance the detail pane to the live scene WITHOUT routing
// through renderRightPane (which scrolls to top); cross-fade instead of hard-cut.
function renderFollowScene(sid) {
  const ep = SERIES.episodes[currentEpIdx];
  if (!ep.scenes.find(s => s.scene_id === sid)) return;
  currentScene = sid; currentActor = null; currentSection = null; currentDebate = null;
  detailPane.innerHTML = renderSceneSpread(ep);
  detailPane.classList.add("just-followed");
  wireDetailPane();
  updatePlaylistActive(); updateTimelineActive(); highlightActive();
  requestAnimationFrame(() => detailPane.classList.remove("just-followed"));
}

// Track the scene under the playback cursor: highlight its card, expand its act,
// drive the within-scene hairline, and (when following) teleprompt the pane.
function updateSceneFollow(t) {
  const ep = SERIES.episodes[currentEpIdx];
  const offsets = ep.scene_offsets || [];
  if (!offsets.length || !isFinite(t)) return;
  const cur = offsets.find(o => t >= o.start_s * sceneScale && t < o.end_s * sceneScale);
  const sid = cur ? cur.scene_id : null;
  if (cur) {
    const a = cur.start_s * sceneScale, b = cur.end_s * sceneScale;
    const pct = b > a ? Math.max(0, Math.min(1, (t - a) / (b - a))) : 0;
    const playingCard = scenesGallery.querySelector(".scene-card.is-playing");
    if (playingCard) playingCard.style.setProperty("--sp", (pct * 100).toFixed(1) + "%");
  }
  if (sid === followSceneId) return;
  followSceneId = sid;
  document.querySelectorAll(".scene-card").forEach(c => {
    c.classList.toggle("is-playing", c.dataset.sceneId === sid);
  });
  if (sid) {
    expandSectionForScene(sid);
    if (leftTab === "scenes") {
      const card = scenesGallery.querySelector('.scene-card[data-scene-id="' + sid + '"]');
      if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    if (followLock) renderFollowScene(sid);
  }
}
function stopAnimation() {
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  const progress = audioEl.duration ? audioEl.currentTime / audioEl.duration : 0;
  drawWaveform(progress);
  timeCurrent.textContent = formatTime(audioEl.currentTime);
}

// Short role summary for an actor — prefer narrative_function, fall back to first sentence
// Role tag for cast cards / actor detail. Reads pre-computed role_tag from the
// build-time aggregation; falls back to narrative_functions[0] uppercased.
function roleTagOf(actor) {
  if (actor.role_tag) return actor.role_tag;
  if (actor.narrative_functions && actor.narrative_functions.length) {
    return String(actor.narrative_functions[0] || "").replace(/_/g, " ").toUpperCase();
  }
  return "";
}

// Extract a four-digit year from timeframe strings like "early August 1953".
function yearFrom(timeframe) {
  if (!timeframe) return "";
  const m = String(timeframe).match(/\b(1[89]\d{2}|20\d{2})\b/);
  return m ? m[1] : "";
}

// Uppercase city for scene tag. Reuses shortLocation() for trimming.
function cityTag(loc) {
  const short = shortLocation(loc);
  return short ? short.toUpperCase() : "";
}

function sceneCardEl(sc, globalIdx) {
