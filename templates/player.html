<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060708">
<meta name="color-scheme" content="dark">
<title><!--__SERIES_TITLE__-->The Iranian Revolution<!--__SERIES_TITLE_END__--> — Follow mode</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #060708;
  --bg-2: rgba(10,11,13,0.65);
  --text: #e8dcc8;
  --text-dim: rgba(232,220,200,0.55);
  --text-faint: rgba(232,220,200,0.32);
  --accent: #a04040;
  --accent-bright: #c45050;
  --accent-dim: rgba(160,64,64,0.3);
  --accent-glow: rgba(160,64,64,0.12);
  --hairline: rgba(255,255,255,0.06);
  --font: "Avenir Next", "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  /* ── Design system tokens (one disciplined scale, used by all components) ── */
  /* Display serif — the editorial voice. */
  --d1: 3.2rem;   --d2: 2.1rem;   --d3: 1.6rem;
  --d4: 1.3rem;   --d5: 1.08rem;  --d6: 0.92rem;
  /* UI / label — Avenir, uppercase, tracked. */
  --u1: 0.72rem;  --u2: 0.65rem;  --u3: 0.6rem;
  --u4: 0.55rem;  --u5: 0.5rem;
  /* Tracking ladder — smaller size wants wider tracking. */
  --track-d: -0.02em;  --track-u1: 0.18em; --track-u2: 0.16em;
  --track-u3: 0.14em;  --track-u4: 0.12em;
  /* Spacing — 4px base. */
  --s1: 0.25rem; --s2: 0.45rem; --s3: 0.7rem; --s4: 0.9rem;
  --s5: 1.2rem;  --s6: 1.6rem;  --s7: 2.4rem; --s8: 3.5rem;
  /* Motion. */
  --ease: cubic-bezier(0.2, 0.6, 0.2, 1);
  --t-micro: 0.15s; --t-card: 0.22s; --t-panel: 0.3s; --t-layout: 0.35s;
  /* The shared "same family" left accent rule. */
  --rule: 2px solid var(--accent-dim);
}

/* ── Shared card frame — the single "this is one system" signature ── */
.card-frame {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--hairline);
  border-left: var(--rule);
  border-radius: 2px;
  transition: transform var(--t-card) var(--ease),
              border-left-color var(--t-card) var(--ease),
              background var(--t-card) var(--ease);
}
.card-frame:hover {
  transform: translateY(-2px);
  border-left-color: var(--accent-bright);
  background: rgba(160,64,64,0.05);
}
.card-frame.active { border-left-color: var(--accent-bright); background: rgba(160,64,64,0.07); }

/* ── Accessibility: visible keyboard focus + reduced-motion guard ── */
:where(.scene-card,.excerpt-scene,.idea-card,.left-tab,.ep-chip,.scene-ref-chip,
       .scene-section-head,.detail-cast-chip,.follow-chip,button,a):focus-visible {
  outline: 2px solid var(--accent-bright);
  outline-offset: 2px;
  border-radius: 2px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── HEADER ── */
.site-header {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  background: rgba(6,7,8,0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hairline);
  position: relative;
  z-index: 100;
  gap: 1rem;
}
.site-header .brand-cluster { display: flex; align-items: center; gap: 0.9rem; flex-shrink: 0; }
.site-header .brand {
  font-size: 0.75rem;
  font-variant: small-caps;
  letter-spacing: 0.08em;
  color: var(--text);
  opacity: 0.5;
  text-decoration: none;
  transition: opacity 0.3s;
}
.site-header .brand:hover { opacity: 0.85; }
.site-header .proto-badge {
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.18rem 0.45rem;
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  border-radius: 2px;
  opacity: 0.75;
}
.site-header .series-title {
  font-size: 1rem;
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text);
  opacity: 0.8;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  pointer-events: none;
}

/* Mode toggle */
.mode-toggle {
  display: inline-flex;
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 2px;
  flex-shrink: 0;
}
.mode-toggle button {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 0.4rem 0.9rem;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.mode-toggle button:hover { color: var(--text); }
.mode-toggle button.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 12px rgba(160,64,64,0.35);
}

/* ── SPLIT PANEL ── */
/* Right pane gets ~40% more width (55% → 77%) so the timeline strip + editorial
   detail have room. Left pane at 35% gives the cover image + transport +
   scenes gallery comfortable room on viewports ≥1440px. */
.split-container {
  display: grid;
  grid-template-columns: 32% 68%;
  height: calc(100vh - 60px);
}

/* ── LEFT PANEL ── */
.left-panel {
  background: var(--bg);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(160,64,64,0.25) transparent;
}
.left-panel::-webkit-scrollbar { width: 6px; }
.left-panel::-webkit-scrollbar-track { background: transparent; }
.left-panel::-webkit-scrollbar-thumb { background: rgba(160,64,64,0.25); border-radius: 3px; }

/* Episode image — streamlined (compact by default; the companion is always on).
   Grows only in Focus (audio-only) mode where there's room. */
.episode-image-block {
  position: relative;
  width: 100%;
  height: 180px;
  min-height: 180px;
  flex-shrink: 0;
  overflow: hidden;
  transition: min-height var(--t-layout) var(--ease), height var(--t-layout) var(--ease);
}
body.mode-listen .episode-image-block {
  height: 40%;
  min-height: 240px;
}
.episode-image-block img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: grayscale(0.6) contrast(1.1);
  display: block;
}
.episode-image-block::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(160,64,64,0.15), rgba(6,7,8,0.55));
  pointer-events: none;
}
.episode-image-block::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.12;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 128px 128px;
}
.image-ep-number {
  position: absolute;
  top: 1.2rem;
  left: 1.5rem;
  font-size: 3rem;
  font-weight: 200;
  color: rgba(232,220,200,0.3);
  z-index: 3;
  line-height: 1;
}

/* Waveform */
.waveform-section {
  padding: 1.5rem 1.5rem 0.5rem;
  flex-shrink: 0;
}
.waveform-label {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.5;
  margin-bottom: 0.75rem;
}
.waveform-canvas-wrap { position: relative; width: 100%; cursor: pointer; }
.waveform-canvas-wrap canvas { display: block; width: 100%; height: 120px; }
.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  opacity: 0.45;
  margin-top: 0.5rem;
  padding: 0 2px;
}

/* Transport */
.transport {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  padding: 1rem 1.5rem;
  flex-shrink: 0;
}
.transport button {
  background: transparent;
  border: none;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.transport button:hover { color: #fff; }
.transport button:active { transform: scale(0.93); }
.btn-skip {
  width: 2.5rem; height: 2.5rem;
  border-radius: 50%;
  border: 1.5px solid var(--accent-dim) !important;
  font-size: 0.7rem; font-weight: 500;
  font-family: var(--font);
  letter-spacing: -0.02em;
  color: var(--accent) !important;
  opacity: 0.8;
}
.btn-skip:hover { opacity: 1 !important; border-color: var(--accent) !important; }
.btn-play {
  width: 4.5rem; height: 4.5rem;
  border-radius: 50%;
  border: 2px solid var(--accent) !important;
  position: relative;
}
.btn-play svg { width: 1.8rem; height: 1.8rem; fill: var(--accent); }
.btn-play:hover { border-color: var(--accent-bright) !important; background: rgba(160,64,64,0.08); }
.btn-play:hover svg { fill: var(--accent-bright); }
.btn-speed {
  padding: 0.35rem 0.75rem;
  border-radius: 1rem;
  border: 1.5px solid var(--accent-dim) !important;
  font-size: 0.75rem; font-weight: 500;
  font-family: var(--font);
  color: var(--accent) !important;
  opacity: 0.8;
  min-width: 2.8rem;
  text-align: center;
}
.btn-speed:hover { opacity: 1 !important; border-color: var(--accent) !important; }

/* ── Content rail — present by default; hidden only in Focus (mode-listen) ── */
.follow-only { display: block; }

.rail-section {
  padding: 0.8rem 0 1.6rem;
  border-top: 1px solid var(--hairline);
  margin: 0.4rem 1.5rem 0;
}
.rail-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 0.3rem 0 0.9rem;
}
.rail-header .label {
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.65;
  font-weight: 600;
}
.rail-header .hint {
  font-size: 0.68rem;
  letter-spacing: 0.03em;
  color: var(--text-faint);
  font-style: italic;
}

/* ── Shared avatar ── */
.avatar {
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--text);
  flex-shrink: 0;
  overflow: hidden;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  filter: grayscale(0.3) contrast(1.05);
  position: relative;
}
.avatar.img {
  background-color: #1a1414;
}
.avatar.img::after {
  /* subtle inner ring */
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  pointer-events: none;
}
.avatar.initials { background-color: #555; }

/* Scene row — editorial list inside an act. A typographic row
   (numeral · title + cinematic entry image · duration) with hairline
   dividers; no image plates. Hooks (.scene-card / data-scene-id) preserved. */
.scene-card {
  width: 100%;
  cursor: pointer;
  position: relative;
  display: flex;
  align-items: baseline;
  gap: var(--s3);
  padding: var(--s3) var(--s2) var(--s3) var(--s3);
  border-bottom: 1px solid var(--hairline);
  transition: background var(--t-micro) var(--ease);
}
.scene-section-cards .scene-card:last-child { border-bottom: none; }
.scene-card:hover { background: rgba(160,64,64,0.05); }
.scene-card:hover .scene-row-title { color: var(--accent); }
.scene-card.active { background: rgba(160,64,64,0.07); }
.scene-card.active .scene-row-title { color: var(--accent); }

/* Functional micro-type (numeral + duration) — borrows the timeline's clean
   tracked sans + tabular numerals; these numerals map 1:1 to the timeline
   scene-ticks, so they share its treatment. */
.scene-row-num {
  flex: 0 0 auto;
  font-family: var(--font);
  font-weight: 500;
  font-size: 0.72rem;
  line-height: 1.7;
  letter-spacing: 0.04em;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.scene-row-body { flex: 1 1 auto; min-width: 0; }
/* Editorial serif title — refined weight/tracking for crispness at this size. */
.scene-row-title {
  font-family: var(--font);
  font-weight: 500;
  font-size: var(--d6);
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--text);
  transition: color var(--t-micro) var(--ease);
}
/* Cinematic entry_image — italic serif, two lines max. */
.scene-row-image {
  font-family: var(--font);
  font-style: italic;
  font-size: 0.8rem;
  line-height: 1.45;
  color: var(--text-dim);
  margin-top: 0.22rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.scene-row-dur {
  flex: 0 0 auto;
  font-family: var(--font);
  font-size: var(--u4);
  line-height: 1.9;
  letter-spacing: 0.04em;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

/* ── RIGHT PANEL ── */
.right-panel {
  background: var(--bg-2);
  border-left: 1px solid rgba(160,64,64,0.15);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(160,64,64,0.2) transparent;
}
.right-panel::-webkit-scrollbar { width: 6px; }
.right-panel::-webkit-scrollbar-track { background: transparent; }
.right-panel::-webkit-scrollbar-thumb { background: rgba(160,64,64,0.2); border-radius: 3px; }

.panel-body { flex: 1; overflow-y: auto; }

/* Frozen header wrapper — pins both the chips rail AND the named-landmark
   timeline strip to the top of the right panel's scroll context. Without
   this wrapper only the chips rail stuck and listeners lost their year-axis
   orientation as soon as they scrolled into the landing. */
.timeline-frozen {
  position: sticky;
  top: 0;
  z-index: 5;
  flex: 0 0 auto;
  background: var(--bg-2);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* Episodes rail — always-visible horizontal chip strip across the top
   of the right pane. Replaces the old vertical playlist. flex-shrink: 0
   keeps it from collapsing in the right-panel flex column. */
.episodes-rail {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 0.45rem;
  padding: 0.95rem 1.5rem;
  border-bottom: 1px solid var(--hairline);
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg-2);
}
.episodes-rail::-webkit-scrollbar { display: none; }
.ep-chip {
  /* button reset — pick up theme color/font instead of browser defaults */
  appearance: none;
  -webkit-appearance: none;
  color: var(--text);
  font-family: inherit;
  font-size: 0.78rem;
  text-align: left;
  margin: 0;
  line-height: 1.3;
  /* layout */
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.55rem 1rem;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease;
  background: transparent;
  white-space: nowrap;
  box-sizing: border-box;
}
.ep-chip:hover { border-color: var(--accent-dim); }
.ep-chip.is-active {
  border-color: var(--accent);
  background: rgba(160,64,64,0.09);
}
.ep-chip .ep-num {
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 300;
  color: var(--accent);
  opacity: 0.55;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.ep-chip .ep-title {
  font-size: 0.78rem;
  font-weight: 500;
  opacity: 0.65;
  max-width: 14rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ep-chip.is-active .ep-num,
.ep-chip.is-active .ep-title { opacity: 1; }
/* Meta line ("20 scenes · 9 actors") is Listen-mode only. Hidden in Follow. */
.ep-chip .ep-meta { display: none; }

/* ── Focus (minimize) ──
   The companion (timeline + rail + detail) is the default. "Focus" hides the
   editorial detail pane and the left content rail for an audio-only view,
   keeping the player chrome, the episode chips, and the timeline spine. */
body.mode-listen .detail-pane { display: none; }
body.mode-listen .follow-only { display: none; }

/* ── Timeline orientation strip ──
   Four elements stacked between rail and detail:
     1. Named landmarks (top events) with stem + label + year
     2. Scene ticks for the active episode
     3. Linear year axis
     4. Episode bands at the bottom (chronological extent of each ep)
   Plus a real-time playback cursor anchored to audio currentTime. */
.timeline-strip {
  flex: 0 0 auto;
  height: 225px;
  border-bottom: 1px solid var(--hairline);
  background: rgba(0,0,0,0.18);
  padding: 0.4rem 1.5rem 0.3rem;
  position: relative;
}
.timeline-strip.is-empty { display: none; }
.timeline-svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

/* — Axis — */
.timeline-axis { stroke: var(--hairline); stroke-width: 1; }
.timeline-tick { stroke: var(--hairline); stroke-width: 1; }
.timeline-axis-break {
  stroke: var(--accent);
  stroke-width: 1.2;
  opacity: 0.55;
}
.timeline-break-label {
  font-family: var(--font);
  font-size: 8px;
  fill: var(--accent);
  opacity: 0.7;
  letter-spacing: 0.05em;
  font-style: italic;
  pointer-events: none;
}
.timeline-year {
  font-family: var(--font);
  font-size: 9px;
  fill: var(--text);
  opacity: 0.4;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
}

/* — Named landmarks — */
.timeline-landmark {
  font-family: var(--font);
  font-size: 9px;
  font-weight: 600;
  fill: var(--text);
  opacity: 0.4;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s, fill 0.2s;
}
.timeline-landmark.is-in-active-ep { opacity: 1; fill: var(--accent-bright); }
.timeline-landmark:hover { fill: var(--accent-bright); opacity: 1; }
.timeline-landmark-year {
  font-family: var(--font);
  font-size: 8px;
  font-weight: 500;
  fill: var(--accent);
  opacity: 0.7;
  letter-spacing: 0.10em;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.timeline-stem {
  stroke: var(--accent);
  stroke-width: 1;
  opacity: 0.25;
  transition: opacity 0.2s, stroke 0.2s;
}
.timeline-stem.is-in-active-ep { stroke: var(--accent-bright); opacity: 0.9; }
.timeline-stem.is-active { stroke: var(--accent-bright); opacity: 1; }

/* — Scene ticks (active episode) — */
.timeline-tick-scene {
  stroke: var(--text);
  stroke-width: 1;
  opacity: 0.28;
  cursor: pointer;
  transition: opacity 0.15s, stroke 0.15s;
}
.timeline-tick-scene:hover { opacity: 1; stroke: var(--accent-bright); }
.timeline-tick-scene.is-active { opacity: 1; stroke: var(--accent-bright); stroke-width: 1.5; }

/* — Acts (diamond markers above the axis) — */
.timeline-act {
  fill: var(--text);
  opacity: 0.45;
  cursor: pointer;
  transition: opacity 0.2s, fill 0.2s;
}
.timeline-act.is-in-active-ep { fill: var(--accent-bright); opacity: 1; }
.timeline-act:hover { fill: var(--accent-bright); opacity: 1; }

/* — Acts in the landmark label pool — softer than events so the visual
   hierarchy reads as "events first, acts as supporting context". Lighter
   weight, slightly dimmer fill, no uppercase letter-spacing punch. */
.timeline-landmark.is-act {
  font-weight: 400;
  fill: var(--text-dim);
  letter-spacing: 0.10em;
}
.timeline-landmark.is-act.is-in-active-ep { fill: var(--text); opacity: 0.85; }
.timeline-landmark.is-act:hover { fill: var(--accent-bright); opacity: 1; }
.timeline-stem.is-act { opacity: 0.15; }
.timeline-stem.is-act.is-in-active-ep { opacity: 0.55; }

/* — Contested primitives — disputed events/acts the listener can open to see
   the competing readings. The ⚖ glyph leads the label; a dotted accent
   underline marks it as a "more here" affordance. Contested act diamonds
   render hollow (accent ring) to stand out from settled acts. */
.timeline-landmark.is-contested,
.timeline-act-lane-label.is-contested {
  fill: var(--accent);
  text-decoration: underline dotted var(--accent);
  text-underline-offset: 2px;
}
.timeline-landmark.is-contested.is-in-active-ep,
.timeline-act-lane-label.is-contested.is-in-active-ep { fill: var(--accent-bright); }
.timeline-act.is-contested {
  fill: var(--bg);
  stroke: var(--accent-bright);
  stroke-width: 1.3;
  opacity: 1;
}

/* — V1 ONLY — Act lane (labels below the beats row) — */
.timeline-act-lane-label {
  font-family: var(--font);
  font-size: 8px;
  font-weight: 500;
  fill: var(--text);
  opacity: 0.75;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s, fill 0.15s;
}
.timeline-act-lane-label:hover { fill: var(--accent-bright); opacity: 1; }
.timeline-act-lane-stem {
  stroke: var(--text);
  stroke-width: 1;
  opacity: 0.18;
  stroke-dasharray: 1 2;
}

/* — Active-episode backdrop — single subtle wash spanning the active ep's
   chronological range. Replaces the v2 multi-row episode-band stripe stack. */
.timeline-ep-backdrop {
  fill: var(--accent);
  opacity: 0.10;
  rx: 2;
  pointer-events: none;
}
.timeline-ep-backdrop-label {
  font-family: var(--font);
  font-size: 8px;
  font-weight: 600;
  fill: var(--accent);
  opacity: 0.75;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  pointer-events: none;
}

/* — Scene titles inline below the year axis (episode scope only) — */
.timeline-scene-title {
  font-family: var(--font);
  font-size: 8px;
  font-weight: 500;
  fill: var(--text);
  opacity: 0.55;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: opacity 0.15s, fill 0.15s;
}
.timeline-scene-title:hover { opacity: 1; fill: var(--accent-bright); }

/* — Strip scope chip (← Series) — anchored bottom-right of the strip so it
   doesn't collide with leftmost or rightmost landmark labels at either scope. */
.strip-scope-chip {
  position: absolute;
  bottom: 0.4rem;
  right: 1.5rem;
  z-index: 2;
  appearance: none;
  background: rgba(0,0,0,0.65);
  border: 1px solid var(--hairline);
  color: var(--text);
  font-family: inherit;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 10px;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.15s, border-color 0.15s, color 0.15s;
}
.strip-scope-chip:hover { opacity: 1; border-color: var(--accent); color: var(--accent-bright); }
.strip-scope-chip[hidden] { display: none; }

/* — Playback cursor (real-time) — */
.timeline-cursor-playback {
  stroke: var(--accent-bright);
  stroke-width: 1.5;
  opacity: 0.95;
}
.timeline-cursor-head {
  fill: var(--accent-bright);
  pointer-events: none;
}

/* ── Detail pane — editorial / archival-magazine composition ──
   Eyebrow → big serif headline (with short accent rule) → metadata strip →
   hero scene plate (entry_image as a title card) → body with drop cap → cast row.
   Always rendered; an episode-level empty state when no scene/actor picked. */
.detail-wrap { position: relative; }
.detail-pane {
  padding: 1.8rem 2rem 2.2rem;
  position: relative;
  transition: opacity var(--t-panel) var(--ease);
}
/* Teleprompter cross-fade: the new spread fades up rather than hard-cutting. */
.detail-pane.just-followed { opacity: 0; transition: none; }

/* "Following audio / Resume following" status chip (top-right of the pane). */
.follow-chip {
  position: absolute;
  top: var(--s4);
  right: var(--s5);
  z-index: 20;
  appearance: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  font-family: var(--font);
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text-dim);
  background: rgba(6,7,8,0.72);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 0.4rem 0.8rem;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: color var(--t-micro) var(--ease), border-color var(--t-micro) var(--ease);
}
.follow-chip:hover { border-color: var(--accent-dim); color: var(--text); }
.follow-chip.paused { color: var(--accent); border-color: var(--accent-dim); }
.follow-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-bright);
  animation: follow-pulse 2.4s ease-in-out infinite;
}
@keyframes follow-pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
.detail-spread {
  max-width: 38rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1.4rem;
}

.detail-eyebrow {
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  line-height: 1.35;
}

/* Big serif headline — anchors the spread. Short accent rule sits underneath. */
.detail-headline {
  font-family: var(--font);
  font-size: 3.2rem;
  font-weight: 500;
  line-height: 1.02;
  letter-spacing: -0.02em;
  color: var(--text);
  margin: 0;
  max-width: 28rem;
}
.detail-headline::after {
  content: "";
  display: block;
  width: 2.5rem;
  height: 2px;
  background: var(--accent);
  margin-top: 1rem;
}

/* Scene metadata strip — Scene N · 1:32 · ROLE · JOB */
.detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
  align-items: baseline;
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.55;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.detail-meta .dot { opacity: 0.4; }

/* Hero scene plate — entry_image rendered as a title card at editorial scale.
   Radial gradient + grain + duotone vocabulary; the scene detail's centerpiece. */
.detail-plate {
  width: 100%;
  aspect-ratio: 16 / 9;
  background-color: #100a0a;
  background-image: radial-gradient(ellipse at 38% 35%, rgba(160,64,64,0.22), transparent 70%);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.4rem 2.6rem;
  border: 1px solid var(--hairline);
  border-left: 2px solid var(--accent-dim);
  border-radius: 2px;
}
.detail-plate::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(160,64,64,0.12), rgba(6,7,8,0.4));
  opacity: 0.15;
  pointer-events: none;
}
.detail-plate::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.14;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 128px 128px;
}
.detail-plate-anchor {
  font-family: var(--font);
  font-style: italic;
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.55;
  text-align: center;
  color: var(--text);
  opacity: 0.88;
  letter-spacing: 0.005em;
  max-width: 32rem;
  position: relative;
  z-index: 3;
}

/* Prose body — comfortable reading measure, drop cap on first letter */
.detail-body {
  font-family: var(--font);
  font-size: 1.08rem;
  font-weight: 400;
  line-height: 1.85;
  color: var(--text);
  opacity: 0.9;
  max-width: 33rem;
}
.detail-body p + p { margin-top: 1.1rem; }
.detail-body p:first-of-type::first-letter {
  font-family: var(--font);
  font-weight: 500;
  float: left;
  font-size: 3.4rem;
  line-height: 0.9;
  padding: 0.35rem 0.55rem 0 0;
  color: var(--accent);
}

/* Cast row — actor chips along the bottom of the spread */
.detail-cast {
  border-top: 1px solid var(--hairline);
  padding-top: 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}
.detail-cast-label {
  font-size: 0.65rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.45;
  font-weight: 600;
}
.detail-cast-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem 1.3rem;
}
.detail-cast-chip {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  cursor: pointer;
  opacity: 0.82;
  transition: opacity 0.2s ease;
}
.detail-cast-chip:hover { opacity: 1; }
.detail-cast-chip .avatar {
  width: 2.2rem;
  height: 2.2rem;
  font-size: 0.78rem;
  border: 1px solid rgba(0,0,0,0.35);
}
.detail-cast-chip .chip-name {
  font-family: var(--font);
  font-size: 0.92rem;
  color: var(--text);
  letter-spacing: -0.005em;
}
.detail-cast-chip .chip-role {
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.7;
  font-weight: 600;
  margin-top: 0.15rem;
}
.detail-cast-chip-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Actor-detail portrait + masthead (kept for actor view) */
.detail-masthead {
  display: flex;
  gap: 1.8rem;
  align-items: flex-start;
}
.detail-portrait {
  flex: 0 0 auto;
  width: 11rem;
  aspect-ratio: 4 / 5;
  background-color: #1a1414;
  background-position: center top;
  background-size: cover;
  background-repeat: no-repeat;
  filter: grayscale(0.55) contrast(1.08);
  position: relative;
  overflow: hidden;
  border: 1px solid var(--hairline);
  border-left: 2px solid var(--accent-dim);
  border-radius: 2px;
}
.detail-portrait::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(160,64,64,0.1), rgba(6,7,8,0.4));
  opacity: 0.15;
  pointer-events: none;
}
.detail-portrait::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 128px 128px;
}
.detail-portrait.initials {
  background-image: radial-gradient(ellipse at 30% 30%, rgba(160,64,64,0.18), transparent 65%);
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-portrait .monogram {
  font-family: var(--font);
  font-size: 4.5rem;
  font-weight: 200;
  color: var(--text);
  opacity: 0.4;
  letter-spacing: -0.02em;
  position: relative;
  z-index: 3;
}
.detail-masthead-text {
  flex: 1;
  min-width: 0;
  padding-top: 0.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

/* Episode-level empty state hint */
.detail-hint {
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.4;
  font-weight: 500;
  margin-top: 0.6rem;
}

/* ── Tabbed left rail (Scenes / Cast / Voices / Threads) ── */
.left-tabs {
  display: flex;
  gap: 0.2rem;
  margin: 0.2rem 0 1.2rem;
  border-bottom: 1px solid var(--hairline);
}
.left-tab {
  appearance: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.5rem 0.1rem;
  margin-right: 1.1rem;
  font-family: var(--font);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text-faint);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.2s ease, border-color 0.2s ease;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}
.left-tab:last-child { margin-right: 0; }
.left-tab:hover { color: var(--text-dim); }
.left-tab.is-active { color: var(--accent); border-bottom-color: var(--accent); }
.left-tab-count {
  font-size: 0.58rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.left-tab.is-active .left-tab-count { color: var(--accent); opacity: 0.75; }
.left-tab-panel { display: none; }
.left-tab-panel.is-active { display: block; animation: panel-in var(--t-panel) var(--ease); }
@keyframes panel-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.detail-spread { animation: spread-in var(--t-panel) var(--ease); }
@keyframes spread-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── Scenes grouped by architecture section (vertical) ── */
.scenes-grouped { display: flex; flex-direction: column; gap: var(--s4); }
.scene-section-group { display: flex; flex-direction: column; }
.scene-section-head {
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: var(--s2);
  border-left: var(--rule);
  padding: var(--s2) 0 var(--s2) var(--s3);
  transition: border-color var(--t-micro) var(--ease);
}
.scene-section-head:hover { border-left-color: var(--accent-bright); }
.scene-section-head:hover .scene-section-headline { color: var(--accent); }
.scene-section-head.active { border-left-color: var(--accent-bright); }
.scene-section-head.active .scene-section-headline { color: var(--accent); }
.scene-section-chevron {
  flex: 0 0 auto;
  color: var(--accent);
  opacity: 0.7;
  font-size: 1rem;
  line-height: 1.4;
  transition: transform var(--t-layout) var(--ease);
}
.scene-section-group:not(.collapsed) .scene-section-chevron { transform: rotate(90deg); }
.scene-section-headwrap {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
/* Eyebrow: NN · (tag, if distinctive) · ~N min · N scenes, dot-separated. */
.scene-section-eyebrow {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem;
  line-height: 1;
}
.scene-section-dot { color: var(--text-faint); opacity: 0.5; font-size: var(--u4); }
.scene-section-purpose {
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  font-weight: 600;
  color: var(--accent);
  opacity: 0.9;
}
.scene-section-count {
  font-size: var(--u4);
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.scene-section-runtime {
  font-size: var(--u4);
  font-style: italic;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
/* Headline — the act's short summarized title; the primary top line.
   Timeline-style clean sans (Title Case), matching the timeline labels. */
.scene-section-headline {
  font-family: var(--font);
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.3;
  letter-spacing: 0.008em;
  color: var(--text);
  transition: color var(--t-micro) var(--ease);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.scene-section-view {
  appearance: none;
  background: none;
  border: none;
  cursor: pointer;
  flex: 0 0 auto;
  font-family: var(--font);
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text-faint);
  padding: 0.2rem 0.3rem;
  white-space: nowrap;
  transition: color var(--t-micro) var(--ease);
}
.scene-section-view:hover { color: var(--accent); }
/* Cast pane — a compact cluster (label · overlapping avatars · last names) at
   the top of the dropdown, above the scene list. Hidden when the act has no
   actors, and HIDDEN WHEN COLLAPSED: the avatars carry a filter, and WebKit
   paints filtered descendants outside an ancestor's overflow:hidden, so they'd
   otherwise leak past the collapsed accordion. */
.scene-section-group.collapsed .scene-act-cast { display: none; }
.scene-act-cast {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: 0 var(--s2) var(--s3) var(--s3);
  border-bottom: 1px solid var(--hairline);
}
.scene-act-cast-label {
  flex: 0 0 auto;
  font-family: var(--font);
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text-faint);
}
.scene-act-cast-avatars { display: flex; align-items: center; flex: 0 0 auto; }
.scene-act-cast-av {
  appearance: none;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  display: inline-flex;
  border-radius: 50%;
  transition: transform var(--t-micro) var(--ease);
}
.scene-act-cast-av + .scene-act-cast-av { margin-left: -0.5rem; }
.scene-act-cast-av .avatar { box-shadow: 0 0 0 2px var(--bg); }
.scene-act-cast-av:hover { z-index: 2; transform: translateY(-1px); }
.scene-act-cast-av:hover .avatar { filter: none; }
.scene-act-cast-more {
  margin-left: 0.35rem;
  font-family: var(--font);
  font-size: var(--u3);
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.scene-act-cast-names {
  min-width: 0;
  font-family: var(--font);
  font-size: var(--u2);
  letter-spacing: 0.01em;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Accordion body — animates open/closed via grid-template-rows. */
.scene-section-body {
  display: grid;
  grid-template-rows: 1fr;
  overflow: hidden;
  transition: grid-template-rows var(--t-layout) var(--ease);
}
.scene-section-group.collapsed .scene-section-body { grid-template-rows: 0fr; }
.scene-section-body-inner {
  overflow: hidden;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  padding: var(--s3) 0 var(--s2);
}
.scene-section-cards { display: flex; flex-direction: column; gap: 0; }
/* Scene under the playback cursor — a within-scene progress hairline runs
   along the bottom; the numeral and title pick up the accent. */
.scene-card.is-playing { background: rgba(160,64,64,0.08); }
.scene-card.is-playing .scene-row-num,
.scene-card.is-playing .scene-row-title { color: var(--accent); }
.scene-card.is-playing::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0; height: 2px;
  width: var(--sp, 0%);
  background: var(--accent-bright);
  opacity: 0.85;
  transition: width 0.25s linear;
  z-index: 5;
}

.panel-empty {
  font-size: var(--u3);
  letter-spacing: var(--track-u3);
  text-transform: uppercase;
  color: var(--text-faint);
  font-style: italic;
  padding: var(--s4) 0;
}

/* ── Voices panel — speaker-grouped dossier ──
   The 14 quotes collapse into ~5 named voices. Each group: a Cast-linked
   header (duotone face + name + role + count) over quotes that hang on a
   left accent spine, each tagged TYPE · YEAR · audience with a scene link. */
/* ── Excerpt rows — reusable quote primitive used inside cast accordions
   and the actor page. One row per excerpt: TYPE · YEAR · audience meta + the
   verbatim quote + a light scene link. The Voices tab was retired; the cast
   accordion plays that role now. */
.excerpt-list {
  display: flex; flex-direction: column; gap: var(--s5);
  border-left: var(--rule);
  padding-left: var(--s4);
}
.excerpt-row { display: flex; flex-direction: column; }
.excerpt-meta {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2);
  font-size: var(--u4); letter-spacing: var(--track-u4); text-transform: uppercase;
  color: var(--text-dim); line-height: 1.4;
}
.excerpt-meta .vtype { color: var(--accent); font-weight: 600; }
.excerpt-quote {
  font-family: var(--font);
  font-style: normal;
  font-weight: 430;
  font-optical-sizing: auto;
  font-size: 1rem;
  line-height: 1.55;
  color: var(--text);
  margin-top: var(--s2);
  text-rendering: optimizeLegibility;
}
.excerpt-foot { margin-top: var(--s2); }
/* Light scene link — tracked sans label + accent arrow. */
.excerpt-scene {
  display: inline-flex; align-items: center; gap: 0.3rem;
  font-family: var(--font);
  font-size: var(--u4); letter-spacing: var(--track-u4); text-transform: uppercase;
  color: var(--text-faint); cursor: pointer;
  transition: color var(--t-micro) var(--ease);
}
.excerpt-scene:hover { color: var(--accent); }
.excerpt-scene .arr { color: var(--accent); opacity: 0.75; }

/* ── Threads & Ideas panel — numbered dossier entries ── */
.threads-panel { display: flex; flex-direction: column; gap: var(--s6); }
.idea-card { position: relative; border-left: var(--rule); padding-left: var(--s4); }
.idea-num {
  font-family: var(--font); font-weight: 300; font-size: 1.6rem;
  color: var(--text-faint); font-variant-numeric: tabular-nums; line-height: 1;
  float: left; margin: 0.1rem var(--s3) 0 0;
}
.idea-kind {
  font-size: var(--u4); letter-spacing: var(--track-u4); text-transform: uppercase;
  color: var(--accent); opacity: 0.8; font-weight: 600;
}
.idea-title { font-family: var(--font); font-size: var(--d5); color: var(--text); line-height: 1.3; margin-top: 0.1rem; }
.idea-summary { margin-top: var(--s2); font-size: 0.8rem; color: var(--text-dim); line-height: 1.45; }
.idea-refs { margin-top: var(--s3); display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.idea-refs .arrow { color: var(--accent); opacity: 0.6; }

/* ── Section "act" detail + new editorial scene-detail blocks ── */
.detail-standfirst {
  font-family: var(--font);
  font-style: italic;
  font-size: 1.3rem;
  line-height: 1.5;
  color: var(--text-dim);
  max-width: 33rem;
}
.detail-sensory {
  font-family: var(--font);
  font-style: italic;
  font-size: 1.08rem;
  line-height: 1.6;
  color: var(--text-dim);
  max-width: 33rem;
}
.detail-sensory .heard {
  display: block;
  margin-top: 0.4rem;
  font-size: 0.92rem;
  color: var(--text-faint);
}
.detail-quote {
  margin: 0;
  border-left: 2px solid var(--accent);
  padding: 0.2rem 0 0.3rem 1.4rem;
  max-width: 34rem;
}
.detail-quote blockquote {
  margin: 0;
  font-family: var(--font);
  font-size: 1.4rem;
  line-height: 1.5;
  color: var(--text);
  font-weight: 400;
}
.detail-quote figcaption {
  margin-top: 0.75rem;
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.detail-quote figcaption.has-actor { cursor: pointer; }
.detail-quote figcaption.has-actor:hover .speaker { color: var(--accent-bright); }
.detail-quote figcaption .speaker { color: var(--accent); font-weight: 600; }

/* — Contested-history debate spread (renderDebateSpread) — two competing
   readings of a disputed event/act, each with its supporting and undercutting
   evidence. */
.debate-lede {
  font-family: var(--font);
  font-style: italic;
  color: var(--text-dim);
  font-size: 1.05rem;
  line-height: 1.45;
  margin: 0.1rem 0 1.1rem;
}
.debate-readings { display: flex; flex-direction: column; gap: var(--s4); }
.debate-reading {
  display: flex;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  background: var(--bg-2);
  max-width: 36rem;
}
.debate-reading-num {
  flex: none;
  width: 1.55rem; height: 1.55rem;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 0.78rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.debate-reading-body { display: flex; flex-direction: column; gap: var(--s3); }
.debate-reading-claim {
  font-family: var(--font);
  color: var(--text);
  font-size: 1.05rem;
  line-height: 1.4;
  font-weight: 500;
}
.debate-evidence {
  font-size: 0.9rem;
  line-height: 1.45;
  color: var(--text-dim);
  padding-left: var(--s3);
  border-left: 2px solid var(--hairline);
}
.debate-evidence-label {
  display: inline-block;
  font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-right: var(--s2);
  opacity: 0.85;
}
.debate-evidence.is-for { border-left-color: rgba(120,165,120,0.55); }
.debate-evidence.is-for .debate-evidence-label { color: #7fa67f; }
.debate-evidence.is-against { border-left-color: var(--accent-dim); }
.debate-evidence.is-against .debate-evidence-label { color: var(--accent); }

/* Inline cross-link rows (scene → act, scene → idea) + rest-state blocks */
.detail-inline-ref { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.idea-inline { display: flex; flex-direction: column; gap: 0.1rem; }
.idea-inline .idea-title { font-family: var(--font); font-size: var(--d6); color: var(--text); }
.rest-block { display: flex; flex-direction: column; gap: var(--s3); }
.scene-ref-chip.act-ref { font-variant-numeric: tabular-nums; }
.detail-turn { font-size: 0.95rem; color: var(--text-dim); line-height: 1.55; }
.detail-turn .turn-label {
  display: inline-block;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-right: 0.55rem;
}
.detail-label {
  font-size: 0.65rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.45;
  font-weight: 600;
}
.detail-sound { font-family: var(--font); font-style: italic; font-size: 1rem; color: var(--text-faint); line-height: 1.5; }
.detail-section-block { display: flex; flex-direction: column; gap: 0.6rem; }
.scene-ref-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.scene-ref-chip {
  cursor: pointer;
  font-size: 0.72rem;
  padding: 0.35rem 0.7rem;
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  color: var(--text-dim);
  font-family: var(--font);
  transition: border-color 0.2s ease, color 0.2s ease;
}
.scene-ref-chip:hover { border-color: var(--accent); color: var(--accent); }

/* ── Actor detail: this-episode arc + functions/goals/transformations ── */
/* ── Character page ── masthead stat line, series zone, framed episode zone ── */
.actor-statline {
  font-size: var(--u3);
  letter-spacing: var(--track-u3);
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 600;
}
.detail-label.accent { color: var(--accent); opacity: 0.85; }
.actor-gloss { font-family: var(--font); font-style: italic; font-size: var(--d4); line-height: 1.5; color: var(--text-dim); }
.actor-series { display: flex; flex-direction: column; gap: var(--s5); }
.actor-episode {
  display: flex;
  flex-direction: column;
  gap: var(--s5);
  margin-top: var(--s4);
  padding: var(--s6);
  background: var(--bg-2);
  border: 1px solid var(--hairline);
  border-left: var(--rule);
  border-radius: 2px;
}
.actor-sub { display: flex; flex-direction: column; gap: var(--s3); }
.actor-arc-thread { display: flex; flex-direction: column; gap: var(--s3); }
.actor-arc-title { font-family: var(--font); font-size: var(--d4); color: var(--accent); font-style: italic; }
.arc-steps { display: flex; flex-direction: column; gap: var(--s3); }
.arc-step { display: flex; gap: var(--s4); line-height: 1.45; }
.arc-step-key {
  flex: 0 0 5.4rem;
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  padding-top: 0.25rem;
}
.arc-step-val { font-family: var(--font); font-size: var(--d5); color: var(--text-dim); }
/* Connected vertical stepper (≥3 beats) — spine + nodes, terminal node filled. */
.arc-stepper { position: relative; padding-left: 1.5rem; }
.arc-stepper::before {
  content: ""; position: absolute; left: 0.3rem; top: 0.45rem; bottom: 0.45rem; width: 1px;
  background: linear-gradient(to bottom, var(--accent-dim), var(--accent-dim) 90%, transparent);
}
.arc-stepper .arc-step { position: relative; }
.arc-stepper .arc-step::before {
  content: ""; position: absolute; left: -1.5rem; top: 0.4rem;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg); border: 1.5px solid var(--accent-dim);
  box-shadow: 0 0 0 3px var(--bg);
}
.arc-stepper .arc-step.arc-last::before { background: var(--accent); border-color: var(--accent); }
.actor-functions { display: flex; flex-wrap: wrap; gap: var(--s2); }
.actor-function-chip {
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  padding: 0.2rem 0.5rem;
  font-weight: 600;
}
.actor-listing { display: flex; flex-direction: column; gap: var(--s2); margin: 0; padding: 0; }
.actor-listing li {
  font-family: var(--font);
  font-size: var(--d6);
  color: var(--text-dim);
  line-height: 1.45;
  list-style: none;
  padding-left: 1rem;
  position: relative;
}
.actor-listing li::before { content: "—"; position: absolute; left: 0; color: var(--accent); opacity: 0.6; }
.ep-ref-chip {
  cursor: pointer;
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  font-weight: 600;
  padding: 0.3rem 0.55rem;
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  transition: border-color var(--t-micro) var(--ease), color var(--t-micro) var(--ease);
}
.ep-ref-chip:hover { border-color: var(--accent); color: var(--accent); }

/* ── Episode landing pane ── two-column layout: narrative center + sticky
   cast sidebar on the right. The center column is a vertical sequence of
   blocks (hero arc-stepper, forward questions, key terms with per-term
   expand). The hero title is the page's anchor — large cream serif, NOT
   italic, NOT accent — so cast names (small-caps sans accent) never
   compete with it. */
.episode-landing {
  display: grid;
  grid-template-columns: minmax(0, 35rem) 1fr 18.4rem;
  gap: 2rem;
  align-items: start;
  max-width: none;
  margin: 0;
}

.landing-narrative {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  min-width: 0;
}

/* Hero — number + title on one baseline, lead question, then bulleted
   forward questions. No eyebrow, no accent rule under the title — the dim
   leading number replaces both. */
.landing-hero { display: flex; flex-direction: column; gap: 1.1rem; }
.landing-hero-numtitle {
  display: flex;
  align-items: baseline;
  gap: 1.2rem;
  flex-wrap: wrap;
}
.landing-hero-num {
  font-family: var(--font);
  font-size: 3rem;
  font-weight: 200;
  line-height: 1;
  color: rgba(232,220,200,0.3);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}
.landing-hero-title {
  font-family: var(--font);
  font-size: 2rem;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: var(--text);
  margin: 0;
  max-width: 26rem;
}
/* Lead question — the listener_problem framing the episode. Prominent, not
   italic, sits on its own block beneath the title. */
.landing-hero-lead-question {
  margin: 0.2rem 0 0;
  font-family: var(--font);
  font-size: 1.2rem;
  font-weight: 500;
  line-height: 1.45;
  letter-spacing: -0.005em;
  color: var(--text);
  max-width: 30rem;
}
/* Sub-questions — the unresolved questions, bulleted, dim. Thin dot marker. */
.landing-hero-subquestions {
  list-style: none;
  margin: 0.7rem 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.landing-hero-subquestions li {
  position: relative;
  padding-left: 1.1rem;
  font-family: var(--font);
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--text-dim);
  max-width: 30rem;
}
.landing-hero-subquestions li::before {
  content: "•";
  position: absolute;
  left: 0.1rem;
  top: 0;
  color: var(--text-faint);
  line-height: 1.5;
}

/* Generic block — hairline top rule + section label + body. Used by the
   key-terms block (the forward-questions block was collapsed into the hero). */
.landing-block {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  padding-top: 1.3rem;
  border-top: 1px solid var(--hairline);
}
.landing-block-label {
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.45;
  font-weight: 600;
}

/* Key terms — native <details> rows, default collapsed. */
.landing-terms { display: flex; flex-direction: column; }
.landing-term {
  border-top: 1px solid var(--hairline);
  padding: 0.7rem 0;
}
.landing-term:first-child { border-top: 0; padding-top: 0; }
.landing-term summary {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.8rem;
  cursor: pointer;
  list-style: none;
  outline: none;
  transition: color 0.15s ease;
}
.landing-term summary::-webkit-details-marker { display: none; }
.landing-term .term-label {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}
.landing-term:hover .term-label { color: var(--accent-bright); }
.landing-term .term-chev {
  font-family: var(--font);
  font-size: 0.65rem;
  color: var(--text-faint);
  transition: transform 0.2s ease, color 0.15s ease;
  transform: rotate(180deg);  /* point down when closed */
  display: inline-block;
}
.landing-term[open] .term-chev { transform: rotate(0deg); color: var(--accent); }
.landing-term .term-gloss {
  font-family: var(--font);
  font-style: italic;
  font-size: 0.95rem;
  line-height: 1.55;
  color: var(--text-dim);
  padding-top: 0.5rem;
  margin: 0;
  max-width: 30rem;
}

/* Cast sidebar — right column, sticky beneath the frozen timeline header.
   --timeline-frozen-h is set at runtime via ResizeObserver on #timelineFrozen;
   the hardcoded value is a sensible fallback (~60px chips rail + 225px strip). */
.landing-cast-rail {
  grid-column: 3;
  position: sticky;
  top: calc(var(--timeline-frozen-h, 285px) + 1rem);
  max-height: calc(100vh - var(--timeline-frozen-h, 285px) - 2rem);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  scrollbar-width: thin;
  scrollbar-color: rgba(160,64,64,0.2) transparent;
}
.landing-cast-rail::-webkit-scrollbar { width: 4px; }
.landing-cast-rail::-webkit-scrollbar-track { background: transparent; }
.landing-cast-rail::-webkit-scrollbar-thumb { background: rgba(160,64,64,0.2); border-radius: 2px; }
.landing-cast-label {
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.45;
  font-weight: 600;
  margin-bottom: 0.6rem;
}
.landing-cast-row {
  display: grid;
  grid-template-columns: 2.4rem 1fr;
  gap: 0.75rem;
  align-items: start;
  padding: 1.1rem 0;
  border-top: 1px solid var(--hairline);
  cursor: pointer;
  transition: opacity 0.2s ease;
}
.landing-cast-row:first-of-type { border-top: 0; padding-top: 0.4rem; }
.landing-cast-row:hover { opacity: 0.82; }
.landing-cast-row:hover .landing-cast-name { color: var(--accent-bright); }
.landing-cast-avatar {
  grid-row: 1 / -1;
  width: 2.4rem;
  height: 2.4rem;
  font-size: 0.78rem;
}
.landing-cast-text {
  display: flex;
  flex-direction: column;
  gap: 0.28rem;
  min-width: 0;
}
.landing-cast-name {
  font-size: var(--u3);
  letter-spacing: var(--track-u3);
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  line-height: 1.25;
}
.landing-cast-role {
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.landing-cast-premise {
  font-family: var(--font);
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text-faint);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 0.1rem;
}
/* Accordion body — hidden by default; toggled open via .is-open on the row.
   Contains the arc-thread one-liner, excerpt list, and the actor-page link. */
.landing-cast-body {
  grid-column: 2;
  display: none;
  flex-direction: column;
  gap: 0.85rem;
  padding: 0.6rem 0 0.4rem;
}
.landing-cast-row.is-open .landing-cast-body { display: flex; }
.landing-cast-row.is-open .landing-cast-premise {
  -webkit-line-clamp: unset;
  display: block;
  overflow: visible;
}
.landing-cast-row.is-open .landing-cast-name { color: var(--accent-bright); }
.landing-cast-body .excerpt-list { gap: var(--s4); padding-left: var(--s3); }
.landing-cast-body .excerpt-quote { font-size: 0.92rem; line-height: 1.45; }
.landing-cast-body .excerpt-meta { font-size: var(--u5); }
.landing-cast-empty {
  font-size: 0.78rem;
  color: var(--text-faint);
  font-style: italic;
}
.landing-cast-arclabel {
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  line-height: 1.35;
}
.landing-cast-actorlink {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  align-self: flex-start;
  margin-top: 0.2rem;
  font-family: var(--font);
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0.2rem 0;
}
.landing-cast-actorlink:hover { color: var(--accent-bright); }
.landing-cast-actorlink .arr { opacity: 0.85; }

/* At narrow viewports the sidebar folds underneath the narrative column. */
/* Mobile-only chrome (scrubber, sheet header, Browse trigger) — hidden on
   desktop; the ≤768px query below switches them on. */
.mini-scrub, .sheet-head, .browse-fab { display: none; }

@media (max-width: 1080px) {
  .episode-landing { grid-template-columns: minmax(0, 1fr); gap: 2.2rem; }
  .landing-cast-rail {
    grid-column: auto;
    position: static;
    max-height: none;
    overflow: visible;
    border-top: 1px solid var(--hairline);
    padding-top: 1.4rem;
  }
}

/* Mobile */
.mobile-playlist-toggle { display: none; }
@media (max-width: 768px) {
  /* ── Mobile = a reading-first, single-surface player ───────────────────────
     Desktop is a fixed two-pane app shell (overflow:hidden, 100vh, nested
     scrollers). On a phone that trapped everything in the first screen. Here:
       • release the scroll lock → one scrolling document
       • DEFAULT view is reading-first: the editorial detail (current scene) is
         the page; cover + waveform belong to Focus mode, not the default
       • the player is a fixed bottom mini-bar with a real seekable scrubber
       • the scene/thread navigator lives in a slide-up Browse sheet
     Everything here is mobile-scoped; desktop is untouched. */
  html, body { overflow: visible; height: auto; }
  body { padding-bottom: 5rem; }                     /* clear the fixed mini-player */

  .site-header { padding: 0 0.8rem; }
  .site-header .series-title { display: none; }

  .split-container { display: flex; flex-direction: column; height: auto; min-height: 0; }
  .left-panel  { display: contents; }                /* dissolve so pieces reflow/reorder */
  .right-panel { display: flex; flex-direction: column; overflow: visible; border: none; order: 1; }
  .panel-body  { overflow: visible; flex: none; }

  /* Default reading mode hides the cover + fake waveform (they return in Focus). */
  .episode-image-block { display: none; }
  .waveform-section    { display: none; }
  .actor-rail { order: 0; }                          /* actor mode: rail above the spread */
  .timeline-frozen { position: static; }
  .timeline-strip  { display: none; }                /* dense 38-yr SVG axis overlaps at phone width */
  .episodes-rail   { padding: 0.55rem 0.9rem; }      /* slim episode switcher at the top */

  /* Reading surface (the page) */
  .detail-pane { padding: 1.4rem 1.4rem 2rem; }
  .detail-spread { max-width: 100%; gap: 1.1rem; }
  .detail-portrait { width: 9rem; }
  .detail-headline { font-size: 2.1rem; max-width: 100%; }
  .detail-plate { aspect-ratio: 4 / 3; padding: 1.6rem 1.4rem; }
  .detail-plate-anchor { font-size: 1.1rem; }
  .detail-body { font-size: 1rem; }
  .detail-body p:first-of-type::first-letter { font-size: 2.8rem; }

  /* ── Fixed bottom mini-player + seekable scrubber ── */
  .transport {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(6,7,8,0.96);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--hairline);
    padding: 0.85rem 1rem 0.7rem;
  }
  .btn-play { width: 3.1rem; height: 3.1rem; }
  .btn-play svg { width: 1.2rem; height: 1.2rem; }
  .btn-speed { min-height: 44px; }
  .btn-skip  { width: 44px; height: 44px; }
  .mode-toggle button { min-height: 38px; }
  .mini-scrub {
    display: block; position: absolute; top: -7px; left: 0; right: 0;
    height: 16px; cursor: pointer; touch-action: none;
  }
  .mini-scrub::before {                              /* track */
    content: ""; position: absolute; top: 7px; left: 0; right: 0; height: 3px;
    background: var(--hairline);
  }
  .mini-scrub-fill {                                 /* progress */
    position: absolute; top: 7px; left: 0; height: 3px; width: 0%;
    background: var(--accent-bright); box-shadow: 0 0 8px var(--accent-glow);
  }

  /* ── Browse sheet (the navigator: Scenes / Threads) ── */
  /* Browse trigger lives in the empty left gutter of the centered mini-player
     row — within the player zone (already cleared by body padding), so it never
     covers reading content. */
  .browse-fab {
    display: inline-flex; align-items: center; gap: 0.35rem;
    position: fixed; left: 0.7rem;
    bottom: calc(1.15rem + env(safe-area-inset-bottom, 0px)); z-index: 55;
    padding: 0.5rem 0.7rem; border-radius: 999px;
    background: rgba(40,28,28,0.92); color: var(--text-dim);
    border: 1px solid var(--accent-dim);
    font: 600 0.6rem/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase;
    min-height: 44px;
  }
  .browse-fab svg { opacity: 0.85; }

  .rail-section.follow-only {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    max-height: 82vh; display: flex; flex-direction: column;
    background: var(--bg); border-top: 1px solid var(--accent-dim);
    border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    transform: translateY(101%); transition: transform 0.32s var(--ease);
    overflow: hidden;
  }
  body.sheet-open .rail-section.follow-only { transform: translateY(0); }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 1rem 0.5rem; position: relative; flex: none;
  }
  .sheet-grip {
    position: absolute; top: 0.45rem; left: 50%; transform: translateX(-50%);
    width: 2.2rem; height: 4px; border-radius: 2px; background: var(--hairline);
  }
  .sheet-title { font: 600 0.65rem/1 var(--font); letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); }
  .sheet-close { background: none; border: none; color: var(--accent-bright); font: 600 0.85rem var(--font); cursor: pointer; padding: 0.3rem 0.2rem; min-height: 40px; }
  .left-tabs { flex: none; }
  .rail-section.follow-only .left-tab-panel { padding: 0 0.4rem 1.5rem; }
  .left-tab-panel.is-active { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .left-tab { min-height: 44px; }

  .sheet-backdrop { display: none; position: fixed; inset: 0; z-index: 58; background: rgba(0,0,0,0.55); }
  body.sheet-open .sheet-backdrop { display: block; }
  body.sheet-open { overflow: hidden; }

  /* ── FOCUS MODE = immersive now-playing (cover + waveform return) ── */
  body.mode-listen .split-container { justify-content: center; min-height: calc(100vh - 60px); gap: 0.6rem; }
  body.mode-listen .episode-image-block {
    display: block; order: 0; flex: none;
    height: 38vh; min-height: 200px; max-height: 360px;
    margin: 0 1rem; border-radius: 6px; overflow: hidden;
  }
  body.mode-listen .waveform-section { display: block; order: 1; flex: none; padding: 0.4rem 1.4rem 0; }
  body.mode-listen .waveform-canvas-wrap canvas { height: 84px; }
  body.mode-listen .mini-scrub { display: none; }    /* the waveform is the scrubber here */
  body.mode-listen .browse-fab { display: none; }
  body.mode-listen .episodes-rail { display: none; }

  /* ── ACTOR MODE ── */
  body.mode-actor .browse-fab { display: none; }
  body.mode-actor .episodes-rail { display: none; }   /* episode chips are noise in an actor view */
}

/* ── ACTOR PAGE ──────────────────────────────────────────────────────────
   Triggered by hash route #/actor/<id>?ep=<n>. body.mode-actor swaps the
   left rail contents (episode image/waveform/transport/tabs → actor
   portrait/info/mode toggle) and the right pane swaps to actor-spread.
   Header chrome (brand + series title) stays. */

/* Hide episode UI when in actor mode; show the actor rail. */
body:not(.mode-actor) .actor-rail { display: none !important; }
body.mode-actor .episode-image-block,
body.mode-actor .waveform-section,
body.mode-actor .transport,
body.mode-actor .rail-section.follow-only { display: none !important; }

.actor-rail {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  padding: 1.5rem 1.5rem 1.2rem;
}
.actor-rail-portrait {
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 18rem;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  background-color: #1a1414;
  filter: grayscale(0.4) contrast(1.05);
  position: relative;
  align-self: center;
  max-width: 14rem;
}
.actor-rail-portrait.initials::after {
  content: attr(data-initials);
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  font-weight: 300;
  color: rgba(232,220,200,0.6);
  letter-spacing: -0.02em;
  background: radial-gradient(ellipse at 32% 28%, rgba(160,64,64,0.30), #221a1a);
  border-radius: 50%;
}
.actor-rail-portrait.initials { background: transparent; }
.actor-rail-id { display: flex; flex-direction: column; gap: 0.4rem; }
.actor-rail-name {
  font-family: var(--font);
  font-size: 1.3rem;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.015em;
  color: var(--text);
}
.actor-rail-aliases {
  font-size: 0.78rem;
  line-height: 1.4;
  color: var(--text-faint);
  font-style: italic;
}
.actor-rail-aliases:empty { display: none; }
.actor-rail-meta {
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  line-height: 1.5;
}
.actor-mode-toggle {
  display: flex;
  gap: 0;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 0.18rem;
  align-self: stretch;
}
.actor-mode-pill {
  flex: 1;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0.45rem 0.6rem;
  font-family: var(--font);
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text-faint);
  border-radius: 999px;
  transition: background var(--t-micro), color var(--t-micro);
}
.actor-mode-pill:hover { color: var(--text-dim); }
.actor-mode-pill.is-active {
  background: rgba(160,64,64,0.12);
  color: var(--accent);
}
.actor-rail-context {
  font-size: 0.78rem;
  line-height: 1.45;
  color: var(--text-dim);
  border-top: 1px solid var(--hairline);
  padding-top: 1rem;
}
.actor-rail-context:empty { display: none; padding: 0; border: 0; }
.actor-rail-backlink {
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.4rem 0;
  font-family: var(--font);
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text-faint);
  text-align: left;
  transition: color var(--t-micro);
}
.actor-rail-backlink:hover { color: var(--accent); }

/* Right pane — actor spread. Same .detail-pane container, different content. */
.actor-spread { display: flex; flex-direction: column; gap: 1.6rem; }
.actor-spread-eyebrow {
  font-size: var(--u3);
  letter-spacing: var(--track-u3);
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  line-height: 1.35;
}
.actor-spread-headline {
  font-family: var(--font);
  font-size: 2.4rem;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--text);
  margin: 0;
}
.actor-spread-gloss {
  margin: 0;
  font-family: var(--font);
  font-size: 1.1rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--text-dim);
  max-width: 38rem;
}
.actor-spread-bio {
  font-size: 1rem;
  line-height: 1.65;
  color: var(--text);
  max-width: 40rem;
}
.actor-block {
  padding-top: 1.2rem;
  border-top: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}
.actor-block-label {
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.55;
  font-weight: 600;
}
.actor-block-sub {
  font-size: 0.78rem;
  color: var(--text-faint);
}

/* Arc thread block (episode mode) */
.actor-arc-title {
  font-family: var(--font);
  font-size: 1.15rem;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--text);
  line-height: 1.3;
}
.actor-arc-steps {
  display: grid;
  grid-template-columns: minmax(5rem, auto) 1fr;
  column-gap: 1.2rem;
  row-gap: 0.55rem;
  border-left: var(--rule);
  padding: 0.3rem 0 0.3rem 1rem;
}
.actor-arc-key {
  font-size: var(--u4);
  letter-spacing: var(--track-u4);
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  line-height: 1.5;
}
.actor-arc-val {
  font-family: var(--font);
  font-size: 0.98rem;
  line-height: 1.5;
  color: var(--text);
}

/* Scenes-they-appear-in list (episode mode) */
.actor-scene-list { display: flex; flex-direction: column; }
.actor-scene-row {
  display: grid;
  grid-template-columns: 2.5rem 1fr auto;
  gap: 0.9rem;
  align-items: baseline;
  padding: 0.7rem 0.2rem;
  border-top: 1px solid var(--hairline);
  cursor: pointer;
  text-align: left;
  background: none;
  border-left: none;
  border-right: none;
  border-bottom: none;
  width: 100%;
  transition: background var(--t-micro);
}
.actor-scene-row:hover { background: rgba(160,64,64,0.05); }
.actor-scene-row:hover .actor-scene-title { color: var(--accent); }
.actor-scene-row:first-child { border-top: none; }
.actor-scene-num {
  font-family: var(--font);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.actor-scene-title {
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
  letter-spacing: -0.005em;
}
.actor-scene-tag {
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  white-space: nowrap;
}
.actor-scene-tag.primary { color: var(--accent); }

/* Relationships list — one row per typed edge. Used in both episode mode
   (filtered to edges activated this episode) and series mode (all touching
   edges, grouped under the graph). Layout: direction glyph · lowercase verb
   · target name · confidence chip; reason paragraph on a second line under
   the row, aligned to the verb column. */
.actor-rel-list { display: flex; flex-direction: column; }
.actor-rel-row {
  display: grid;
  grid-template-columns: 1.2rem auto 1fr auto;
  grid-template-rows: auto auto;
  align-items: baseline;
  column-gap: 0.7rem;
  row-gap: 0.4rem;
  padding: 0.95rem 0;
  border-top: 1px solid var(--hairline);
}
.actor-rel-row:first-child { border-top: none; padding-top: 0.4rem; }
.actor-rel-row:last-child { padding-bottom: 0.2rem; }
.actor-rel-dir {
  grid-row: 1;
  font-family: var(--font);
  font-size: 0.95rem;
  color: var(--accent);
  opacity: 0.75;
  font-weight: 500;
  line-height: 1;
  text-align: center;
}
.actor-rel-verb {
  grid-row: 1;
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.005em;
  color: var(--accent);
  white-space: nowrap;
}
.actor-rel-target {
  grid-row: 1;
  font-family: var(--font);
  font-size: 1.02rem;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--text);
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  text-align: left;
  transition: color var(--t-micro);
  line-height: 1.2;
}
.actor-rel-target:hover { color: var(--accent-bright); }
.actor-rel-conf {
  grid-row: 1;
  font-family: var(--font);
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text-faint);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 0.18rem 0.55rem;
  white-space: nowrap;
  line-height: 1.4;
}
.actor-rel-conf.high { color: var(--accent); border-color: var(--accent-dim); }
.actor-rel-desc {
  grid-column: 2 / 5;
  grid-row: 2;
  font-family: var(--font);
  font-size: 0.92rem;
  line-height: 1.55;
  color: var(--text-dim);
  max-width: 36rem;
  margin: 0;
}

/* 4-axis spec (series mode) */
.actor-spec-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
  gap: 1.3rem;
}
.actor-spec-col {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.actor-spec-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.actor-spec-list li {
  position: relative;
  padding-left: 0.9rem;
  font-size: 0.93rem;
  line-height: 1.5;
  color: var(--text);
}
.actor-spec-list li::before {
  content: "•";
  position: absolute;
  left: 0;
  color: var(--text-faint);
}

/* Relationship graph SVG (series mode) — ego network.
   Editorial radial layout: focal actor's portrait at center, peers arranged
   by relationship-type group (constructive at top, coercive on the sides,
   antagonistic at the bottom). Edges are quadratic Bezier curves with small
   accent arrowheads at the target end; verb labels sit on each curve with a
   bg-colored stroke halo so they punch through the line. */
.actor-graph-wrap {
  display: flex;
  justify-content: center;
  padding: 0.8rem 0 1.4rem;
  scroll-margin-top: calc(var(--timeline-frozen-h, 285px) + 1rem);
}
.actor-graph {
  width: 100%;
  max-width: 48rem;
  height: auto;
  display: block;
}
.actor-graph .edge {
  fill: none;
  stroke: rgba(232,220,200,0.32);
  stroke-linecap: round;
  transition: stroke var(--t-micro), opacity var(--t-micro);
}
.actor-graph .edge.confidence-high   { stroke-width: 1.3; }
.actor-graph .edge.confidence-medium { stroke-width: 1.0; opacity: 0.75; }
.actor-graph .edge.confidence-low    { stroke-width: 0.9; opacity: 0.55; stroke-dasharray: 3 2; }
/* Per-group accent: positive/coercive/antagonistic carry their own register. */
.actor-graph .edge.group-top    { stroke: rgba(232,220,200,0.42); }
.actor-graph .edge.group-side   { stroke: rgba(160,64,64,0.55); }
.actor-graph .edge.group-bottom { stroke: rgba(160,64,64,0.7); }

.actor-graph .peer-portrait,
.actor-graph .center-portrait {
  cursor: pointer;
}
.actor-graph .center-portrait { cursor: default; }
.actor-graph .portrait-img {
  /* Subtle duotone to unify portraits across very different source images. */
  filter: grayscale(0.45) contrast(1.06);
}
.actor-graph .portrait-ring {
  fill: none;
  stroke: rgba(255,255,255,0.08);
}
.actor-graph .center-portrait .portrait-ring {
  stroke: rgba(160,64,64,0.35);
  stroke-width: 1.5;
}
.actor-graph .peer-portrait:hover .portrait-ring {
  stroke: var(--accent);
  stroke-width: 1.5;
}
.actor-graph .node-label {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  fill: var(--text);
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  text-rendering: optimizeLegibility;
}
.actor-graph .center-name {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  fill: var(--text);
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}
/* Edge labels — lowercase, with a bg-colored stroke "halo" so the edge line
   doesn't slash through them. paint-order ensures the halo renders first. */
.actor-graph .edge-label {
  font-family: var(--font);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  fill: var(--text-dim);
  text-anchor: middle;
  dominant-baseline: middle;
  paint-order: stroke fill;
  stroke: #060708;
  stroke-width: 3.5px;
  stroke-linejoin: round;
  pointer-events: none;
}
/* Hover lift: focused peer dims everyone else. JS toggles .is-focused on
   the SVG; CSS does the rest. */
.actor-graph.is-focused .edge:not(.is-on),
.actor-graph.is-focused .peer-portrait:not(.is-on),
.actor-graph.is-focused .node-label:not(.is-on),
.actor-graph.is-focused .edge-label:not(.is-on) { opacity: 0.18; }
.actor-graph.is-focused .edge.is-on { opacity: 1; stroke-width: 1.6; }
.actor-graph.is-focused .peer-portrait.is-on .portrait-ring {
  stroke: var(--accent); stroke-width: 1.6;
}
/* Initials fallback — radial accent gradient matching the rest of the player. */
.actor-graph .initials-bg { fill: url(#actor-graph-initials-gradient); }
.actor-graph .initials-text {
  font-family: var(--font);
  font-weight: 500;
  fill: rgba(232,220,200,0.78);
  text-anchor: middle;
  dominant-baseline: central;
  letter-spacing: -0.02em;
  pointer-events: none;
}

/* Episode appearance timeline (series mode) */
.actor-timeline {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
  gap: 0.6rem;
}
.actor-tl-cell {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  padding: 0.7rem 0.7rem 0.6rem;
  border: 1px solid var(--hairline);
  border-radius: 4px;
  background: none;
  cursor: pointer;
  text-align: left;
  font-family: var(--font);
  min-height: 4.5rem;
  transition: border-color var(--t-micro), background var(--t-micro);
}
.actor-tl-cell.absent {
  opacity: 0.32;
  cursor: default;
  background: transparent;
}
.actor-tl-cell:hover:not(.absent) {
  border-color: var(--accent);
  background: rgba(160,64,64,0.05);
}
.actor-tl-num {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}
.actor-tl-cell.absent .actor-tl-num { color: var(--text-faint); }
.actor-tl-label {
  font-size: 0.78rem;
  line-height: 1.4;
  color: var(--text-dim);
}

/* Source-book list (series mode) */
.actor-source-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.actor-source-list li {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  padding: 0.45rem 0;
  border-top: 1px solid var(--hairline);
}
.actor-source-list li:first-child { border-top: none; padding-top: 0; }
.actor-source-title {
  font-size: 0.92rem;
  font-weight: 500;
  color: var(--text);
}
.actor-source-chapters {
  font-size: 0.78rem;
  color: var(--text-faint);
  font-style: italic;
}

/* All-excerpts pane (series mode) — sortable header */
.actor-excerpts-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
}
.actor-excerpts-sort {
  display: inline-flex;
  gap: 0.2rem;
}
.actor-excerpts-sort button {
  background: none;
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 0.25rem 0.55rem;
  font-family: var(--font);
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text-faint);
  cursor: pointer;
}
.actor-excerpts-sort button.is-active {
  color: var(--accent);
  border-color: var(--accent-dim);
}

</style>
</head>
<body class="mode-follow">

<header class="site-header">
  <div class="brand-cluster">
